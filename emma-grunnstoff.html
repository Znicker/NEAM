function tegnTabell(){
  const rutenett = $('tabell');
  rutenett.textContent = '';

  for(let rad = 1; rad <= 9; rad++){
    /* Litt luft foer lantanoidene, saa de to nederste radene leses som
       et eget hefte og ikke som periode 8 og 9. */
    if(rad === 8){
      const luft = document.createElement('div');
      luft.className = 'gs-rad-merke';
      rutenett.appendChild(luft);
    }
    for(let gr = 1; gr <= 18; gr++){
      const s = STOFFER.filter(function(x){ return x[3] === rad && x[4] === gr; })[0];

      if(!s && (rad === 6 || rad === 7) && gr === 3){
        const peker = document.createElement('div');
        peker.className = 'gs-rute gs-peker';
        peker.textContent = '*';
        peker.setAttribute('aria-hidden', 'true');
        rutenett.appendChild(peker);
        continue;
      }
      if(!s){
        const tom = document.createElement('div');
        tom.className = 'gs-tom';
        rutenett.appendChild(tom);
        continue;
      }

      const b = lagRute(s, false);
      b.onclick = function(){ velgStoff(s[0]); };
      rutenett.appendChild(b);
    }
  }

  const tf = $('tegnforklaring');
  tf.textContent = '';
  Object.keys(KATEGORINAVN).forEach(function(k){
    const rad = document.createElement('span');
    rad.innerHTML = '<i class="gs-prikk gs-' + k + '"></i>' + KATEGORINAVN[k];
    tf.appendChild(rad);
  });
  ['gs-tom-stjerne', 'gs-gull'].forEach(function(klasse, i){
    const rad = document.createElement('span');
    rad.innerHTML = '<img class="gs-forklar-stjerne ' + klasse
      + '" src="/bilder/spill/stjerne.webp?v=1" alt="" width="12" height="12">'
      + (i === 0 ? 'Åpen for prøve' : 'Bestått');
    tf.appendChild(rad);
  });
}

function velgStoff(nr){
  valgtNr = nr;
  tegnLab();
  $('labPanel').scrollIntoView({ behavior:'smooth', block:'nearest' });
}

function nesteStoff(){
  const liste = apneStoffer();
  const i = liste.map(function(s){ return s[0]; }).indexOf(valgtNr);
  valgtNr = liste[(i + 1) % liste.length][0];
  tegnLab();
}

/* ============================================================
   Atomtegningen - felles for laben og byggeplata
   ------------------------------------------------------------
   Én funksjon, to brukere. Byggeplata regner treff mot nøyaktig de
   samme radiene som tegningen bruker, og da kan de to ikke komme i
   utakt slik de kunne da de var to kopier.

   Protonene og noeytronene ligger i et solsikkemoenster: hver kule
   litt lenger ut og 137,5 grader videre rundt. Det pakker et
   vilkaarlig antall kuler jevnt uten aa maatte velges ringvis - og
   kjernen ser ut som en klump, ikke som en stabel.
   ============================================================ */
const MIDT = 180;
const KJERNE_R = 40;
const SKALL_AVSTAND = 30;
const MAKS_SKALL = 4;
const TREFF = 20;             /* hvor naer et skall hun maa slippe */
const GYLDEN = Math.PI * (3 - Math.sqrt(5));   /* 137,5 grader i radianer */

function skallRadius(i){ return KJERNE_R + (i + 1) * SKALL_AVSTAND; }

function kjernePlasser(n){
  const ut = [];
  if(n <= 0) return ut;
  if(n === 1) return [[MIDT, MIDT]];
  const kuleR = n > 26 ? 5.6 : 6.8;
  const spenn = KJERNE_R - kuleR - 1.5;
  for(let i = 0; i < n; i++){
    const r = spenn * Math.sqrt(i / (n - 1));
    const v = i * GYLDEN;
    ut.push([MIDT + Math.cos(v) * r, MIDT + Math.sin(v) * r]);
  }
  return ut;
}

const SVG_NS = 'http://www.w3.org/2000/svg';
function svgEl(navn, attr){
  const e = document.createElementNS(SVG_NS, navn);
  Object.keys(attr || {}).forEach(function(k){ e.setAttribute(k, attr[k]); });
  return e;
}

/* En kule med dybde: gradientfylt, skygge under og et lite hvitt
   glimt oppe til venstre. Glimtet er det som gjoer at den leses som
   rund og ikke som en flat sirkel. */
function kule(x, y, r, gradient){
  const g = svgEl('g', { filter:'url(#gsSkygge)' });
  g.appendChild(svgEl('circle', {
    cx:x.toFixed(1), cy:y.toFixed(1), r:r, fill:'url(#' + gradient + ')'
  }));
  g.appendChild(svgEl('circle', {
    cx:(x - r * 0.3).toFixed(1), cy:(y - r * 0.34).toFixed(1),
    r:(r * 0.26).toFixed(2), fill:'#FFFFFF', opacity:'.55'
  }));
  return g;
}

/* o = { protoner, noytroner, skall, merker, kjerneRamme, fastRamme, aria }

   RAMMA ER FAST PAA BYGGEPLATA OG TRANG I LABEN, og det er ikke en
   smakssak. Plata regner ut hvor hun slapp brikka ved aa gange
   museposisjonen med 360 / bredden - endret utsnittet seg mens hun la
   ut skall, ville treffpunktene flyttet seg under fingeren hennes.
   Laben tegner et ferdig atom som ikke skal endre seg, og der er det
   omvendte problemet det virkelige: hydrogen med ett skall fylte 39 %
   av et lerret laget for fire, og laa som en liten flekk i hjoernet av
   panelet. Maalt paa 1024px 18. september 2026. */
function tegnAtom(o){
  const skall = o.skall || [];
  const ytre = o.fastRamme ? MIDT : Math.max(
    KJERNE_R + 30,
    skall.length ? skallRadius(skall.length - 1) + 14 : 0
  );
  const svg = svgEl('svg', {
    'class':'gs-atom', role:'img',
    viewBox:(MIDT - ytre) + ' ' + (MIDT - ytre) + ' ' + (ytre * 2) + ' ' + (ytre * 2),
    'aria-label':o.aria || 'Atommodell'
  });

  /* Skjaeret foerst, saa ringene, saa kjernen: da ligger kjernen
     oppaa skjaeret sitt og ringene gaar bak den. */
  svg.appendChild(svgEl('circle', {
    cx:MIDT, cy:MIDT, r:KJERNE_R + 26, fill:'url(#gsKjerneGlod)'
  }));

  skall.forEach(function(antall, i){
    const r = skallRadius(i);
    let klasse = 'gs-skall';
    if(o.merker) klasse += o.merker[i] ? ' gs-riktig-skall' : ' gs-feil';
    svg.appendChild(svgEl('circle', { 'class':klasse, cx:MIDT, cy:MIDT, r:r }));
  });

  if(o.kjerneRamme){
    /* Byggeplata tegner kjerneflata ogsaa naar den er tom: hun skal se
       hvor protonene skal, ikke gjette hvor midten er. */
    svg.appendChild(svgEl('circle', {
      cx:MIDT, cy:MIDT, r:KJERNE_R, fill:'rgba(166,77,60,.07)',
      stroke:'url(#gsRing)', 'stroke-width':'1.4',
      'stroke-dasharray':(o.protoner || o.noytroner) ? 'none' : '5 5'
    }));
  }

  /* Protoner og noeytroner legges annenhver, saa kjernen ser blandet ut
     og ikke som to halvdeler. */
  const p = o.protoner || 0, n = o.noytroner || 0;
  const typer = [];
  for(let i = 0; i < Math.max(p, n); i++){
    if(i < p) typer.push('gsProton');
    if(i < n) typer.push('gsNoytron');
  }
  const plasser = kjernePlasser(typer.length);
  const kjerneR = typer.length > 26 ? 5.6 : 6.8;
  plasser.forEach(function(pos, i){
    svg.appendChild(kule(pos[0], pos[1], kjerneR, typer[i]));
  });

  skall.forEach(function(antall, i){
    const r = skallRadius(i);
    for(let e = 0; e < antall; e++){
      /* Foerste elektron rett opp, resten jevnt rundt. Hvert skall
         forskyves litt, saa elektronene i to skall ikke staar paa
         linje og ser ut som ett. */
      const v = (e / Math.max(antall, 1)) * Math.PI * 2 - Math.PI / 2 + i * 0.4;
      svg.appendChild(kule(MIDT + Math.cos(v) * r, MIDT + Math.sin(v) * r, 7, 'gsElektron'));
    }
  });

  if(o.kjerneTekst){
    /* Skriftstoerrelsen regnes mot utsnittet, ikke mot SVG-enheter.
       Utsnittet varierer med hvor mange skall atomet har, og en fast
       stoerrelse ville derfor blitt dobbelt saa stor paa hydrogen som
       paa kalsium - samme tall, to helt ulike ord paa skjermen. */
    const t = svgEl('text', {
      x:MIDT, y:(MIDT + KJERNE_R + ytre * 0.085).toFixed(1),
      'text-anchor':'middle', 'font-size':(ytre * 0.065).toFixed(2)
    });
    t.textContent = o.kjerneTekst;
    svg.appendChild(t);
  }

  return svg;
}

/* ============================================================
   Laben - ett stoff i detalj
   ============================================================ */
function tegnLab(){
  const s = stoffAv(valgtNr);
  const o = OPPBYGNING[valgtNr];
  const apen = erApen(valgtNr);
  const gull = erMestret(valgtNr);
  const info = INFO[valgtNr] || [''];
  const lab = $('lab');
  lab.textContent = '';

  /* --- Venstre: kortet --- */
  const kort = document.createElement('div');
  kort.className = 'gs-kort';
  const rute = document.createElement('div');
  rute.className = 'gs-stor-rute gs-' + s[5];
  rute.innerHTML = '<span class="gs-stor-nr">' + s[0] + '</span>'
                 + '<span class="gs-stor-sym">' + s[1] + '</span>'
                 + '<span class="gs-stor-navn">' + s[2] + '</span>';
  const stjerne = stjerneFor(valgtNr);
  if(stjerne) rute.appendChild(stjerne);
  kort.appendChild(rute);

  const status = document.createElement('p');
  status.className = 'gs-status' + (gull ? ' gs-status-gull' : '');
  status.textContent = gull ? 'Gullstjerne' : (apen ? 'Åpen for prøve' : 'Ikke åpnet ennå');
  kort.appendChild(status);
  lab.appendChild(kort);

  /* --- Midten: hva det er, og tallene --- */
  const midt = document.createElement('div');

  const hva = document.createElement('p');
  hva.className = 'gs-hva';
  hva.textContent = info[0];
  midt.appendChild(hva);

  if(apen && info[1]){
    const hverdag = document.createElement('p');
    hverdag.className = 'gs-hverdag';
    hverdag.textContent = info[1];
    midt.appendChild(hverdag);
  }

  const fakta = document.createElement('dl');
  fakta.className = 'gs-fakta';
  const rader = [
    ['Symbol', s[1]],
    ['Atomnummer', String(s[0])],
    ['Gruppe', KATEGORINAVN[s[5]]],
    ['Periode', s[3] <= 7 ? String(s[3]) : (s[5] === 'lantanoid' ? '6' : '7')],
    ['Tilstand', tilstandAv(s[0]) + (tilstandAv(s[0]) === 'Ukjent' ? '' : ' ved 20 °C')]
  ];
  if(apen && o){
    rader.push(['Protoner', String(s[0])]);
    rader.push(['Elektroner', String(s[0])]);
    rader.push(['Skall', o[1].join(' + ')]);
    const ytterst = o[1][o[1].length - 1];
    rader.push(['Ytterste skall', ytterst + (ytterst === 1 ? ' elektron' : ' elektroner')]);
    if(visNoytron()){
      rader.push(['Nøytroner', String(o[0])]);
      rader.push(['Massetall', String(massetall(s[0])) + ' – protoner + nøytroner']);
    }
  }
  if(!apen){
    /* Over tjue finnes det ingen prøve aa bestaa - skallene kan ikke
       leses av tabellen der, og trinn tre er ikke bygget. Da skal det
       staa, og ikke et løfte om en doer som ikke finnes. */
    rader.push(['Status', s[0] > MAKS_APNE
      ? 'Hører til et senere trinn – prøven finnes for de tjue første'
      : 'Åpnes når du har bestått prøven på ' + forrigeNavn(s[0])]);
  }
  rader.forEach(function(r){
    const d = document.createElement('div');
    const dt = document.createElement('dt'); dt.textContent = r[0];
    const dd = document.createElement('dd'); dd.textContent = r[1];
    d.appendChild(dt); d.appendChild(dd);
    fakta.appendChild(d);
  });
  midt.appendChild(fakta);
  lab.appendChild(midt);

  /* --- Hoeyre: atomet --- */
  if(apen && o){
    lab.appendChild(tegnAtom({
      protoner: s[0],
      noytroner: visNoytron() ? o[0] : 0,
      skall: o[1],
      kjerneTekst: 'KJERNE',
      aria: 'Atommodell av ' + s[2] + ': ' + protonOrd(s[0])
        + (visNoytron() ? ' og ' + noytronOrd(o[0]) : '')
        + ' i kjernen, og elektroner fordelt på ' + o[1].join(', ') + '.'
    }));
  }

  tegnLabKnapper(apen, !!o);
}

/* Stoffet rett foer dette i rekka - det er det hun maa bestaa for aa
   aapne dette. Uttrykt med navn og ikke nummer: «Natrium» sier mer enn
   «stoff 11» naar hun staar og lurer paa hva som mangler. */
function forrigeNavn(nr){
  const f = stoffAv(nr - 1);
  return f ? f[2] : 'stoffet før';
}

function tegnLabKnapper(apen, harOppbygning){
  const boks = $('labKnapper');
  boks.textContent = '';

  function knapp(tekst, tung, fn){
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'gs-knapp' + (tung ? ' gs-tung' : '');
    b.textContent = tekst;
    b.onclick = fn;
    boks.appendChild(b);
    return b;
  }

  if(apen && harOppbygning){
    if(!erMestret(valgtNr)) knapp('Ta prøven', true, function(){ startProve(valgtNr); });
    else knapp('Ta prøven om igjen', false, function(){ startProve(valgtNr); });
    knapp('Øv på å bygge det', false, byggDette);
  }
  knapp('Neste stoff', false, nesteStoff);

  if(!apen){
    const p = document.createElement('p');
    p.className = 'gs-sporsmaal-sub';
    p.style.margin = '10px 0 0';
    p.style.width = '100%';
    p.textContent = valgtNr > MAKS_APNE
      ? 'Du kan lese om alle 118 stoffene. Prøven og byggingen gjelder de tjue '
        + 'første – lenger går ikke spillet ennå.'
      : 'Du kan lese om alle 118 stoffene. Prøven og byggingen åpner seg '
        + 'ett stoff om gangen, etter hvert som du består.';
    boks.appendChild(p);
  }
}

/* ============================================================
   Laeringsboksen - noeytronet
   ------------------------------------------------------------
   Kommer foerst naar hun har aapnet stoff elleve. Foer det ville
   noeytroner bare vaert et tall hun fikk oppgitt; etter den er de
   noe hun regner ut av massetallet.
   ============================================================ */
const NOYTRON_SPM = [
  { tekst:'Hva slags ladning har et nøytron?',
    fasit:'Ingen ladning',
    alternativ:['Ingen ladning', 'Positiv, som protonet', 'Negativ, som elektronet', 'Det kommer an på stoffet'] },
  { tekst:'Hvor i atomet ligger nøytronene?',
    fasit:'I kjernen, sammen med protonene',
    alternativ:['I kjernen, sammen med protonene', 'I det innerste skallet', 'I det ytterste skallet', 'Utenfor atomet'] },
  { tekst:'Hva er massetallet til et atom?',
    fasit:'Protoner + nøytroner til sammen',
    alternativ:['Protoner + nøytroner til sammen', 'Bare antall protoner', 'Protoner + elektroner', 'Antall skall ganger to'] },
  { tekst:'Natrium har atomnummer 11 og massetall 23. Hvor mange nøytroner?',
    fasit:'12',
    alternativ:['12', '11', '23', '34'] },
  { tekst:'Karbon har 6 protoner og 6 nøytroner. Hva er massetallet?',
    fasit:'12',
    alternativ:['12', '6', '18', '36'] }
];

function tegnLaerPanel(){
  const panel = $('laerPanel');
  if(!kanNoytron() || visNoytron()){
    panel.classList.add('gs-skjult');
    panel.textContent = '';
    laerTest = null;
    return;
  }
  panel.classList.remove('gs-skjult');
  if(laerTest) return;   /* testen er i gang - ikke tegn teksten over den */

  panel.innerHTML =
    '<span class="gs-laer-merke">Nytt å lære</span>'
  + '<h2 class="gs-panel-tittel">Den tredje partikkelen: nøytronet</h2>'
  + '<p>Du har bygget ti atomer med protoner og elektroner. Men kjernen har '
  + 'én ting til i seg: <b>nøytroner</b>. De er omtrent like tunge som '
  + 'protonene, men de har <b>ingen ladning</b> – verken pluss eller minus.</p>'
  + '<p>Antall nøytroner kan du ikke lese ut av atomnummeret. Derfor får du '
  + 'oppgitt <b>massetallet</b>, som er protoner og nøytroner lagt sammen. '
  + 'Da kan du regne ut resten selv:</p>'
  + '<div class="gs-regnestykke">nøytroner = massetall − atomnummer</div>'
  + '<p>Natrium har atomnummer 11 og massetall 23. Da er 23 − 11 = <b>12 '
  + 'nøytroner</b> i kjernen.</p>'
  + '<p>Klarer du fem spørsmål om dette, får du <b>500 XP</b> – og fra da av '
  + 'er nøytronene med i tegningene, i faktalista og i byggeboksen.</p>';

  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'gs-knapp gs-tung';
  b.textContent = 'Ta nøytrontesten';
  b.onclick = startLaerTest;
  panel.appendChild(b);
}

function startLaerTest(){
  laerTest = { steg:0, riktige:0 };
  tegnLaerSporsmaal();
  $('laerPanel').scrollIntoView({ behavior:'smooth', block:'nearest' });
}

function tegnLaerSporsmaal(){
  const panel = $('laerPanel');
  const sp = NOYTRON_SPM[laerTest.steg];
  panel.textContent = '';

  const teller = document.createElement('p');
  teller.className = 'gs-teller';
  teller.textContent = 'Nøytrontesten – spørsmål ' + (laerTest.steg + 1)
    + ' av ' + NOYTRON_SPM.length;
  panel.appendChild(teller);

  const tekst = document.createElement('p');
  tekst.className = 'gs-sporsmaal';
  tekst.textContent = sp.tekst;
  panel.appendChild(tekst);

  /* Fasitlinja lages FOER knappene som skal skrive i den. Leses en
     `const` foer den er definert, tar det ned hele sidens skript uten
     spor - se kartleggingen del 26. At den her ville rukket aa bli
     definert foer et klikk, gjoer den ikke mindre farlig aa skrive. */
  const fasitlinje = document.createElement('p');
  fasitlinje.className = 'gs-fasit';

  const svarboks = document.createElement('div');
  svarboks.className = 'gs-svar';
  blandet(sp.alternativ).forEach(function(alt){
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'gs-svar-knapp';
    b.textContent = alt;
    b.onclick = function(){ svarLaer(alt, b, svarboks, fasitlinje); };
    svarboks.appendChild(b);
  });
  panel.appendChild(svarboks);
  panel.appendChild(fasitlinje);
}

function svarLaer(valgt, knapp, boks, fasitlinje){
  const sp = NOYTRON_SPM[laerTest.steg];
  const riktig = valgt === sp.fasit;
  if(riktig) laerTest.riktige++;

  Array.prototype.forEach.call(boks.children, function(b){
    b.disabled = true;
    if(b.textContent === sp.fasit) b.classList.add('gs-riktig');
  });
  if(!riktig) knapp.classList.add('gs-galt');
  fasitlinje.textContent = riktig ? 'Riktig.' : 'Riktig svar er ' + sp.fasit + '.';

  setTimeout(function(){
    laerTest.steg++;
    if(laerTest.steg < NOYTRON_SPM.length) tegnLaerSporsmaal();
    else avsluttLaerTest();
  }, riktig ? 700 : 1700);
}

async function avsluttLaerTest(){
  const alle = laerTest.riktige === NOYTRON_SPM.length;
  const panel = $('laerPanel');
  panel.textContent = '';

  if(!alle){
    panel.innerHTML =
      '<span class="gs-laer-merke">Nytt å lære</span>'
    + '<h2 class="gs-panel-tittel">Nesten</h2>'
    + '<p>Du hadde ' + laerTest.riktige + ' av ' + NOYTRON_SPM.length
    + ' riktig. Les gjennom en gang til, så tar du den på nytt – '
    + 'den venter her til du er klar.</p>';
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'gs-knapp gs-tung';
    b.textContent = 'Les om nøytronet igjen';
    b.onclick = function(){ laerTest = null; tegnLaerPanel(); };
    panel.appendChild(b);
    return;
  }

  laerTest = null;
  data.noytron = 1;
  data.runder.push({ id:nyId(), tid:Date.now(), type:'noytron' });
  girXp(XP_NOYTRON, 'nøytronet er lært.');

  /* Resten av sida tegnes opp FOER kvitteringen skrives, og med hver
     tegner for seg - ikke tegnAlt(). tegnAlt() ville kalt
     tegnLaerPanel(), og den tømmer nettopp dette panelet naa som
     noeytronet er laert. Kvitteringen ville altsaa slettet seg selv i
     samme oeyeblikk den ble skrevet. */
  tegnTabell();
  tegnLab();
  tegnFramdrift();
  if(bygg) tegnBygg();

  panel.classList.remove('gs-skjult');
  panel.innerHTML =
    '<span class="gs-laer-merke">Lært</span>'
  + '<h2 class="gs-panel-tittel">Fem av fem</h2>'
  + '<p>Nøytronene er med fra nå: du ser dem i grått i kjernen, massetallet '
  + 'står i faktalista, og i byggeboksen er det kommet en beholder til. '
  + 'Når du bygger, får du massetallet oppgitt – nøytronene regner du ut selv.</p>'
  + '<p class="gs-xp-gitt">+500 XP</p>';

  await lagre();
}

/* ============================================================
   Spoersmaalene
   ============================================================ */
function blandet(liste){
  const b = liste.slice();
  for(let i = b.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const t = b[i]; b[i] = b[j]; b[j] = t;
  }
  return b;
}

function nyId(){
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}

/* Alternativene hentes fra ANDRE stoffers ekte verdier, ikke fra
   oppdiktede tall - da er et galt svar noe som finnes, og hun kan se
   hvorfor det ikke passer. */
function lagSporsmaal(s, type){
  const andre = apneStoffer().filter(function(x){ return x[0] !== s[0]; });
  const tre = blandet(andre).slice(0, 3);
  const o = OPPBYGNING[s[0]];

  if(type === 'navn'){
    return { tekst:'Hvilket grunnstoff har symbolet ' + s[1] + '?',
             sub:'Atomnummer ' + s[0] + '.',
             fasit:s[2], alternativ:blandet([s[2]].concat(tre.map(function(x){ return x[2]; }))) };
  }
  if(type === 'symbol'){
    return { tekst:'Hva er det kjemiske symbolet for ' + s[2] + '?', sub:'',
             fasit:s[1], alternativ:blandet([s[1]].concat(tre.map(function(x){ return x[1]; }))) };
  }
  if(type === 'nummer'){
    return { tekst:'Hvilket atomnummer har ' + s[2] + '?',
             sub:'Atomnummeret er hvor mange protoner kjernen har.',
             fasit:String(s[0]),
             alternativ:blandet([String(s[0])].concat(tre.map(function(x){ return String(x[0]); }))) };
  }
  if(type === 'gruppe'){
    const feil = [];
    blandet(Object.keys(KATEGORINAVN)).forEach(function(k){
      if(k !== s[5] && feil.length < 3) feil.push(KATEGORINAVN[k]);
    });
    return { tekst:'Hvilken gruppe hører ' + s[2] + ' til?',
             sub:'Fargen i tabellen viser gruppa.',
             fasit:KATEGORINAVN[s[5]], alternativ:blandet([KATEGORINAVN[s[5]]].concat(feil)) };
  }
  if(type === 'tilstand'){
    /* Alternativene blandes. Sto de i fast rekkefoelge, ville «fast
       stoff» staatt foerst hver eneste gang - og det er riktig svar for
       de aller fleste stoffene. Da laerer hun plasseringen. */
    const min = tilstandAv(s[0]);
    return { tekst:'Hvilken tilstand har ' + s[2] + ' i romtemperatur?',
             sub:'Rundt 20 °C, altså slik det er inne hos deg.',
             fasit:min, alternativ:blandet(['Fast stoff', 'Væske', 'Gass']) };
  }
  if(type === 'ytterskall'){
    const min = String(o[1][o[1].length - 1]);
    const feil = [];
    blandet(andre).forEach(function(x){
      const p = OPPBYGNING[x[0]];
      const f = p && String(p[1][p[1].length - 1]);
      if(f && f !== min && feil.indexOf(f) === -1 && feil.length < 3) feil.push(f);
    });
    return { tekst:'Hvor mange elektroner har ' + s[2] + ' i det ytterste skallet?',
             sub:'Det er det ytterste skallet som bestemmer hvordan stoffet oppfører seg.',
             fasit:min, alternativ:blandet([min].concat(feil)) };
  }
  if(type === 'noytroner'){
    /* De gale svarene er de tre naerliggende feilene: atomnummeret,
       massetallet og summen av de to. For hydrogen faller to av dem
       sammen med hverandre, saa lista maa lukes - to like alternativer
       ville vaert to riktige svar paa ett spoersmaal. */
    const min = String(o[0]);
    const mt = massetall(s[0]);
    const feil = [];
    [String(s[0]), String(mt), String(mt + s[0]), String(o[0] + 2), String(Math.abs(o[0] - 2))]
      .forEach(function(f){
        if(f !== min && feil.indexOf(f) === -1 && feil.length < 3) feil.push(f);
      });
    return { tekst:'Hvor mange nøytroner har ' + s[2] + '?',
             sub:s[2] + ' har atomnummer ' + s[0] + ' og massetall ' + mt + '.',
             fasit:min, alternativ:blandet([min].concat(feil)) };
  }
  /* Oppbygningen: elektronene fordelt paa skall. */
  const min = o[1].join(', ');
  const feil = [];
  blandet(andre).forEach(function(x){
    const f = OPPBYGNING[x[0]] && OPPBYGNING[x[0]][1].join(', ');
    if(f && f !== min && feil.indexOf(f) === -1 && feil.length < 3) feil.push(f);
  });
  return { tekst:'Hvordan ligger elektronene i ' + s[2] + '?',
           sub:s[2] + ' har ' + elektronOrd(s[0]) + '. Innerste skall først.',
           fasit:min, alternativ:blandet([min].concat(feil)) };
}

/* ============================================================
   Proeven - fem spoersmaal om ett stoff, og saa byggingen
   ============================================================ */
const PROVE_TYPER = ['navn', 'symbol', 'nummer', 'skall', 'gruppe', 'tilstand', 'ytterskall'];

function velgVei(vei){
  testVei = vei;
  $('veiProve').classList.toggle('gs-pa', vei === 'prove');
  $('veiOving').classList.toggle('gs-pa', vei === 'oving');
  $('oppsettProve').classList.toggle('gs-skjult', vei !== 'prove');
  $('oppsettOving').classList.toggle('gs-skjult', vei !== 'oving');
}

function tegnProveValg(){
  const boks = $('valgProveStoff');
  boks.textContent = '';
  const liste = apneStoffer().filter(function(s){ return OPPBYGNING[s[0]]; });

  /* Standardvalget er det foerste hun ikke har gullstjerne paa - det er
     nesten alltid det hun er ute etter, og da slipper hun aa lete. */
  if(!proveStoff || liste.map(function(s){ return s[0]; }).indexOf(proveStoff) === -1){
    const uten = liste.filter(function(s){ return !erMestret(s[0]); })[0];
    proveStoff = (uten || liste[liste.length - 1])[0];
  }

  liste.forEach(function(s){
    const b = lagRute(s, true);
    if(s[0] === proveStoff) b.style.outline = '3px solid var(--messing)';
    b.onclick = function(){ proveStoff = s[0]; tegnProveValg(); };
    boks.appendChild(b);
  });

  const s = stoffAv(proveStoff);
  $('proveHint').textContent = 'Velg stoffet du vil prøves i. Du står på '
    + s[2] + ' – fem spørsmål, og så bygger du atomet.';
  $('startProveKnapp').textContent = 'Start prøven på ' + s[2];
}

function startProve(nr){
  const stoffNr = nr || proveStoff;
  if(!OPPBYGNING[stoffNr]){
    si('Prøven finnes bare for de tjue første stoffene.');
    return;
  }
  if(!erApen(stoffNr)){
    si(stoffAv(stoffNr)[2] + ' er ikke åpnet ennå.');
    return;
  }

  const s = stoffAv(stoffNr);
  const typer = PROVE_TYPER.slice();
  if(visNoytron()) typer.push('noytroner');

  prove = {
    id: nyId(),
    nr: stoffNr,
    tid: Date.now(),
    steg: 0,
    svar: [],
    sporsmaal: blandet(typer).slice(0, 5).map(function(t){
      return Object.assign({ stoff:stoffNr, type:t }, lagSporsmaal(s, t));
    })
  };
  runde = null;
  proveStoff = stoffNr;

  visFane('test', true);
  $('testOppsett').classList.add('gs-skjult');
  $('testResultat').classList.add('gs-skjult');
  $('testSpill').classList.remove('gs-skjult');
  $('testPrikker').classList.remove('gs-skjult');
  tegnSporsmaal();
}

/* ============================================================
   Oevingsrunden - blandet, over alt hun har tilgang til
   ------------------------------------------------------------
   Hun velger selv hvor stor testen er og hvilke sider av stoffet
   den spoer om. Da skalerer den samme sida fra to minutter i bilen
   til en oekt ved bordet, uten at det bygges to ting.

   Den AAPNER INGENTING. Det gjoer bare proeven. Det er med vilje: to
   veier som begge laaser opp ville gjort det uklart hva som teller.
   ============================================================ */
const ANTALL = [5, 10, 15];
const SIDER = [
  { id:'navn',      navn:'Navn',       hint:'Hvilket stoff har dette symbolet?' },
  { id:'symbol',    navn:'Symbol',     hint:'Hva er symbolet for stoffet?' },
  { id:'nummer',    navn:'Atomnummer', hint:'Hvilket atomnummer har stoffet?' },
  { id:'skall',     navn:'Oppbygning', hint:'Hvordan ligger elektronene?' },
  { id:'gruppe',    navn:'Gruppe',     hint:'Hvilken gruppe hører stoffet til?' },
  { id:'ytterskall',navn:'Ytterskall', hint:'Hvor mange elektroner ytterst?' }
];

let valgAntall = 10;
let valgteSider = { navn:true, symbol:true, nummer:true, skall:false, gruppe:false, ytterskall:false };

function tegnValg(){
  const a = $('valgAntall');
  a.textContent = '';
  ANTALL.forEach(function(n){
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'gs-velger' + (valgAntall === n ? ' gs-pa' : '');
    b.innerHTML = n + ' spørsmål<span class="gs-xp-lapp">inntil '
                + (n * XP_PER_RIKTIG) + ' XP</span>';
    b.onclick = function(){ valgAntall = n; tegnValg(); };
    a.appendChild(b);
  });

  const s = $('valgSider');
  s.textContent = '';
  SIDER.forEach(function(side){
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'gs-velger' + (valgteSider[side.id] ? ' gs-pa' : '');
    b.innerHTML = '<span class="gs-hake">✓</span>' + side.navn;
    b.onclick = function(){
      valgteSider[side.id] = !valgteSider[side.id];
      tegnValg();
    };
    s.appendChild(b);
  });

  const noen = SIDER.some(function(x){ return valgteSider[x.id]; });
  $('startKnapp').disabled = !noen;
  $('testHint').textContent = noen
    ? 'Du øver på de ' + apne() + ' første stoffene. 10 XP for hvert riktige svar.'
    : 'Velg minst én side av stoffet.';
}

function startRunde(){
  const typer = SIDER.map(function(x){ return x.id; })
                     .filter(function(id){ return valgteSider[id]; });
  if(!typer.length) return;

  /* Stoffene trekkes uten gjentakelse saa langt de rekker. Er testen
     lengre enn lista, begynner den paa nytt i ny rekkefoelge. */
  const pott = [];
  while(pott.length < valgAntall){
    blandet(apneStoffer()).forEach(function(s){ if(pott.length < valgAntall) pott.push(s); });
  }

  runde = {
    id: nyId(),
    tid: Date.now(),
    sider: typer.slice(),
    apne: apne(),
    steg: 0,
    svar: [],
    sporsmaal: pott.map(function(s){
      let t = typer[Math.floor(Math.random() * typer.length)];
      /* Skall- og ytterskallspoersmaal krever at stoffet har en
         oppbygning i datasettet. Har det ikke det, byttes typen - hun
         skal aldri faa et spoersmaal spillet ikke kan rette. */
      if((t === 'skall' || t === 'ytterskall') && !OPPBYGNING[s[0]]){
        const uten = typer.filter(function(x){ return x !== 'skall' && x !== 'ytterskall'; });
        t = uten.length ? uten[Math.floor(Math.random() * uten.length)] : 'navn';
      }
      return Object.assign({ stoff:s[0], type:t }, lagSporsmaal(s, t));
    })
  };
  prove = null;

  $('testOppsett').classList.add('gs-skjult');
  $('testResultat').classList.add('gs-skjult');
  $('testSpill').classList.remove('gs-skjult');
  $('testPrikker').classList.add('gs-skjult');
  tegnSporsmaal();
}

/* ---- Felles spoersmaalsvisning for proeven og oevingsrunden ---- */
function aktiv(){ return prove || runde; }

function tegnSporsmaal(){
  const a = aktiv();
  const sp = a.sporsmaal[a.steg];

  $('testTeller').textContent = prove
    ? 'Prøven på ' + stoffAv(prove.nr)[2] + ' – spørsmål ' + (a.steg + 1)
      + ' av ' + a.sporsmaal.length
    : 'Spørsmål ' + (a.steg + 1) + ' av ' + a.sporsmaal.length;
  $('testSporsmaal').textContent = sp.tekst;
  $('testSub').textContent = sp.sub || '';
  $('testFasit').textContent = '';

  const boks = $('testSvar');
  boks.textContent = '';
  sp.alternativ.forEach(function(alt){
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'gs-svar-knapp';
    b.textContent = alt;
    b.onclick = function(){ svar(alt, b); };
    boks.appendChild(b);
  });

  if(prove) tegnPrikker();
}

function tegnPrikker(){
  const boks = $('testPrikker');
  boks.textContent = '';
  for(let i = 0; i < prove.sporsmaal.length; i++){
    const i_ = document.createElement('i');
    const s = prove.svar[i];
    if(s) i_.className = s.riktig ? 'gs-p-riktig' : 'gs-p-bom';
    boks.appendChild(i_);
  }
}

function svar(valgt, knapp){
  const a = aktiv();
  const sp = a.sporsmaal[a.steg];
  const riktig = valgt === sp.fasit;

  Array.prototype.forEach.call($('testSvar').children, function(b){
    b.disabled = true;
    if(b.textContent === sp.fasit) b.classList.add('gs-riktig');
  });
  if(!riktig) knapp.classList.add('gs-galt');

  a.svar.push({ stoff:sp.stoff, type:sp.type, riktig:riktig,
                valgt:valgt, fasit:sp.fasit });
  if(prove) tegnPrikker();

  const s = stoffAv(sp.stoff);
  $('testFasit').textContent = riktig
    ? 'Riktig.'
    : 'Riktig svar er ' + sp.fasit + ' – ' + s[2] + '.';

  setTimeout(function(){
    a.steg++;
    if(a.steg < a.sporsmaal.length) tegnSporsmaal();
    else if(prove) avsluttProveSporsmaal();
    else avsluttRunde();
  }, riktig ? 650 : 1500);
}

/* Fem stjerner for alt riktig, saa ned i femtedeler med 1 som gulv -
   samme skala som mattespillet. Hun har oevd uansett. */
function stjernerAv(andel){
  return Math.max(1, Math.round(andel * 5));
}

function stjernerad(antall, av){
  const boks = document.createElement('div');
  boks.className = 'gs-stjerner';
  for(let i = 0; i < av; i++){
    const bilde = document.createElement('img');
    bilde.className = 'gs-stjerne' + (i < antall ? '' : ' gs-tom-stjerne');
    bilde.src = '/bilder/spill/stjerne.webp?v=1';
    bilde.alt = ''; bilde.width = 44; bilde.height = 44;
    bilde.onerror = function(){ this.hidden = true; };
    boks.appendChild(bilde);
  }
  return boks;
}

function fasitliste(svarene){
  const liste = document.createElement('div');
  liste.className = 'gs-fasitliste';
  svarene.forEach(function(s, i){
    const rad = document.createElement('div');
    rad.className = 'gs-fasitrad' + (s.riktig ? '' : ' gs-bom');
    const stoff = stoffAv(s.stoff);
    rad.innerHTML = '<span>' + (i + 1) + '.</span><span>' + stoff[2] + ' – '
      + (s.riktig ? 'riktig' : 'du svarte ' + s.valgt + ', riktig er ' + s.fasit) + '</span>';
    liste.appendChild(rad);
  });
  return liste;
}

function knappRad(knapper){
  const rad = document.createElement('div');
  rad.className = 'gs-lab-knapper';
  rad.style.justifyContent = 'center';
  knapper.forEach(function(k){
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'gs-knapp' + (k[1] ? ' gs-tung' : '');
    b.textContent = k[0];
    b.onclick = k[2];
    rad.appendChild(b);
  });
  return rad;
}

/* ---- Proeven: fra spoersmaal til bygging ---- */
function avsluttProveSporsmaal(){
  const riktige = prove.svar.filter(function(s){ return s.riktig; }).length;
  const s = stoffAv(prove.nr);

  $('testSpill').classList.add('gs-skjult');
  $('testResultat').classList.remove('gs-skjult');
  const ut = $('resultatInnhold');
  ut.textContent = '';

  if(riktige < prove.sporsmaal.length){
    /* Ingen stjerne, men heller ingen straff: runden lagres som oeving,
       slik at den teller i framdrifta og gir XP for det hun fikk til. */
    data.runder.push({ id:prove.id, tid:prove.tid, antall:prove.svar.length,
                       riktige:riktige, sider:['prøve'], apne:apne(), stoff:prove.nr });
    const gitt = riktige * XP_PER_RIKTIG;

    ut.appendChild(stjernerad(stjernerAv(riktige / prove.sporsmaal.length), 5));
    const t = document.createElement('p');
    t.className = 'gs-sporsmaal';
    t.textContent = riktige + ' av ' + prove.sporsmaal.length + ' riktig';
    ut.appendChild(t);
    const sub = document.createElement('p');
    sub.className = 'gs-sporsmaal-sub';
    sub.textContent = 'Gullstjerna krever alle fem. Se gjennom under, og ta den '
      + 'om igjen når du vil – det koster ingenting å prøve.';
    ut.appendChild(sub);
    const lapp = document.createElement('p');
    lapp.className = 'gs-xp-gitt';
    lapp.textContent = '+' + gitt + ' XP';
    ut.appendChild(lapp);

    const nr = prove.nr;
    ut.appendChild(knappRad([
      ['Prøv igjen', true, function(){ startProve(nr); }],
      ['Til tabellen', false, function(){ valgtNr = nr; tegnLab(); visFane('tabell'); }]
    ]));
    ut.appendChild(fasitliste(prove.svar));

    girXp(gitt, 'øving på ' + s[2] + '.');
    prove = null;
    tegnFramdrift();
    lagre();
    return;
  }

  /* Alle fem: videre til byggingen. */
  ut.appendChild(stjernerad(5, 5));
  const t = document.createElement('p');
  t.className = 'gs-sporsmaal';
  t.textContent = 'Fem av fem på ' + s[2];
  ut.appendChild(t);
  const sub = document.createElement('p');
  sub.className = 'gs-sporsmaal-sub';
  sub.textContent = 'Én ting igjen før gullstjerna: bygg atomet.';
  ut.appendChild(sub);

  const nr = prove.nr;
  ut.appendChild(knappRad([
    ['Bygg ' + s[2], true, function(){ byggProve(nr); }]
  ]));
}

function byggProve(nr){
  visFane('bygg', true);
  nyttBygg(nr, true);
}

/* ---- Oevingsrunden: resultatet ---- */
async function avsluttRunde(){
  const riktige = runde.svar.filter(function(s){ return s.riktig; }).length;
  const andel = riktige / runde.svar.length;
  const gitt = riktige * XP_PER_RIKTIG;

  data.runder.push({ id:runde.id, tid:runde.tid, antall:runde.svar.length,
                     riktige:riktige, sider:runde.sider, apne:runde.apne });

  $('testSpill').classList.add('gs-skjult');
  $('testResultat').classList.remove('gs-skjult');
  const ut = $('resultatInnhold');
  ut.textContent = '';

  const tittel = document.createElement('h2');
  tittel.className = 'gs-panel-tittel';
  tittel.textContent = 'Runden er ferdig';
  ut.appendChild(tittel);

  ut.appendChild(stjernerad(stjernerAv(andel), 5));

  const t = document.createElement('p');
  t.className = 'gs-sporsmaal';
  t.textContent = riktige + ' av ' + runde.svar.length + ' riktig';
  ut.appendChild(t);

  const lapp = document.createElement('p');
  lapp.className = 'gs-xp-gitt';
  lapp.textContent = '+' + gitt + ' XP';
  ut.appendChild(lapp);

  const sub = document.createElement('p');
  sub.className = 'gs-sporsmaal-sub';
  sub.textContent = andel === 1
    ? 'Alt riktig. Nye stoffer åpner du med prøven.'
    : 'Se gjennom dem du bommet på under.';
  ut.appendChild(sub);

  ut.appendChild(knappRad([
    ['Én gang til', true, startRunde],
    ['Til tabellen', false, function(){ visFane('tabell'); }]
  ]));
  ut.appendChild(fasitliste(runde.svar));

  girXp(gitt, 'øving.');
  runde = null;
  tegnTabell();
  tegnFramdrift();
  await lagre();
}

/* ============================================================
   Bygg atom
   ------------------------------------------------------------
   Hun faar navn, symbol og atomnummer, og setter sammen resten
   selv: protoner i kjernen, skall rundt, elektroner i skallene.
   Det gjoer atomnummeret til noe hun konstruerer i stedet for noe
   hun husker - og det retter seg selv, fordi to i foerste skall og
   aatte i neste er en regel og ikke en smakssak.

   ETTER NOEYTRONTESTEN kommer noeytronene med. Hun faar massetallet
   oppgitt og regner selv ut hvor mange som mangler - tallet er
   fortsatt ikke noe hun kan lese av atomnummeret, men naa er det noe
   hun REGNER, og det er en annen sak enn aa faa det servert.
   ============================================================ */
const MAKS_BRIKKER = 60;   /* tak som verner tegningen, ikke en fasit */

let bygg = null;
let valgtBrikke = null;   /* brikka hun har trykket paa, i trykk-modus */

function nyttBygg(nr, erProve){
  bygg = { nr:nr, protoner:0, noytroner:0, skall:[], historikk:[],
           merker:null, forsok:0, lost:false, prove:!!erProve };
  valgtBrikke = null;
  tegnBygg();
  $('byggSvar').textContent = '';
  $('byggSvar').classList.remove('gs-klart');
}

function byggDette(){
  if(!OPPBYGNING[valgtNr]){
    si('Dette stoffet kan ikke bygges ennå. Prøv et av de tjue første.');
    return;
  }
  visFane('bygg', true);
  nyttBygg(valgtNr, false);
}

function nyttByggeStoff(){
  const mulige = apneStoffer().filter(function(s){
    return OPPBYGNING[s[0]] && (!bygg || s[0] !== bygg.nr);
  });
  const s = mulige[Math.floor(Math.random() * mulige.length)];
  nyttBygg(s[0], false);
}

function tegnBygg(){
  const plate = $('plate');
  const s = stoffAv(bygg.nr);

  plate.textContent = '';
  plate.appendChild(tegnAtom({
    protoner: bygg.protoner,
    noytroner: bygg.noytroner,
    skall: bygg.skall,
    merker: bygg.merker,
    kjerneRamme: true,
    fastRamme: true,
    aria: 'Byggeplate for ' + s[2] + ': ' + protonOrd(bygg.protoner)
      + (visNoytron() ? ' og ' + noytronOrd(bygg.noytroner) : '')
      + ' i kjernen, ' + bygg.skall.length + ' skall med '
      + (bygg.skall.join(', ') || 'ingen elektroner')
  }));

  tegnMagasin();
}

function tegnMagasin(){
  const s = stoffAv(bygg.nr);
  const elektroner = bygg.skall.reduce(function(n, x){ return n + x; }, 0);
  const mt = massetall(bygg.nr);

  $('byggTittel').textContent = bygg.prove
    ? 'Prøven på ' + s[2] + ' – siste del'
    : 'Bygg atomet';

  let oppgave = 'Bygg <b>' + s[2] + '</b>.<br>Atomnummer <b>' + s[0]
              + '</b> – symbol <b>' + s[1] + '</b>.';
  if(visNoytron()){
    oppgave += '<br>Massetall <b>' + mt + '</b> – hvor mange nøytroner blir det?';
  }
  if(bygg.prove){
    oppgave += '<br>Får du dette riktig, er gullstjerna din.';
  }

  $('byggOppgave').innerHTML =
    '<div class="gs-stor-rute gs-' + s[5] + '">'
  + '<span class="gs-stor-nr">' + s[0] + '</span>'
  + '<span class="gs-stor-sym">' + s[1] + '</span>'
  + '<span class="gs-stor-navn">' + s[2] + '</span></div>'
  + '<div class="gs-oppgave-tekst">' + oppgave + '</div>';

  /* Beholderne er utoemmelige - tallet under er hvor mange hun HAR lagt
     ut, ikke hvor mange hun har igjen. */
  const brikker = [
    { type:'proton',  navn:'Protoner',  tall:bygg.protoner + ' lagt ut' }
  ];
  if(visNoytron()){
    brikker.push({ type:'noytron', navn:'Nøytroner', tall:bygg.noytroner + ' lagt ut' });
  }
  brikker.push({ type:'elektron', navn:'Elektroner', tall:elektroner + ' lagt ut' });
  brikker.push({ type:'skall', navn:'Skall',
                 tall:bygg.skall.length + ' av ' + MAKS_SKALL });

  const m = $('magasin');
  m.textContent = '';
  brikker.forEach(function(b){
    const knapp = document.createElement('button');
    knapp.type = 'button';
    knapp.className = 'gs-beholder' + (valgtBrikke === b.type ? ' gs-valgt' : '');
    knapp.dataset.type = b.type;
    knapp.innerHTML = '<span class="gs-beholder-glass">'
                    + '<span class="gs-kule gs-k-' + b.type + '"></span></span>'
                    + '<span class="gs-beholder-navn">' + b.navn + '</span>'
                    + '<span class="gs-beholder-tall">' + b.tall + '</span>';
    bindBrikke(knapp, b.type);
    m.appendChild(knapp);
  });

  $('byggStatus').textContent = 'I kjernen: ' + protonOrd(bygg.protoner)
    + (visNoytron() ? ' og ' + noytronOrd(bygg.noytroner) : '')
    + ' · I skallene: ' + (bygg.skall.join(', ') || 'ingen');

  tegnByggKnapper();
}

function tegnByggKnapper(){
  const boks = $('byggKnapper');
  boks.textContent = '';
  [['Ferdig', true, sjekkBygg],
   ['Angre', false, angreBygg],
   ['Tøm', false, tomBygg],
   [bygg.prove ? 'Avbryt prøven' : 'Nytt stoff', false,
     bygg.prove ? avbrytProveBygg : nyttByggeStoff]
  ].forEach(function(k){
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'gs-knapp' + (k[1] ? ' gs-tung' : '');
    b.textContent = k[0];
    b.onclick = k[2];
    boks.appendChild(b);
  });
}

function avbrytProveBygg(){
  /* Avbryt er noeytral og spoer ikke: det eneste som gaar tapt er
     brikkene paa plata, og de kan legges ut igjen paa et minutt.
     Se designsystemet, «Bekreftelsen kommer bare naar det finnes noe
     aa miste». */
  const nr = bygg.nr;
  bygg = null;
  si('Prøven er avbrutt. Du kan ta den om igjen når du vil.');
  valgtNr = nr;
  tegnLab();
  visFane('tabell');
}

/* ---- Draing og trykk ----
   Én funksjon plasserer, og begge veier ender i den. Draget er bygget
   paa pointer-hendelser, ikke HTML5 drag-and-drop: den siste finnes
   ikke paa iOS.

   DET SOM FOELGER FINGEREN ER BARE KULA. Foer 18. september fulgte hele
   brikka med navnet paa - og navnet dekket nettopp det stedet paa plata
   hun siktet mot. */
function bindBrikke(knapp, type){
  let flyt = null, flyttet = false, start = null;

  knapp.addEventListener('pointerdown', function(e){
    start = { x:e.clientX, y:e.clientY };
    flyttet = false;
    knapp.setPointerCapture(e.pointerId);
  });

  knapp.addEventListener('pointermove', function(e){
    if(!start) return;
    if(!flyttet && Math.abs(e.clientX - start.x) + Math.abs(e.clientY - start.y) < 8) return;
    flyttet = true;
    if(!flyt){
      flyt = document.createElement('span');
      flyt.className = 'gs-kule gs-k-' + type + ' gs-flyt';
      document.body.appendChild(flyt);
      $('plate').classList.add('gs-slipp');
    }
    flyt.style.left = e.clientX + 'px';
    flyt.style.top = e.clientY + 'px';
  });

  knapp.addEventListener('pointerup', function(e){
    if(!start) return;
    const overPlata = flyttet && innenforPlata(e.clientX, e.clientY);
    if(flyt){ flyt.remove(); flyt = null; }
    $('plate').classList.remove('gs-slipp');
    start = null;

    if(overPlata){ plasser(type, e.clientX, e.clientY); return; }
    if(!flyttet){
      /* Trykk-modus: brikka blir staaende valgt til hun trykker paa
         plata. Trykk paa den igjen legger den fra seg. */
      valgtBrikke = (valgtBrikke === type) ? null : type;
      tegnMagasin();
    }
  });

  knapp.addEventListener('pointercancel', function(){
    if(flyt){ flyt.remove(); flyt = null; }
    $('plate').classList.remove('gs-slipp');
    start = null;
  });
}

function innenforPlata(x, y){
  const r = $('plate').getBoundingClientRect();
  return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
}

$('plate').addEventListener('click', function(e){
  if(!valgtBrikke || !bygg) return;
  plasser(valgtBrikke, e.clientX, e.clientY);
});

function plasser(type, x, y){
  if(!bygg) return;
  const r = $('plate').getBoundingClientRect();
  /* Plata er kvadratisk i SVG-koordinater (360x360), saa begge aksene
     regnes mot bredden. */
  const px = (x - r.left) / r.width * 360;
  const py = (y - r.top) / r.width * 360;
  const avstand = Math.sqrt(Math.pow(px - MIDT, 2) + Math.pow(py - MIDT, 2));

  /* En ny plassering betyr at forrige retting ikke gjelder lenger. */
  bygg.merker = null;
  $('byggSvar').textContent = '';
  $('byggSvar').classList.remove('gs-klart');

  if(type === 'skall'){
    if(bygg.skall.length >= MAKS_SKALL){ si('Fire skall er nok til disse stoffene.'); return; }
    bygg.skall.push(0);
    bygg.historikk.push({ hva:'skall' });
    tegnBygg();
    return;
  }

  if(type === 'proton' || type === 'noytron'){
    const felt = type === 'proton' ? 'protoner' : 'noytroner';
    if(bygg[felt] >= MAKS_BRIKKER){ si('Nå er kjernen så full at den ikke kan tegnes.'); return; }
    if(avstand > KJERNE_R + 14){
      si(type === 'proton'
        ? 'Protoner hører hjemme i kjernen, midt på.'
        : 'Nøytronene ligger i kjernen, sammen med protonene.');
      return;
    }
    bygg[felt]++;
    bygg.historikk.push({ hva:type });
    tegnBygg();
    return;
  }

  /* Elektron: naermeste skall, og bare hvis hun traff det. */
  const brukt = bygg.skall.reduce(function(n, x){ return n + x; }, 0);
  if(brukt >= MAKS_BRIKKER){ si('Nå er det flere elektroner enn ringene får plass til.'); return; }
  if(!bygg.skall.length){ si('Legg ut et skall først – elektronene går i bane.'); return; }

  let naermest = -1, best = 1e9;
  bygg.skall.forEach(function(_, i){
    const d = Math.abs(avstand - skallRadius(i));
    if(d < best){ best = d; naermest = i; }
  });
  if(best > TREFF){ si('Slipp elektronet på en av ringene.'); return; }

  bygg.skall[naermest]++;
  bygg.historikk.push({ hva:'elektron', skall:naermest });
  /* Brikka blir staaende valgt: legger hun ut aatte elektroner, skal hun
     ikke trykke paa beholderen mellom hver. */
  tegnBygg();
}

function angreBygg(){
  const siste = bygg.historikk.pop();
  if(!siste){ si('Det er ingenting å angre.'); return; }
  if(siste.hva === 'proton') bygg.protoner--;
  if(siste.hva === 'noytron') bygg.noytroner--;
  if(siste.hva === 'elektron') bygg.skall[siste.skall]--;
  if(siste.hva === 'skall'){
    /* Et skall med elektroner i kan ikke bare forsvinne - elektronene
       legges tilbake i beholderen sammen med det. */
    bygg.skall.pop();
  }
  bygg.merker = null;
  $('byggSvar').textContent = '';
  $('byggSvar').classList.remove('gs-klart');
  tegnBygg();
}

function tomBygg(){ nyttBygg(bygg.nr, bygg.prove); }

async function sjekkBygg(){
  const s = stoffAv(bygg.nr);
  const o = OPPBYGNING[bygg.nr];
  const fasit = o[1];
  const elektroner = bygg.skall.reduce(function(n, x){ return n + x; }, 0);
  const feil = [];

  if(bygg.protoner !== bygg.nr){
    feil.push('Kjernen har ' + protonOrd(bygg.protoner) + '. Atomnummeret til '
            + s[2] + ' er ' + bygg.nr + ', og det er nettopp antall protoner.');
  }
  if(visNoytron() && bygg.noytroner !== o[0]){
    feil.push('Du har lagt ut ' + noytronOrd(bygg.noytroner) + '. Massetallet er '
            + massetall(bygg.nr) + ' og atomnummeret ' + bygg.nr + ', så '
            + massetall(bygg.nr) + ' − ' + bygg.nr + ' = ' + noytronOrd(o[0]) + '.');
  }
  if(elektroner !== bygg.nr){
    feil.push('Du har lagt ut ' + elektronOrd(elektroner) + '. Et nøytralt atom har '
            + 'like mange elektroner som protoner: ' + bygg.nr + '.');
  }
  if(bygg.skall.length !== fasit.length){
    feil.push('Du har ' + bygg.skall.length + ' skall. ' + s[2] + ' har '
            + fasit.length + '.');
  }
  bygg.skall.forEach(function(antall, i){
    if(fasit[i] === undefined){
      feil.push('Skall ' + (i + 1) + ' skal ikke være der.');
    }else if(antall !== fasit[i]){
      feil.push('Skall ' + (i + 1) + ' har ' + elektronOrd(antall) + '. Det skal ha '
              + fasit[i] + '.');
    }
  });

  bygg.merker = bygg.skall.map(function(antall, i){ return fasit[i] === antall; });
  bygg.forsok++;
  tegnBygg();

  const svar = $('byggSvar');
  svar.textContent = '';
  if(feil.length){
    svar.classList.remove('gs-klart');
    const p = document.createElement('p');
    p.textContent = 'Ikke helt ennå:';
    const ul = document.createElement('ul');
    feil.forEach(function(t){
      const li = document.createElement('li');
      li.textContent = t;
      ul.appendChild(li);
    });
    svar.appendChild(p); svar.appendChild(ul);
    return;
  }

  svar.classList.add('gs-klart');
  svar.textContent = 'Riktig. Slik ser ' + s[2] + ' ut: ' + protonOrd(bygg.nr)
    + (visNoytron() ? ' og ' + noytronOrd(o[0]) : '') + ' i kjernen, og '
    + (fasit.length === 1 ? elektronOrd(fasit[0]) + ' utenpå'
                          : fasit.join(' + ') + ' elektroner utover') + '.';

  const forstegang = !bygg.lost;
  if(forstegang){
    bygg.lost = true;
    data.runder.push({ id:nyId(), tid:Date.now(), type:'bygg',
                       stoff:bygg.nr, forsok:bygg.forsok });
  }

  if(bygg.prove){ await bestaattProve(); return; }

  if(forstegang){
    tegnFramdrift();
    await lagre();
  }
}

/* ============================================================
   Gullstjerna
   ------------------------------------------------------------
   Fem riktige spoersmaal OG et riktig bygget atom. Da, og bare da,
   settes stjerna, gis 100 XP og aapnes neste stoff i rekka.
   ============================================================ */
async function bestaattProve(){
  const nr = bygg.nr;
  const s = stoffAv(nr);
  const nytt = !erMestret(nr);

  if(!data.mestret) data.mestret = {};
  data.mestret[nr] = { tid:Date.now(), forsok:bygg.forsok };

  let apnet = null;
  if(nytt){
    const for_ = apne();
    data.apne = Math.max(for_, Math.min(MAKS_APNE, nr + 1));
    if(data.apne > for_) apnet = stoffAv(data.apne);
    girXp(XP_STJERNE, 'gullstjerne på ' + s[2] + '!');
  }

  bygg = null;
  tegnAlt();

  visFane('test', true);
  $('testOppsett').classList.add('gs-skjult');
  $('testSpill').classList.add('gs-skjult');
  $('testResultat').classList.remove('gs-skjult');

  const ut = $('resultatInnhold');
  ut.textContent = '';

  const stjerne = document.createElement('img');
  stjerne.className = 'gs-stor-stjerne';
  stjerne.src = '/bilder/spill/stjerne.webp?v=1';
  stjerne.alt = ''; stjerne.width = 92; stjerne.height = 92;
  stjerne.onerror = function(){ this.hidden = true; };
  ut.appendChild(stjerne);

  const t = document.createElement('p');
  t.className = 'gs-sporsmaal';
  t.textContent = nytt ? 'Gullstjerne på ' + s[2] : s[2] + ' sitter fortsatt';
  ut.appendChild(t);

  if(nytt){
    const lapp = document.createElement('p');
    lapp.className = 'gs-xp-gitt';
    lapp.textContent = '+' + XP_STJERNE + ' XP';
    ut.appendChild(lapp);
  }

  const sub = document.createElement('p');
  sub.className = 'gs-sporsmaal-sub';
  if(apnet){
    sub.textContent = apnet[2] + ' er åpnet. Den står med tom stjerne i tabellen nå.';
  }else if(!nytt){
    sub.textContent = 'Du hadde stjerna fra før – den er like god etter denne runden.';
  }else if(apne() >= MAKS_APNE){
    sub.textContent = 'Du har tatt alle de tjue første. Trinn tre er bindinger '
      + 'mellom stoffene, og det er ikke bygget ennå.';
  }else{
    sub.textContent = 'Godt jobbet.';
  }
  ut.appendChild(sub);

  const knapper = [];
  if(apnet){
    knapper.push(['Ta prøven på ' + apnet[2], true, function(){ startProve(apnet[0]); }]);
  }
  knapper.push(['Til tabellen', !apnet, function(){
    valgtNr = nr; tegnLab(); visFane('tabell');
  }]);
  ut.appendChild(knappRad(knapper));

  prove = null;
  await lagre();
}

/* ============================================================
   Framdrift
   ============================================================ */
function tegnFramdrift(){
  const runder = data.runder || [];
  /* Byggerundene teller ikke som spoersmaal - de har ingen andel riktige,
     de er enten ferdige eller ikke. De staar for seg i tallene under. */
  const tester = runder.filter(function(r){ return r.type !== 'bygg' && r.type !== 'noytron'; });
  const bygde = runder.filter(function(r){ return r.type === 'bygg'; });
  const ulikeBygde = {};
  bygde.forEach(function(r){ ulikeBygde[r.stoff] = true; });

  const spurt = tester.reduce(function(n, r){ return n + (r.antall || 0); }, 0);
  const rette = tester.reduce(function(n, r){ return n + (r.riktige || 0); }, 0);
  const beste = tester.reduce(function(b, r){
    const a = r.antall ? r.riktige / r.antall : 0;
    return a > b ? a : b;
  }, 0);

  const xp = xpAv();
  const tall = $('framTall');
  tall.textContent = '';
  [['Nivå', String(nivaaAv(xp))],
   ['Erfaringspoeng', xp.toLocaleString('nb-NO')],
   ['Gullstjerner', antallMestret() + ' av ' + MAKS_APNE],
   ['Åpne stoffer', apne() + ' av 118'],
   ['Runder spilt', String(tester.length)],
   ['Spørsmål', String(spurt)],
   ['Riktige', spurt ? Math.round(rette / spurt * 100) + ' %' : '–'],
   ['Beste runde', tester.length ? Math.round(beste * 100) + ' %' : '–'],
   ['Atomer bygget', String(Object.keys(ulikeBygde).length)]
  ].forEach(function(r){
    const d = document.createElement('div');
    d.innerHTML = '<dt>' + r[0] + '</dt><dd>' + r[1] + '</dd>';
    tall.appendChild(d);
  });

  const neste = STOFFER.filter(function(s){
    return erApen(s[0]) && OPPBYGNING[s[0]] && !erMestret(s[0]);
  }).sort(function(a, b){ return a[0] - b[0]; })[0];

  $('framTekst').textContent = neste
    ? 'Neste gullstjerne: ' + neste[2] + '. Fem spørsmål og ett bygget atom, '
      + 'så åpner stoffet etter seg.'
    : (apne() >= MAKS_APNE
        ? 'Alle de tjue første har gullstjerne. Trinn tre er bindinger mellom '
          + 'stoffene, og det er ikke bygget ennå.'
        : 'Alt du har tilgang til er bestått.');

  const stige = $('framStige');
  stige.textContent = '';
  NIVAA.forEach(function(grense, i){
    const t = document.createElement('span');
    t.className = 'gs-trinn' + (xp >= grense ? ' gs-naadd' : '');
    t.textContent = 'Nivå ' + (i + 1)
      + (grense ? ' · ' + grense.toLocaleString('nb-NO') + ' XP' : ' · start');
    stige.appendChild(t);
  });

  const liste = $('framRunder');
  liste.textContent = '';
  const siste = runder.slice(-10).reverse();
  if(!siste.length){
    const p = document.createElement('p');
    p.className = 'gs-sporsmaal-sub';
    p.textContent = 'Ingen runder ennå.';
    liste.appendChild(p);
    return;
  }
  siste.forEach(function(r){
    const d = new Date(r.tid || Date.now());
    const p = function(n){ return String(n).padStart(2, '0'); };
    const rad = document.createElement('div');
    rad.className = 'gs-fasitrad';
    const dato = '<span>' + p(d.getDate()) + '.' + p(d.getMonth() + 1) + '</span>';
    if(r.type === 'bygg'){
      const s = stoffAv(r.stoff);
      rad.innerHTML = dato + '<span>Bygde ' + (s ? s[2] : 'et atom')
        + (r.forsok > 1 ? ' – ' + r.forsok + ' forsøk' : ' – på første forsøk') + '</span>';
    }else if(r.type === 'noytron'){
      rad.innerHTML = dato + '<span>Lærte om nøytronet – 500 XP</span>';
    }else{
      rad.innerHTML = dato
        + '<span>' + (r.riktige || 0) + ' av ' + (r.antall || 0) + ' riktig – '
        + (r.sider || []).map(function(id){
            const s = SIDER.filter(function(x){ return x.id === id; })[0];
            return s ? s.navn.toLowerCase() : id;
          }).join(', ') + '</span>';
    }
    liste.appendChild(rad);
  });
}

/* ============================================================
   Fanene, pilla og oppstart
   ============================================================ */
function visFane(navn, behold){
  [['tabell','visTabell','faneTabell'],
   ['bygg','visBygg','faneBygg'],
   ['test','visTest','faneTest'],
   ['fram','visFram','faneFram']].forEach(function(f){
    const pa = f[0] === navn;
    $(f[1]).classList.toggle('gs-skjult', !pa);
    $(f[2]).classList.toggle('gs-valgt', pa);
  });

  /* `behold` settes av spillet selv naar det flytter henne videre i en
     proeve - da skal fanen IKKE nullstilles under foettene paa henne.
     Trykker hun paa fanen, kommer den uten flagget og starter forfra. */
  if(navn === 'test' && !behold){
    /* Tilbake til oppsettet hver gang fanen aapnes: en halvferdig runde
       man kommer tilbake til uten aa vite hvor man var, er verre enn en
       ny. */
    prove = null; runde = null;
    $('testOppsett').classList.remove('gs-skjult');
    $('testSpill').classList.add('gs-skjult');
    $('testResultat').classList.add('gs-skjult');
    tegnValg();
    tegnProveValg();
    velgVei(testVei);
  }
  /* Et paabegynt bygg staar. Ogsaa proevens bygg: trykker hun paa fanen
     hun alt er paa, skal ikke det hun holder paa med kastes. */
  if(navn === 'bygg' && !bygg) nyttByggeStoff();
  if(navn === 'fram') tegnFramdrift();
  window.scrollTo({ top:0, behavior:'smooth' });
}

let pilleTid = null;
function si(tekst){
  const p = $('pille');
  p.textContent = tekst;
  p.hidden = false;
  clearTimeout(pilleTid);
  pilleTid = setTimeout(function(){ p.hidden = true; }, 2800);
}

function tegnAlt(){
  tegnXp(false);
  tegnLaerPanel();
  tegnTabell();
  tegnLab();
  tegnValg();
  tegnProveValg();
  tegnFramdrift();
  if(bygg) tegnBygg();
}

tegnAlt();
last();
