<style>
/* ============================================================
   NEAM - Grunnstoffspill for Emma
   Laget 16. september 2026. Bygget om 18. september 2026.
   Begrunnelsene ligger i kartleggingen del 51.

   HELE TABELLEN ER TENT FRA FOERSTE STUND. Foer 18. september var de
   laaste stoffene moerke og upolerte. Det kostet mer enn det ga: et
   periodesystem i gruppefarger ER kartet, og et moerkt felt er ikke et
   maal man gaar mot - det er bare et hull. Naa staar alle 118 i fargen
   sin, og framdriften ligger i STJERNA oppe til hoeyre i ruta:
     ingen stjerne  - hun kan lese om stoffet, men ikke proeves paa det
     tom stjerne    - hun har tilgang, proeven er aapen
     gullstjerne    - hun har bestaatt proeven

   STJERNA ER DEN SAMME FILA I TO TILSTANDER, avfarget i CSS naar den
   er tom - ett bilde som ikke kan komme i utakt. Samme regel som
   mattespillet (designsystemet, «Mattespillet»).

   PROEVEN ER VEIEN VIDERE. Fem spoersmaal om ETT stoff, og deretter maa
   hun bygge atomet. Alle fem riktige og et riktig bygget atom gir
   gullstjerne, 100 XP og aapner neste stoff i rekka. Oevingsrunden
   staar ved siden av og gir XP, men aapner ingenting - da er det alltid
   klart hva som faktisk flytter henne framover.

   NOEYTRONET KOMMER ETTER TI STOFFER, ikke foer. Antall noeytroner kan
   ikke utledes av atomnummeret, saa det maatte ellers bare vaert et tall
   hun fikk oppgitt. Naar hun har aapnet stoff elleve, dukker
   laeringsboksen opp: hun faar MASSETALLET og regner selv
   noeytroner = massetall - atomnummer. Da er det noe hun finner ut, ikke
   noe hun husker. Testen paa den gir 500 XP, og foerst etterpaa finnes
   noeytroner i tegningen, i faktalista og i byggemagasinet.

   XP OG NIVAA. 10 XP per riktig svar i oeving (50/100/150 for en feilfri
   runde paa 5/10/15), 100 XP per gullstjerne, 500 XP for noeytrontesten.
   Nivaagrensene er 500, 1000, 2000, 5000, 10000, 20000, 50000 og 100000.
   Premier ved nytt nivaa er ikke bestemt ennaa - stripa staar der,
   belooningen kommer.

   SELVRETTENDE FOER POENGGIVENDE. Spoersmaalene har ett riktig svar som
   finnes i datasettet, saa spillet trenger knapt logikk for aa si ja
   eller nei.

   ET GALT SVAR ER IKKE ROEDT. Roedt betyr slett i dette huset, og det
   skal ikke kjennes som straff aa bomme. Det gale svaret blir staaende
   dust og overstroeket ved siden av fasiten. Gult (--lys) betyr «det der
   gikk bra» - samme betydning som lampene i mattespillet.

   INGEN NEAM-FIRER. Samtalen er en rask vei til fasiten. Veien ut er
   merket oppe til venstre og sveip tilbake, som i de to andre spillene.

   KLASSENAVN ER PREFIKSET `gs-`. Fila er stor nok til at vanlige ord som
   .tom, .ny og .aktiv alt kan bety noe annet - se kartleggingen del 26.
   ============================================================ */

:root{
  /* Messing: kontur og ramme, aldri fylt flate. Samme som i
     mattespillet, saa de to spillene er samme hus. */
  --messing:#B8873A;
  --messing-moerk:#8A6428;
  --messing-lys:#D9AE68;
  /* Det gule betyr «riktig» fire steder: tom stjerne som tennes, riktig
     svar, XP-stripa og stjernene. Én farge, én betydning. */
  --lys:#F2C14E;
  --lys-glod:rgba(242,193,78,.75);

  /* Stoffgruppene. Duse flater som i et trykt periodesystem - de
     skiller gruppene uten aa rope, og teksten staar i --ink paa alle. */
  --gr-alkali:#F2C9B8;
  --gr-jordalkali:#F5DFB8;
  --gr-overgang:#EFE0C4;
  --gr-metall:#DCE3E8;
  --gr-halvmetall:#D9E4D2;
  --gr-ikkemetall:#CFE3C7;
  --gr-halogen:#DCE0F0;
  --gr-edelgass:#CFE0EC;
  --gr-lantanoid:#EAD9E8;
  --gr-aktinoid:#E8D3D9;

  --rute:34px;      /* bredden paa én rute i tabellen */
  --rute-luft:3px;
}
@media(min-width:700px){ :root{ --rute:44px; --rute-luft:4px; } }
@media(min-width:1100px){ :root{ --rute:52px; --rute-luft:5px; } }

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; padding:0; width:100%; overflow-x:clip; color:var(--ink); }
body{
  font-family:'Archivo', system-ui, -apple-system, sans-serif;
  background:var(--side-bakgrunn);
  min-height:100vh;
}
/* Bakgrunnsbildet ligger i et eget lag under innholdet - ikke som
   background-attachment:fixed, som iOS regner mot dokumenthoeyden og
   blaaser opp (kartleggingen del 17). */
body::before{
  content:''; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:url('/bilder/bakgrunn.webp') center/cover no-repeat;
}
@media(orientation:portrait){
  body::before{ background-image:url('/bilder/bakgrunn-staaende.webp'); }
}

.gs-side{ max-width:1180px; margin:0 auto; padding:10px 12px 28px; }
@media(min-width:700px){ .gs-side{ padding:18px 20px 36px; } }

/* Gradientene og skyggene til atomtegningene bor i ett eneste skjult
   SVG, og begge tegningene peker hit med url(#...). Ett sted aa endre
   dypet, og ingen id-er som finnes i to eksemplarer. Den ligger som
   `position:absolute` med null stoerrelse og ikke `display:none`:
   Safari har hatt for vane aa droppe gradienter i skjulte traer. */
.gs-defs{ position:absolute; width:0; height:0; overflow:hidden; }

/* ---------- Topplinja ---------- */
/* Wrap er ikke pynt: paa telefon ble fanene liggende utenfor
   skjermkanten, og siden `body` har overflow-x:clip kunne de ikke naas
   i det hele tatt. Maalt paa 375px 16. september 2026. */
.gs-topp{ display:flex; align-items:center; gap:12px; margin-bottom:12px; flex-wrap:wrap; }
.gs-merke{ flex-shrink:0; display:block; width:56px; height:56px; }
.gs-merke img{ width:100%; height:100%; object-fit:contain; display:block; }
.gs-merke img[hidden]{ display:none; }
@media(min-width:700px){ .gs-merke{ width:84px; height:84px; } }
.gs-tittel{ margin:0; font-size:var(--t-stor); font-weight:700; line-height:1.15; }
.gs-tittel span{
  display:block; font-size:var(--t-etikett); font-weight:700;
  letter-spacing:.14em; text-transform:uppercase; color:var(--ink-soft);
}

/* Fanene. Tekst uten flate tar deg et sted; den valgte faar messingkant
   under seg i stedet for en fylt flate - fylt flate betyr «skaper noe». */
.gs-faner{ display:flex; gap:4px; margin-left:auto; flex-wrap:wrap; justify-content:flex-end; }
/* Telefon: fanene tar hele linja under merket og tittelen i stedet for
   aa presses ut til hoeyre. */
@media(max-width:640px){
  .gs-faner{ margin-left:0; width:100%; justify-content:flex-start; gap:0; }
  .gs-fane{ padding:8px 12px 8px 0; }
}
.gs-fane{
  border:none; background:transparent; font-family:inherit; cursor:pointer;
  font-size:var(--t-meta); font-weight:700; letter-spacing:.06em;
  text-transform:uppercase; color:var(--ink-soft);
  padding:8px 10px; border-bottom:3px solid transparent;
}
.gs-fane.gs-valgt{ color:var(--ink); border-bottom-color:var(--messing); }

/* ---------- XP-stripa ----------
   Staar over fanene og gjelder alle fire, fordi poeng tjenes tre
   forskjellige steder. Stripa fylles med det samme gule som betyr
   «det der gikk bra» ellers i spillet. */
.gs-xp{
  background:var(--paper); border:2px solid var(--messing);
  border-radius:14px; padding:10px 14px; margin-bottom:14px;
  box-shadow:var(--shadow);
}
.gs-xp-hode{ display:flex; align-items:baseline; gap:10px; }
.gs-xp-nivaa{
  font-size:var(--t-meta); font-weight:700; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink);
}
.gs-xp-tall{ margin-left:auto; font-size:var(--t-meta); font-weight:700; color:var(--ink-soft); }
.gs-xp-spor{
  margin-top:7px; height:10px; border-radius:999px;
  background:var(--boks-mild); border:1px solid var(--boks-kant); overflow:hidden;
}
.gs-xp-fyll{
  height:100%; width:0; border-radius:999px;
  background:linear-gradient(90deg, var(--messing-lys), var(--lys));
  transition:width .6s ease;
}
.gs-xp-neste{ margin:6px 0 0; font-size:var(--t-etikett); font-weight:600; color:var(--ink-soft); }
/* Stripa blinker naar den vokser. Uten det er poengene et tall som
   endrer seg mens hun ser en annen vei. */
.gs-xp.gs-xp-opp{ animation:gsPuls 1s ease; }
@keyframes gsPuls{
  0%,100%{ box-shadow:var(--shadow); }
  35%{ box-shadow:0 0 0 4px var(--lys-glod), var(--shadow); }
}

/* ---------- Panelet: papir i messingramme ---------- */
.gs-panel{
  background:var(--paper); border:2px solid var(--messing);
  border-radius:18px; box-shadow:var(--shadow);
  padding:14px; margin-bottom:14px;
}
@media(min-width:700px){ .gs-panel{ padding:18px; } }
.gs-panel-tittel{
  font-size:var(--t-meta); font-weight:700; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink); margin:0 0 10px;
}

/* ---------- Periodesystemet ---------- */
.gs-tabell-ramme{ overflow-x:auto; padding-bottom:6px; }
.gs-tabell{
  display:grid;
  grid-template-columns:repeat(18, var(--rute));
  gap:var(--rute-luft);
  min-width:min-content; margin:0 auto;
}
.gs-rad-merke{
  grid-column:1 / -1; height:6px;
}
.gs-rute{
  width:var(--rute); height:var(--rute); padding:0; border:none;
  border-radius:6px; font-family:inherit; cursor:pointer;
  background:var(--gr-metall); color:var(--ink);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  line-height:1; position:relative; overflow:hidden;
}
.gs-rute:active{ transform:scale(.94); }
.gs-rute .gs-nr{
  position:absolute; top:2px; left:3px;
  font-size:9px; font-weight:600; color:var(--ink-soft);
}
.gs-rute .gs-sym{ font-size:calc(var(--rute) * .40); font-weight:700; }
.gs-rute .gs-navn{
  font-size:7px; font-weight:600; max-width:100%; padding:0 2px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--ink-soft);
}
@media(min-width:1100px){ .gs-rute .gs-navn{ font-size:8px; } }

/* Stjerna i hjoernet. Samme fil som resultatstjernene - tom er den
   avfarget, gull er den urørt. */
.gs-merkestjerne{
  position:absolute; top:2px; right:2px;
  width:11px; height:11px; display:block; pointer-events:none;
}
@media(min-width:700px){ .gs-merkestjerne{ width:14px; height:14px; } }
@media(min-width:1100px){ .gs-merkestjerne{ width:16px; height:16px; } }
.gs-merkestjerne.gs-tom-stjerne{ filter:grayscale(1) opacity(.45); }
/* Gullstjerna faar et svakt skjaer, saa den leses som tent og ikke bare
   som farget. */
.gs-merkestjerne.gs-gull{ filter:drop-shadow(0 0 3px var(--lys-glod)); }

/* Har hun tilgang, er ruta litt loeftet fra de andre: tynn gul kant
   innvendig, samme «det gikk bra» som stjernene. */
.gs-rute.gs-apen{ box-shadow:inset 0 0 0 1.5px var(--lys-glod); }
.gs-rute.gs-mestret{ box-shadow:inset 0 0 0 2px var(--lys); }
/* Stoffer uten tilgang er IKKE moerke lenger - de er bare litt roligere,
   saa fargekartet staar helt fra foerste dag. */
.gs-rute.gs-hvile{ filter:saturate(.72); }

.gs-rute.gs-peker{
  background:transparent; cursor:default; color:var(--ink-soft);
  font-size:calc(var(--rute) * .34); font-weight:700;
}
.gs-tom{ width:var(--rute); height:var(--rute); }

/* Fargene per gruppe. */
.gs-alkali{ background:var(--gr-alkali); }
.gs-jordalkali{ background:var(--gr-jordalkali); }
.gs-overgang{ background:var(--gr-overgang); }
.gs-metall{ background:var(--gr-metall); }
.gs-halvmetall{ background:var(--gr-halvmetall); }
.gs-ikkemetall{ background:var(--gr-ikkemetall); }
.gs-halogen{ background:var(--gr-halogen); }
.gs-edelgass{ background:var(--gr-edelgass); }
.gs-lantanoid{ background:var(--gr-lantanoid); }
.gs-aktinoid{ background:var(--gr-aktinoid); }

.gs-tegnforklaring{
  display:flex; flex-wrap:wrap; gap:6px 14px; margin-top:12px;
  font-size:var(--t-etikett); color:var(--ink-soft); font-weight:600;
}
.gs-tegnforklaring span{ display:flex; align-items:center; gap:5px; }
.gs-prikk{ width:11px; height:11px; border-radius:3px; display:inline-block; }
.gs-forklar-stjerne{ width:12px; height:12px; display:inline-block; }
.gs-forklar-stjerne.gs-tom-stjerne{ filter:grayscale(1) opacity(.45); }

/* ---------- Laben: ett stoff i detalj ---------- */
.gs-lab{ display:grid; grid-template-columns:1fr; gap:18px; }
@media(min-width:860px){ .gs-lab{ grid-template-columns:auto 1fr auto; align-items:start; } }

.gs-kort{ display:flex; flex-direction:column; align-items:center; gap:10px; }
.gs-stor-rute{
  width:118px; height:118px; border-radius:14px; border:2px solid var(--messing);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  margin:0 auto; line-height:1.1; position:relative;
}
.gs-stor-rute .gs-stor-nr{ font-size:var(--t-meta); font-weight:600; color:var(--ink-soft); }
.gs-stor-rute .gs-stor-sym{ font-size:44px; font-weight:700; }
.gs-stor-rute .gs-stor-navn{ font-size:var(--t-etikett); font-weight:600; }
.gs-stor-rute .gs-merkestjerne{ top:5px; right:5px; width:18px; height:18px; }

.gs-status{
  font-size:var(--t-etikett); font-weight:700; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-soft); text-align:center;
}
.gs-status.gs-status-gull{ color:var(--messing-moerk); }

/* Den praktiske teksten. Den staar foerst i midtspalta med vilje: det
   er den som svarer paa «hva ER dette» - tallene kommer etterpaa. */
.gs-hva{
  font-size:var(--t-brod); font-weight:600; line-height:1.45; margin:0 0 4px;
}
.gs-hverdag{
  font-size:var(--t-meta); font-weight:600; line-height:1.5;
  color:var(--ink-soft); margin:0 0 14px;
  border-left:3px solid var(--messing-lys); padding-left:10px;
}

.gs-fakta{ margin:0; display:grid; grid-template-columns:1fr 1fr; gap:10px 16px; }
@media(min-width:520px){ .gs-fakta{ grid-template-columns:repeat(3, 1fr); } }
@media(min-width:860px){ .gs-fakta{ grid-template-columns:1fr 1fr; } }
.gs-fakta div{ min-width:0; }
.gs-fakta dt{
  font-size:var(--t-etikett); font-weight:700; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-soft);
}
.gs-fakta dd{ margin:1px 0 0; font-size:var(--t-brod); font-weight:600; overflow-wrap:anywhere; }

/* ---------- Atomtegningen ----------
   Stoerre enn foer (360 i SVG-koordinater mot 260), og med dybde:
   kulene har lys ovenfra og skygge under, ringene er gravert messing
   med lys paa den ene sida. Tegnet og ikke hentet som bilde - da finnes
   det ingen fil som kan mangle, og modellen kan ikke komme i utakt med
   tallene ved siden av. */
.gs-atom{ display:block; margin:0 auto; height:auto; width:min(340px, 82vw); }
/* `min-width` er ikke pynt, og den maa vaere et absolutt tall. En SVG
   med viewBox har ingen egen minstebredde, saa `1fr`-spalta ved siden av
   klemmer den ned til drøyt hundre piksler. En prosent hjelper ikke -
   den maales mot spalta som selv maales mot innholdet, og faller
   tilbake til null. Bare i trespaltevisningen: under 860px staar
   tegningen alene paa linja og trenger ingen gulvhoeyde. */
@media(min-width:860px){ .gs-atom{ min-width:280px; } }
/* Ingen font-size her: den settes per tegning, maalt mot utsnittet. */
.gs-atom text{ font-family:inherit; font-weight:700; letter-spacing:.12em; fill:var(--ink-soft); }
.gs-skall{ fill:none; stroke:url(#gsRing); stroke-width:2; }
/* Feil skall: stiplet og dust, aldri roedt. Roedt betyr slett. */
.gs-skall.gs-feil{ stroke:var(--ink-soft); stroke-dasharray:5 5; opacity:.45; }
.gs-skall.gs-riktig-skall{ stroke:var(--lys); stroke-width:3; }

.gs-lab-knapper{ display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; }

/* Knappene foelger husets betydninger: blaa er «alt annet», og
   messingkanten er uttrykket her. Ingen fylt gruenn - ingenting
   av dette skaper noe. */
.gs-knapp{
  font-family:inherit; font-size:var(--t-brod); font-weight:700;
  padding:11px 18px; border-radius:12px; cursor:pointer;
  border:2px solid var(--messing); background:var(--paper); color:var(--ink);
}
.gs-knapp:active{ transform:scale(.98); }
.gs-knapp.gs-tung{ background:var(--aksent); border-color:var(--aksent); color:#FFFFFF; }
.gs-knapp.gs-tung:active{ background:var(--aksent-moerk); }
.gs-knapp[disabled]{ opacity:.45; cursor:default; }

/* ---------- Laeringsboksen ----------
   Brukes til noeytronet naa, og er bygget saa den kan brukes til neste
   begrep uten en ny boks. */
.gs-laer{ border-color:var(--lys); }
.gs-laer-merke{
  display:inline-block; font-size:var(--t-etikett); font-weight:700;
  letter-spacing:.12em; text-transform:uppercase;
  background:rgba(242,193,78,.25); border:1px solid var(--lys);
  border-radius:999px; padding:3px 10px; margin-bottom:8px;
}
.gs-laer p{ font-size:var(--t-brod); font-weight:600; line-height:1.5; margin:0 0 10px; }
.gs-laer .gs-regnestykke{
  font-size:var(--t-stor); font-weight:700; text-align:center;
  background:var(--boks-mild); border:1px solid var(--boks-kant);
  border-radius:12px; padding:12px; margin:12px 0;
}

/* ---------- Test meg ---------- */
.gs-veivalg{ display:grid; grid-template-columns:1fr; gap:12px; }
@media(min-width:720px){ .gs-veivalg{ grid-template-columns:1fr 1fr; } }
.gs-vei{
  border:2px solid var(--line); border-radius:14px; padding:14px;
  background:var(--boks-mild); cursor:pointer; font-family:inherit;
  text-align:left; color:var(--ink);
}
.gs-vei.gs-pa{ border-color:var(--messing); background:var(--paper); }
.gs-vei h3{
  margin:0 0 4px; font-size:var(--t-meta); font-weight:700;
  letter-spacing:.1em; text-transform:uppercase;
}
.gs-vei p{ margin:0; font-size:var(--t-meta); font-weight:600; color:var(--ink-soft); line-height:1.45; }

.gs-valg{ display:flex; flex-wrap:wrap; gap:8px; margin:6px 0 16px; }
.gs-velger{
  font-family:inherit; font-size:var(--t-brod); font-weight:700;
  padding:9px 16px; border-radius:999px; cursor:pointer;
  border:2px solid var(--line); background:var(--paper); color:var(--ink-soft);
}
.gs-velger.gs-pa{ border-color:var(--messing); color:var(--ink); background:var(--boks-mild); }
.gs-velger .gs-hake{ margin-right:6px; opacity:0; }
.gs-velger.gs-pa .gs-hake{ opacity:1; }
.gs-velger .gs-xp-lapp{ font-size:var(--t-etikett); color:var(--ink-soft); margin-left:6px; }

/* Stoffvelgeren i proeven: smaa ruter i gruppefarge, samme som tabellen. */
.gs-provevalg{ display:flex; flex-wrap:wrap; gap:8px; margin:6px 0 16px; }
.gs-provevalg .gs-rute{ width:46px; height:46px; }
.gs-provevalg .gs-rute .gs-sym{ font-size:17px; }

.gs-teller{
  font-size:var(--t-etikett); font-weight:700; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-soft);
}
.gs-sporsmaal{ font-size:var(--t-stor); font-weight:700; margin:10px 0 4px; }
.gs-sporsmaal-sub{ font-size:var(--t-meta); color:var(--ink-soft); font-weight:600; margin-bottom:14px; }

.gs-svar{ display:grid; grid-template-columns:1fr; gap:10px; }
@media(min-width:620px){ .gs-svar{ grid-template-columns:1fr 1fr; } }
.gs-svar-knapp{
  font-family:inherit; font-size:var(--t-brod); font-weight:700; text-align:left;
  padding:14px 16px; border-radius:12px; cursor:pointer;
  border:2px solid var(--line); background:var(--paper); color:var(--ink);
}
.gs-svar-knapp:active{ transform:scale(.99); }
/* Riktig: gult, som lampene. Galt: dust og overstroeket, aldri roedt. */
.gs-svar-knapp.gs-riktig{
  border-color:var(--lys); background:rgba(242,193,78,.22);
  box-shadow:0 0 0 3px var(--lys-glod);
}
.gs-svar-knapp.gs-galt{ opacity:.5; text-decoration:line-through; }
.gs-svar-knapp[disabled]{ cursor:default; }

.gs-fasit{ margin-top:14px; font-size:var(--t-brod); font-weight:600; min-height:24px; }

/* Prikkene som viser hvor langt i proeven hun er. Fem spoersmaal er faa
   nok til at en teller i tall ville vaert mindre tydelig enn fem prikker. */
.gs-prikker{ display:flex; gap:6px; margin:8px 0 0; }
.gs-prikker i{
  width:10px; height:10px; border-radius:50%; display:block;
  border:2px solid var(--line); background:transparent;
}
.gs-prikker i.gs-p-riktig{ background:var(--lys); border-color:var(--lys); }
.gs-prikker i.gs-p-bom{ background:var(--ink-soft); border-color:var(--ink-soft); opacity:.45; }

/* ---------- Resultatet ---------- */
.gs-resultat{ text-align:center; }
.gs-stjerner{ display:flex; justify-content:center; gap:6px; margin:6px 0 12px; }
.gs-stjerne{ width:44px; height:44px; display:block; }
/* Tom stjerne er den SAMME fila avfarget - ett bilde, to tilstander,
   som ikke kan komme i utakt. */
.gs-stjerne.gs-tom-stjerne{ filter:grayscale(1) opacity(.32); }
.gs-stor-stjerne{ width:92px; height:92px; display:block; margin:0 auto 10px;
  filter:drop-shadow(0 0 10px var(--lys-glod)); }
.gs-fasitliste{ text-align:left; margin-top:16px; }
.gs-fasitrad{
  display:flex; gap:10px; padding:7px 0; border-top:1px solid var(--line);
  font-size:var(--t-meta);
}
.gs-fasitrad span:first-child{ font-weight:700; min-width:26px; }
.gs-fasitrad.gs-bom span:last-child{ color:var(--ink-soft); }

.gs-xp-gitt{
  display:inline-block; margin:4px 0 10px;
  font-size:var(--t-meta); font-weight:700; letter-spacing:.06em;
  background:rgba(242,193,78,.25); border:1px solid var(--lys);
  border-radius:999px; padding:5px 14px;
}

/* ---------- Framdrift ---------- */
.gs-tall{ display:flex; flex-wrap:wrap; gap:18px 28px; }
.gs-tall div{ min-width:96px; }
.gs-tall dt{
  font-size:var(--t-etikett); font-weight:700; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-soft);
}
.gs-tall dd{ margin:2px 0 0; font-size:var(--t-stor); font-weight:700; }

.gs-nivaastige{ display:flex; flex-wrap:wrap; gap:8px; margin-top:6px; }
.gs-trinn{
  font-size:var(--t-etikett); font-weight:700; padding:5px 11px;
  border-radius:999px; border:1px solid var(--line); color:var(--ink-soft);
}
.gs-trinn.gs-naadd{ border-color:var(--lys); background:rgba(242,193,78,.22); color:var(--ink); }

/* ---------- Pilla som sier fra ---------- */
.gs-pille{
  position:fixed; left:50%; transform:translateX(-50%);
  bottom:calc(18px + env(safe-area-inset-bottom));
  background:var(--ink); color:var(--paper); font-size:var(--t-meta); font-weight:600;
  padding:10px 16px; border-radius:999px; box-shadow:var(--shadow); z-index:40;
  max-width:90vw; text-align:center;
}
.gs-pille[hidden]{ display:none; }

/* ---------- Bygg atom ----------
   Trinn 2 i kartleggingen del 51. Hun faar navn, symbol og atomnummer,
   og setter sammen atomet selv.

   BAADE DRAING OG TRYKK. Designsystemet fraraader draing paa
   beroeringsskjerm - den slaass mot rulling, og nettleseren avbryter
   draget naar den tror du blar. Her er begge veier bygget: dra en brikke
   fra beholderen og slipp den paa plata, ELLER trykk beholderen én gang
   og trykk deretter der brikka skal. Byggeplata har `touch-action:none`,
   saa et drag som starter paa den ikke blir til rulling. Beholderne
   ligger utenfor plata og kan rulles som vanlig.

   BEHOLDERNE ER UTOEMMELIGE. Foer 18. september sto det «3 igjen» paa
   hver brikke, og knappen ble graa naar tallet naadde null. Det gjorde
   halve oppgaven for henne: hun kunne telle magasinet i stedet for aa
   telle atomet. Naa henter hun saa mange hun vil, og det er RETTINGEN
   som teller.

   RETTINGEN KOMMER NAAR HUN TRYKKER FERDIG, ikke mens hun bygger. Da
   faar hun bygge ferdig sin egen tanke foerst - og feilen blir noe hun
   ser ved siden av fasiten i stedet for en doer som ikke aapner seg. */
.gs-bygg{ display:grid; grid-template-columns:1fr; gap:18px; }
@media(min-width:920px){ .gs-bygg{ grid-template-columns:auto 1fr; align-items:start; } }

.gs-oppgave{ display:flex; align-items:center; gap:14px; margin-bottom:6px; flex-wrap:wrap; }
.gs-oppgave .gs-stor-rute{ margin:0; width:92px; height:92px; }
.gs-oppgave .gs-stor-rute .gs-stor-sym{ font-size:34px; }
.gs-oppgave-tekst{ font-size:var(--t-meta); color:var(--ink-soft); font-weight:600; line-height:1.5; }
.gs-oppgave-tekst b{ color:var(--ink); }

/* Plata. touch-action:none er det som gjoer draing mulig i det hele
   tatt paa telefon - uten den tar rullingen over pekeren. */
.gs-plate{
  position:relative; width:min(380px, 88vw); margin:0 auto;
  touch-action:none; -webkit-user-select:none; user-select:none;
}
.gs-plate svg{ width:100%; height:auto; display:block; }
.gs-plate.gs-slipp{ filter:drop-shadow(0 0 10px var(--lys-glod)); }

/* Beholderne. Runde glass med kula i - tallet under sier hvor mange hun
   har lagt ut, ikke hvor mange som er igjen. */
.gs-magasin{ display:flex; flex-wrap:wrap; gap:12px; margin:16px 0 8px; justify-content:center; }
@media(min-width:920px){ .gs-magasin{ justify-content:flex-start; } }
.gs-beholder{
  display:flex; flex-direction:column; align-items:center; gap:5px;
  font-family:inherit; cursor:pointer; padding:10px 8px 8px; width:92px;
  border:2px solid var(--line); border-radius:16px; background:var(--paper);
  color:var(--ink); touch-action:none; -webkit-user-select:none; user-select:none;
}
.gs-beholder.gs-valgt{ border-color:var(--messing); background:var(--boks-mild); }
.gs-beholder-glass{
  width:52px; height:52px; border-radius:50%;
  border:2px solid var(--messing); display:flex; align-items:center; justify-content:center;
  background:radial-gradient(circle at 34% 28%, rgba(255,255,255,.9), rgba(0,0,0,.05));
}
.gs-beholder-navn{ font-size:var(--t-etikett); font-weight:700; letter-spacing:.06em; text-transform:uppercase; }
.gs-beholder-tall{ font-size:var(--t-etikett); font-weight:600; color:var(--ink-soft); }

/* Kulene. Samme dybde som i tegningen: lys ovenfra, skygge under. */
.gs-kule{
  width:26px; height:26px; border-radius:50%; display:inline-block; flex-shrink:0;
  box-shadow:inset 0 -3px 5px rgba(0,0,0,.22), inset 0 3px 5px rgba(255,255,255,.45),
             0 1px 3px rgba(44,62,80,.3);
}
.gs-kule.gs-k-proton{ background:radial-gradient(circle at 34% 28%, #D9806C, #A64D3C 72%); }
.gs-kule.gs-k-noytron{ background:radial-gradient(circle at 34% 28%, #A9B6C2, #5A6C7D 72%); }
.gs-kule.gs-k-elektron{ background:radial-gradient(circle at 34% 28%, #86B4D8, #4A7FA8 72%); }
.gs-kule.gs-k-skall{
  background:transparent; border:2.5px solid var(--messing); box-shadow:none;
}

/* Brikka som foelger fingeren mens hun drar er BARE kula - ikke hele
   beholderen med navn under. Navnet gjoer draget til en etikett som
   dekker plata hun sikter paa. */
.gs-flyt{
  position:fixed; z-index:60; pointer-events:none;
  transform:translate(-50%, -50%) scale(1.25); opacity:.92;
}

.gs-bygg-status{ font-size:var(--t-meta); color:var(--ink-soft); font-weight:600; text-align:center; }
@media(min-width:920px){ .gs-bygg-status{ text-align:left; } }
.gs-bygg-svar{ margin-top:14px; font-size:var(--t-brod); font-weight:600; }
.gs-bygg-svar ul{ margin:8px 0 0; padding-left:20px; }
.gs-bygg-svar li{ margin-bottom:4px; font-weight:600; }
.gs-bygg-svar.gs-klart{ color:var(--ink); }

.gs-skjult{ display:none !important; }
</style>
</head>

/* ============================================================
   Tilstand og lagring
   ------------------------------------------------------------
   KV er fasit, localStorage er speilet - samme form som
   mattespillet. Rekordene er UTLEDET av rundene og lagres ikke ved
   siden av dem, saa de to ikke kan bli uenige.

   `apne` er beholdt som felt selv om regelen som setter det er ny:
   nummeret ligger alt i KV fra foer, og flett() slaar de to sidene
   sammen med Math.max. Doeper man det om, mister hun det hun har.
   ============================================================ */
const NOKKEL = 'emma-grunnstoff:v1';
const LOKAL_NOKKEL = 'neam-emma-grunnstoff:v1';

const START_APNE = 10;
const MAKS_APNE = 20;         /* saa langt OPPBYGNING rekker */
const NOYTRON_FRA = 10;       /* laeringsboksen kommer naar hun har mer enn dette */

const XP_STJERNE = 100;
const XP_NOYTRON = 500;
const XP_PER_RIKTIG = 10;
const NIVAA = [0, 500, 1000, 2000, 5000, 10000, 20000, 50000, 100000];

let data = { runder:[], apne:START_APNE, mestret:{}, xp:0, noytron:0 };
let valgtNr = 1;
let runde = null;       /* oevingsrunde */
let prove = null;       /* proeven paa ett stoff */
let laerTest = null;    /* noeytrontesten */
let testVei = 'prove';
let proveStoff = 0;

function $(id){ return document.getElementById(id); }

function apne(){
  return Math.max(START_APNE, Math.min(MAKS_APNE, data.apne || START_APNE));
}
function erApen(nr){ return nr <= apne(); }
function erMestret(nr){ return !!(data.mestret && data.mestret[nr]); }
function stoffAv(nr){
  return STOFFER.filter(function(s){ return s[0] === nr; })[0] || null;
}
function apneStoffer(){
  return STOFFER.filter(function(s){ return erApen(s[0]); })
                .sort(function(a, b){ return a[0] - b[0]; });
}
function antallMestret(){
  return Object.keys(data.mestret || {}).length;
}
function kanNoytron(){ return apne() > NOYTRON_FRA; }
function visNoytron(){ return !!data.noytron; }
function massetall(nr){
  const o = OPPBYGNING[nr];
  return o ? nr + o[0] : null;
}

/* Hydrogen har ETT proton og ETT elektron, og det maa staa slik.
   «1 protoner» er den slags sløvhet som gjoer at en tekst slutter aa
   bli lest. Samlet i én funksjon fordi tallet dukker opp i et titalls
   setninger i rettingen. */
function tall(n, ental, flertall){
  return n + ' ' + (Math.abs(n) === 1 ? ental : flertall);
}
function protonOrd(n){ return tall(n, 'proton', 'protoner'); }
function elektronOrd(n){ return tall(n, 'elektron', 'elektroner'); }
function noytronOrd(n){ return tall(n, 'nøytron', 'nøytroner'); }

function lokalLes(){
  try{ const t = localStorage.getItem(LOKAL_NOKKEL); return t ? JSON.parse(t) : null; }
  catch(e){ return null; }
}
function lokalSkriv(usendt){
  try{ localStorage.setItem(LOKAL_NOKKEL, JSON.stringify({ data:data, usendt:!!usendt })); }
  catch(e){}
}

async function kvLes(nokkel){
  const r = await fetch('/api/data?key=' + encodeURIComponent(nokkel),
                        { headers:{ 'Accept':'application/json' }, cache:'no-store' });
  if(!r.ok) throw new Error('KV les ' + r.status);
  const d = await r.json();
  return (d && d.value !== undefined) ? d.value : null;
}
async function kvSkriv(nokkel, verdi){
  const r = await fetch('/api/data?key=' + encodeURIComponent(nokkel), {
    method:'PUT', headers:{ 'Content-Type':'application/json' },
    body:JSON.stringify(verdi)
  });
  if(!r.ok) throw new Error('KV skriv ' + r.status);
  return true;
}

/* Rundene flettes paa id. To korte runder etter hverandre ville ellers
   mistet den foerste: KV cacher lesinger i opptil 60 sekunder, saa
   svaret vi leser rett etter en skriving kan vaere det gamle.

   Stjernene flettes paa samme maate - en stjerne som finnes paa én av
   sidene skal finnes etterpaa. XP tar det STOERSTE av de to og ikke
   summen: summen ville doblet poengene hver gang to faner var aapne.
   Derfor er XP ogsaa noe som regnes ut, ikke telles opp - se xpAv(). */
function flett(fjern, lokal){
  const runder = {};
  [(fjern && fjern.runder) || [], (lokal && lokal.runder) || []].forEach(function(liste){
    liste.forEach(function(r){ if(r && r.id) runder[r.id] = r; });
  });
  const ut = Object.keys(runder).map(function(k){ return runder[k]; })
                   .sort(function(a, b){ return (a.tid || 0) - (b.tid || 0); });

  const mestret = {};
  [(fjern && fjern.mestret) || {}, (lokal && lokal.mestret) || {}].forEach(function(m){
    Object.keys(m).forEach(function(k){ mestret[k] = m[k]; });
  });

  const noytron = Math.max((fjern && fjern.noytron) || 0, (lokal && lokal.noytron) || 0);
  const xp = Math.max((fjern && fjern.xp) || 0, (lokal && lokal.xp) || 0);

  /* GULVET SETTES HER OG BARE HER. Stjernene og noeytrontesten staar
     lagret hver for seg, saa poengene de ga kan regnes ut paa nytt hvis
     en skriving gikk tapt. Men det maa skje ved fletting og ikke naar
     poeng gis: skrev vi gulvet inn i selve utdelingen, ville en stjerne
     som alt var satt telles to ganger - én gang som gulv og én gang som
     de hundre hun nettopp fikk. */
  const gulv = Object.keys(mestret).length * XP_STJERNE + (noytron ? XP_NOYTRON : 0);

  return {
    runder: ut.slice(-80),
    apne: Math.max((fjern && fjern.apne) || START_APNE, (lokal && lokal.apne) || START_APNE),
    mestret: mestret,
    noytron: noytron,
    xp: Math.max(xp, gulv)
  };
}

async function lagre(){
  lokalSkriv(true);
  try{
    const fjern = await kvLes(NOKKEL);
    data = flett(fjern, data);
    await kvSkriv(NOKKEL, data);
    lokalSkriv(false);
  }catch(e){
    /* Runden ligger i localStorage og sendes neste gang spillet aapnes.
       Skjermen skal ikke kjefte - feilen hoerer i konsollen. */
    console.warn('Grunnstoff: fikk ikke lagret til KV', e);
  }
}

async function last(){
  const lokal = lokalLes();
  if(lokal && lokal.data) data = flett(null, lokal.data);
  tegnAlt();
  try{
    const fjern = await kvLes(NOKKEL);
    data = flett(fjern, data);
    if(lokal && lokal.usendt) await kvSkriv(NOKKEL, data);
    lokalSkriv(false);
  }catch(e){
    console.warn('Grunnstoff: fikk ikke lest KV', e);
  }
  tegnAlt();
}

/* ============================================================
   Erfaringspoeng og nivaa
   ------------------------------------------------------------
   XP ER ET TALL SOM TELLES OPP, og ingenting annet - girXp legger til,
   punktum. Gulvet som redder poeng etter en tapt skriving ligger i
   flett(), der stjernene og noeytrontesten er kjent. Det skillet er
   hele grunnen til at utdeling og gjenoppretting ikke kan rote det til
   for hverandre.
   ============================================================ */
function xpAv(){
  return data.xp || 0;
}
function nivaaAv(xp){
  let n = 1;
  NIVAA.forEach(function(grense, i){ if(xp >= grense) n = i + 1; });
  return n;
}
function nesteGrense(xp){
  for(let i = 0; i < NIVAA.length; i++){ if(xp < NIVAA[i]) return NIVAA[i]; }
  return null;
}

function girXp(poeng, hvorfor){
  if(poeng <= 0) return;
  const forNivaa = nivaaAv(xpAv());
  data.xp = xpAv() + poeng;
  const etterNivaa = nivaaAv(xpAv());
  tegnXp(true);
  if(etterNivaa > forNivaa) si('Nivå ' + etterNivaa + '! ' + (hvorfor || ''));
  else if(hvorfor) si('+' + poeng + ' XP – ' + hvorfor);
}

function tegnXp(blink){
  const xp = xpAv();
  const niv = nivaaAv(xp);
  const fra = NIVAA[niv - 1] || 0;
  const til = nesteGrense(xp);

  $('xpNivaa').textContent = 'Nivå ' + niv;
  $('xpTall').textContent = xp.toLocaleString('nb-NO') + ' XP';

  const andel = til === null ? 1 : (xp - fra) / (til - fra);
  $('xpFyll').style.width = Math.max(2, Math.min(100, andel * 100)) + '%';
  $('xpNeste').textContent = til === null
    ? 'Du står på toppen av stigen.'
    : (til - xp).toLocaleString('nb-NO') + ' XP igjen til nivå ' + (niv + 1) + '.';

  if(blink){
    const linje = $('xpLinje');
    linje.classList.remove('gs-xp-opp');
    void linje.offsetWidth;   /* tvinger animasjonen til aa starte paa nytt */
    linje.classList.add('gs-xp-opp');
  }
}

  bilde.onerror = function(){ this.hidden = true; };

}

  const gull = erMestret(s[0]);
  b.className = 'gs-rute gs-' + s[5]
              + (gull ? ' gs-mestret' : (apen ? ' gs-apen' : ' gs-hvile'));

  b.dataset.nr = s[0];
  b.setAttribute('aria-label', s[2] + ', atomnummer ' + s[0] + '. '

  b.innerHTML = '<span class="gs-nr">' + s[0] + '</span>'
              + '<span class="gs-sym">' + s[1] + '</span>'
