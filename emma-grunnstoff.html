<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Grunnstoff">
<meta name="theme-color" content="#F5F5F5">
<meta name="robots" content="noindex, nofollow">
<title>Grunnstoffspill – Neam</title>
<link rel="apple-touch-icon" href="/bilder/neam-robot.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/felles-rot.css?v=5">
<style>
/* ============================================================
   NEAM - Grunnstoffspill for Emma
   Laget 16. september 2026. Lenket fra Emma dash.
   Begrunnelsene ligger i kartleggingen del 51.

   TRE TRINN, HVERT SPILLBART ALENE. Dette er trinn 1: de ti
   foerste stoffene, med navn, symbol, atomnummer og oppbygning.
   Trinn 2 (hun bygger atomet selv) og trinn 3 (bindinger) kommer
   senere - derfor ligger skallene alt i datasettet, og derfor er
   `laastOpp` et tall som kan vokse i stedet for en ferdig liste.

   FRAMDRIFT SOM GEOGRAFI, IKKE SOM PROSENTSTRIPE. Hele tabellen
   staar der fra foerste stund. De laaste stoffene er moerke og
   upolerte; de aapne er tent. Da ser hun baade hvor hun er og hvor
   hun skal - en stripe som fylles sier ingen av delene.

   SELVRETTENDE FOER POENGGIVENDE. Spoersmaalene har ett riktig
   svar som finnes i datasettet, saa spillet trenger knapt logikk
   for aa si ja eller nei.

   ET GALT SVAR ER IKKE ROEDT. Roedt betyr slett i dette huset, og
   det skal ikke kjennes som straff aa bomme. Det gale svaret blir
   staaende dust og overstroeket ved siden av fasiten. Gult
   (--lys) betyr «det der gikk bra» - samme betydning som lampene
   i mattespillet.

   INGEN NEAM-FIRER. Samtalen er en rask vei til fasiten. Veien ut
   er merket oppe til venstre og sveip tilbake, som i de to andre
   spillene.

   KLASSENAVN ER PREFIKSET `gs-`. Fila er stor nok til at vanlige
   ord som .tom, .ny og .aktiv alt kan bety noe annet - se
   kartleggingen del 26.
   ============================================================ */

:root{
  /* Messing: kontur og ramme, aldri fylt flate. Samme som i
     mattespillet, saa de to spillene er samme hus. */
  --messing:#B8873A;
  --messing-moerk:#8A6428;
  --messing-lys:#D9AE68;
  /* Det gule betyr «riktig» tre steder: tent stoff, riktig svar og
     stjernene. Én farge, én betydning. */
  --lys:#F2C14E;
  --lys-glod:rgba(242,193,78,.75);

  /* Stoffgruppene. Duse flater som i et trykt periodesystem - de
     skiller gruppene uten aa rope, og teksten staar i --ink paa alle. */
  --gr-alkali:#F2C9B8;
  --gr-jordalkali:#F5DFB8;
  --gr-overgang:#EFE0C4;
  --gr-metall:#DCE3E8;
  --gr-halvmetall:#D9E4D2;
  --gr-ikkemetall:#CFE3C7;
  --gr-halogen:#DCE0F0;
  --gr-edelgass:#CFE0EC;
  --gr-lantanoid:#EAD9E8;
  --gr-aktinoid:#E8D3D9;

  --rute:34px;      /* bredden paa én rute i tabellen */
  --rute-luft:3px;
}
@media(min-width:700px){ :root{ --rute:44px; --rute-luft:4px; } }
@media(min-width:1100px){ :root{ --rute:52px; --rute-luft:5px; } }

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; padding:0; width:100%; overflow-x:clip; color:var(--ink); }
body{
  font-family:'Archivo', system-ui, -apple-system, sans-serif;
  background:var(--side-bakgrunn);
  min-height:100vh;
}
/* Bakgrunnsbildet ligger i et eget lag under innholdet - ikke som
   background-attachment:fixed, som iOS regner mot dokumenthoeyden og
   blaaser opp (kartleggingen del 17). */
body::before{
  content:''; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:url('/bilder/bakgrunn.webp') center/cover no-repeat;
}
@media(orientation:portrait){
  body::before{ background-image:url('/bilder/bakgrunn-staaende.webp'); }
}

.gs-side{ max-width:1180px; margin:0 auto; padding:10px 12px 28px; }
@media(min-width:700px){ .gs-side{ padding:18px 20px 36px; } }

/* ---------- Topplinja ---------- */
/* Wrap er ikke pynt: paa telefon ble fanene liggende utenfor
   skjermkanten, og siden `body` har overflow-x:clip kunne de ikke naas
   i det hele tatt. Maalt paa 375px 16. september 2026. */
.gs-topp{ display:flex; align-items:center; gap:12px; margin-bottom:12px; flex-wrap:wrap; }
.gs-merke{ flex-shrink:0; display:block; width:56px; height:56px; }
.gs-merke img{ width:100%; height:100%; object-fit:contain; display:block; }
.gs-merke img[hidden]{ display:none; }
@media(min-width:700px){ .gs-merke{ width:84px; height:84px; } }
.gs-tittel{ margin:0; font-size:var(--t-stor); font-weight:700; line-height:1.15; }
.gs-tittel span{
  display:block; font-size:var(--t-etikett); font-weight:700;
  letter-spacing:.14em; text-transform:uppercase; color:var(--ink-soft);
}

/* Fanene. Tekst uten flate tar deg et sted; den valgte faar messingkant
   under seg i stedet for en fylt flate - fylt flate betyr «skaper noe». */
.gs-faner{ display:flex; gap:4px; margin-left:auto; flex-wrap:wrap; justify-content:flex-end; }
/* Telefon: fanene tar hele linja under merket og tittelen i stedet for
   aa presses ut til hoeyre. */
@media(max-width:640px){
  .gs-faner{ margin-left:0; width:100%; justify-content:flex-start; gap:0; }
  .gs-fane{ padding:8px 12px 8px 0; }
}
.gs-fane{
  border:none; background:transparent; font-family:inherit; cursor:pointer;
  font-size:var(--t-meta); font-weight:700; letter-spacing:.06em;
  text-transform:uppercase; color:var(--ink-soft);
  padding:8px 10px; border-bottom:3px solid transparent;
}
.gs-fane.gs-valgt{ color:var(--ink); border-bottom-color:var(--messing); }

/* ---------- Panelet: papir i messingramme ---------- */
.gs-panel{
  background:var(--paper); border:2px solid var(--messing);
  border-radius:18px; box-shadow:var(--shadow);
  padding:14px; margin-bottom:14px;
}
@media(min-width:700px){ .gs-panel{ padding:18px; } }
.gs-panel-tittel{
  font-size:var(--t-meta); font-weight:700; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink); margin:0 0 10px;
}

/* ---------- Periodesystemet ---------- */
.gs-tabell-ramme{ overflow-x:auto; padding-bottom:6px; }
.gs-tabell{
  display:grid;
  grid-template-columns:repeat(18, var(--rute));
  gap:var(--rute-luft);
  min-width:min-content; margin:0 auto;
}
.gs-rad-merke{
  grid-column:1 / -1; height:6px;
}
.gs-rute{
  width:var(--rute); height:var(--rute); padding:0; border:none;
  border-radius:6px; font-family:inherit; cursor:pointer;
  background:var(--gr-metall); color:var(--ink);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  line-height:1; position:relative; overflow:hidden;
}
.gs-rute .gs-nr{
  position:absolute; top:2px; left:3px;
  font-size:9px; font-weight:600; color:var(--ink-soft);
}
.gs-rute .gs-sym{ font-size:calc(var(--rute) * .40); font-weight:700; }
.gs-rute .gs-navn{
  font-size:7px; font-weight:600; max-width:100%; padding:0 2px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--ink-soft);
}
@media(min-width:1100px){ .gs-rute .gs-navn{ font-size:8px; } }

/* Tent: stoffet er laast opp. Den tynne gule kanten er det samme
   «dette gikk bra» som stjernene. */
.gs-rute.gs-apen{ box-shadow:inset 0 0 0 1.5px var(--lys-glod); }
.gs-rute.gs-apen:active{ transform:scale(.94); }

/* Laast: moerkt og upolert. Ikke skjult - hun skal se hvor hun skal. */
.gs-rute.gs-laast{
  background:#6E6A62; color:rgba(255,255,255,.62); cursor:default;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.10);
}
.gs-rute.gs-laast .gs-nr{ color:rgba(255,255,255,.45); }
.gs-rute.gs-laast .gs-navn{ color:rgba(255,255,255,.45); }

.gs-rute.gs-peker{
  background:transparent; cursor:default; color:var(--ink-soft);
  font-size:calc(var(--rute) * .34); font-weight:700;
}
.gs-tom{ width:var(--rute); height:var(--rute); }

/* Fargene per gruppe. Samme flate laast som aapen - laast-regelen
   over vinner fordi den staar etter. */
.gs-alkali{ background:var(--gr-alkali); }
.gs-jordalkali{ background:var(--gr-jordalkali); }
.gs-overgang{ background:var(--gr-overgang); }
.gs-metall{ background:var(--gr-metall); }
.gs-halvmetall{ background:var(--gr-halvmetall); }
.gs-ikkemetall{ background:var(--gr-ikkemetall); }
.gs-halogen{ background:var(--gr-halogen); }
.gs-edelgass{ background:var(--gr-edelgass); }
.gs-lantanoid{ background:var(--gr-lantanoid); }
.gs-aktinoid{ background:var(--gr-aktinoid); }

.gs-tegnforklaring{
  display:flex; flex-wrap:wrap; gap:6px 14px; margin-top:12px;
  font-size:var(--t-etikett); color:var(--ink-soft); font-weight:600;
}
.gs-tegnforklaring span{ display:flex; align-items:center; gap:5px; }
.gs-prikk{ width:11px; height:11px; border-radius:3px; display:inline-block; }

/* ---------- Laben: ett stoff i detalj ---------- */
.gs-lab{ display:grid; grid-template-columns:1fr; gap:16px; }
@media(min-width:760px){ .gs-lab{ grid-template-columns:auto 1fr auto; align-items:center; } }

.gs-stor-rute{
  width:104px; height:104px; border-radius:12px; border:2px solid var(--messing);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  margin:0 auto; line-height:1.1;
}
.gs-stor-rute .gs-stor-nr{ font-size:var(--t-meta); font-weight:600; color:var(--ink-soft); }
.gs-stor-rute .gs-stor-sym{ font-size:40px; font-weight:700; }
.gs-stor-rute .gs-stor-navn{ font-size:var(--t-etikett); font-weight:600; }

.gs-fakta{ margin:0; }
.gs-fakta dt{
  font-size:var(--t-etikett); font-weight:700; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-soft); margin-top:8px;
}
.gs-fakta dt:first-child{ margin-top:0; }
.gs-fakta dd{ margin:1px 0 0; font-size:var(--t-brod); font-weight:600; }

.gs-atom{ display:block; margin:0 auto; width:min(260px, 74vw); height:auto; }
.gs-kjerne{ fill:var(--danger); }
.gs-skall{ fill:none; stroke:var(--messing); stroke-width:1.4; opacity:.75; }
.gs-elektron{ fill:var(--aksent); }
.gs-atom text{ font-family:inherit; font-size:9px; font-weight:700; fill:var(--ink-soft); }

.gs-lab-knapper{ display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; }

/* Knappene foelger husets betydninger: blaa er «alt annet», og
   messingkanten er uttrykket her. Ingen fylt gruenn - ingenting
   av dette skaper noe. */
.gs-knapp{
  font-family:inherit; font-size:var(--t-brod); font-weight:700;
  padding:11px 18px; border-radius:12px; cursor:pointer;
  border:2px solid var(--messing); background:var(--paper); color:var(--ink);
}
.gs-knapp:active{ transform:scale(.98); }
.gs-knapp.gs-tung{ background:var(--aksent); border-color:var(--aksent); color:#FFFFFF; }
.gs-knapp.gs-tung:active{ background:var(--aksent-moerk); }
.gs-knapp[disabled]{ opacity:.45; cursor:default; }

/* ---------- Test meg ---------- */
.gs-valg{ display:flex; flex-wrap:wrap; gap:8px; margin:6px 0 16px; }
.gs-velger{
  font-family:inherit; font-size:var(--t-brod); font-weight:700;
  padding:9px 16px; border-radius:999px; cursor:pointer;
  border:2px solid var(--line); background:var(--paper); color:var(--ink-soft);
}
.gs-velger.gs-pa{ border-color:var(--messing); color:var(--ink); background:var(--boks-mild); }
.gs-velger .gs-hake{ margin-right:6px; opacity:0; }
.gs-velger.gs-pa .gs-hake{ opacity:1; }

.gs-teller{
  font-size:var(--t-etikett); font-weight:700; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-soft);
}
.gs-sporsmaal{ font-size:var(--t-stor); font-weight:700; margin:10px 0 4px; }
.gs-sporsmaal-sub{ font-size:var(--t-meta); color:var(--ink-soft); font-weight:600; margin-bottom:14px; }

.gs-svar{ display:grid; grid-template-columns:1fr; gap:10px; }
@media(min-width:620px){ .gs-svar{ grid-template-columns:1fr 1fr; } }
.gs-svar-knapp{
  font-family:inherit; font-size:var(--t-brod); font-weight:700; text-align:left;
  padding:14px 16px; border-radius:12px; cursor:pointer;
  border:2px solid var(--line); background:var(--paper); color:var(--ink);
}
.gs-svar-knapp:active{ transform:scale(.99); }
/* Riktig: gult, som lampene. Galt: dust og overstroeket, aldri roedt. */
.gs-svar-knapp.gs-riktig{
  border-color:var(--lys); background:rgba(242,193,78,.22);
  box-shadow:0 0 0 3px var(--lys-glod);
}
.gs-svar-knapp.gs-galt{ opacity:.5; text-decoration:line-through; }
.gs-svar-knapp[disabled]{ cursor:default; }

.gs-fasit{ margin-top:14px; font-size:var(--t-brod); font-weight:600; min-height:24px; }

/* ---------- Resultatet ---------- */
.gs-resultat{ text-align:center; }
.gs-stjerner{ display:flex; justify-content:center; gap:6px; margin:6px 0 12px; }
.gs-stjerne{ width:44px; height:44px; display:block; }
/* Tom stjerne er den SAMME fila avfarget - ett bilde, to tilstander,
   som ikke kan komme i utakt. */
.gs-stjerne.gs-tom-stjerne{ filter:grayscale(1) opacity(.32); }
.gs-fasitliste{ text-align:left; margin-top:16px; }
.gs-fasitrad{
  display:flex; gap:10px; padding:7px 0; border-top:1px solid var(--line);
  font-size:var(--t-meta);
}
.gs-fasitrad span:first-child{ font-weight:700; min-width:26px; }
.gs-fasitrad.gs-bom span:last-child{ color:var(--ink-soft); }

/* ---------- Framdrift ---------- */
.gs-tall{ display:flex; flex-wrap:wrap; gap:18px 28px; }
.gs-tall div{ min-width:96px; }
.gs-tall dt{
  font-size:var(--t-etikett); font-weight:700; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-soft);
}
.gs-tall dd{ margin:2px 0 0; font-size:var(--t-stor); font-weight:700; }

/* ---------- Pilla som sier fra ---------- */
.gs-pille{
  position:fixed; left:50%; transform:translateX(-50%);
  bottom:calc(18px + env(safe-area-inset-bottom));
  background:var(--ink); color:var(--paper); font-size:var(--t-meta); font-weight:600;
  padding:10px 16px; border-radius:999px; box-shadow:var(--shadow); z-index:40;
}
.gs-pille[hidden]{ display:none; }

/* ---------- Bygg atom ----------
   Trinn 2 i kartleggingen del 51. Hun faar navn, symbol og atomnummer,
   og setter sammen atomet selv.

   BAADE DRAING OG TRYKK. Designsystemet fraraader draing paa
   beroeringsskjerm - den slaass mot rulling, og nettleseren avbryter
   draget naar den tror du blar. Her er begge veier bygget: dra en brikke
   fra magasinet og slipp den paa plata, ELLER trykk brikken én gang og
   trykk deretter der den skal. Byggeplata har `touch-action:none`, saa
   et drag som starter paa den ikke blir til rulling. Magasinet ligger
   utenfor plata og kan rulles som vanlig.

   RETTINGEN KOMMER NAAR HUN TRYKKER FERDIG, ikke mens hun bygger. Da
   faar hun bygge ferdig sin egen tanke foerst - og feilen blir noe hun
   ser ved siden av fasiten i stedet for en doer som ikke aapner seg. */
.gs-bygg{ display:grid; grid-template-columns:1fr; gap:18px; }
@media(min-width:920px){ .gs-bygg{ grid-template-columns:auto 1fr; align-items:start; } }

.gs-oppgave{ display:flex; align-items:center; gap:14px; margin-bottom:6px; flex-wrap:wrap; }
.gs-oppgave .gs-stor-rute{ margin:0; width:84px; height:84px; }
.gs-oppgave .gs-stor-rute .gs-stor-sym{ font-size:32px; }
.gs-oppgave-tekst{ font-size:var(--t-meta); color:var(--ink-soft); font-weight:600; }
.gs-oppgave-tekst b{ color:var(--ink); }

/* Plata. touch-action:none er det som gjoer draing mulig i det hele
   tatt paa telefon - uten den tar rullingen over pekeren. */
.gs-plate{
  position:relative; width:min(330px, 84vw); margin:0 auto;
  touch-action:none; -webkit-user-select:none; user-select:none;
}
.gs-plate svg{ width:100%; height:auto; display:block; }
.gs-plate.gs-slipp{ filter:drop-shadow(0 0 8px var(--lys-glod)); }

.gs-magasin{ display:flex; flex-wrap:wrap; gap:10px; margin:14px 0 8px; }
.gs-brikke{
  display:flex; align-items:center; gap:8px; font-family:inherit;
  font-size:var(--t-meta); font-weight:700; color:var(--ink);
  padding:10px 15px; border-radius:999px; cursor:pointer;
  border:2px solid var(--line); background:var(--paper);
  touch-action:none; -webkit-user-select:none; user-select:none;
}
.gs-brikke.gs-valgt{ border-color:var(--messing); background:var(--boks-mild); }
.gs-brikke[disabled]{ opacity:.38; cursor:default; }
.gs-kule{ width:15px; height:15px; border-radius:50%; display:inline-block; flex-shrink:0; }
.gs-kule.gs-k-proton{ background:var(--danger); }
.gs-kule.gs-k-elektron{ background:var(--aksent); }
.gs-kule.gs-k-skall{
  background:transparent; border:2px solid var(--messing); width:17px; height:17px;
}
/* Brikka som foelger fingeren mens hun drar. */
.gs-flyt{
  position:fixed; z-index:60; pointer-events:none;
  transform:translate(-50%, -50%); opacity:.92;
}

.gs-bygg-tall{ font-size:var(--t-meta); color:var(--ink-soft); font-weight:600; }
.gs-bygg-svar{ margin-top:14px; font-size:var(--t-brod); font-weight:600; }
.gs-bygg-svar ul{ margin:8px 0 0; padding-left:20px; }
.gs-bygg-svar li{ margin-bottom:4px; font-weight:600; }
.gs-bygg-svar.gs-klart{ color:var(--ink); }

/* Feil skall: stiplet og dust, aldri roedt. Roedt betyr slett. */
.gs-skall.gs-feil{ stroke-dasharray:5 5; opacity:.5; }
.gs-skall.gs-riktig-skall{ stroke:var(--lys); stroke-width:2.4; opacity:1; }

.gs-skjult{ display:none !important; }
</style>
</head>
<body>

<div class="gs-side">

  <div class="gs-topp">
    <a class="gs-merke" href="/emma.html" aria-label="Til Emma dash">
      <img src="/bilder/merke-emma-dash.png?v=2" alt="Emma dash" width="512" height="517"
           onerror="this.hidden = true">
    </a>
    <h1 class="gs-tittel">Grunnstoffene<span>Neams kjemiverden</span></h1>
    <div class="gs-faner">
      <button class="gs-fane gs-valgt" id="faneTabell" onclick="visFane('tabell')">Periodesystemet</button>
      <button class="gs-fane" id="faneBygg" onclick="visFane('bygg')">Bygg atom</button>
      <button class="gs-fane" id="faneTest" onclick="visFane('test')">Test meg</button>
      <button class="gs-fane" id="faneFram" onclick="visFane('fram')">Framdrift</button>
    </div>
  </div>

  <!-- ============ Periodesystemet ============ -->
  <section id="visTabell">
    <div class="gs-panel">
      <h2 class="gs-panel-tittel">Periodesystemet</h2>
      <div class="gs-tabell-ramme">
        <div class="gs-tabell" id="tabell"></div>
      </div>
      <div class="gs-tegnforklaring" id="tegnforklaring"></div>
    </div>

    <div class="gs-panel" id="labPanel">
      <h2 class="gs-panel-tittel">Atomnavns-laben</h2>
      <div class="gs-lab" id="lab"></div>
      <div class="gs-lab-knapper">
        <button class="gs-knapp gs-tung" onclick="byggDette()">Bygg dette atomet</button>
        <button class="gs-knapp" onclick="startFraLab()">Test meg på dette</button>
        <button class="gs-knapp" onclick="nesteStoff()">Neste stoff</button>
      </div>
    </div>
  </section>

  <!-- ============ Bygg atom ============ -->
  <section id="visBygg" class="gs-skjult">
    <div class="gs-panel">
      <h2 class="gs-panel-tittel">Bygg atomet</h2>
      <div class="gs-oppgave" id="byggOppgave"></div>

      <div class="gs-bygg">
        <div>
          <div class="gs-plate" id="plate"></div>
        </div>
        <div>
          <p class="gs-teller">Dra en brikke ut på plata – eller trykk brikken først, og så der den skal</p>
          <div class="gs-magasin" id="magasin"></div>
          <p class="gs-bygg-tall" id="byggTall"></p>
          <div class="gs-lab-knapper">
            <button class="gs-knapp gs-tung" onclick="sjekkBygg()">Ferdig</button>
            <button class="gs-knapp" onclick="angreBygg()">Angre</button>

/* Oppbygningen. Bare for de tjue foerste: det er der skallene kan
   tegnes uten aa lyve (fra og med skandium fylles skallene i en
   rekkefoelge som ikke kan leses av tabellen), og det er ogsaa
   saa langt trinn 1 og 2 gaar. [noeytroner, skall...] */
const OPPBYGNING = {
  1:[0,[1]],      2:[2,[2]],      3:[4,[2,1]],    4:[5,[2,2]],
  5:[6,[2,3]],    6:[6,[2,4]],    7:[7,[2,5]],    8:[8,[2,6]],
  9:[10,[2,7]],  10:[10,[2,8]],  11:[12,[2,8,1]],12:[12,[2,8,2]],
 13:[14,[2,8,3]],14:[14,[2,8,4]],15:[16,[2,8,5]],16:[16,[2,8,6]],
 17:[18,[2,8,7]],18:[22,[2,8,8]],19:[20,[2,8,8,1]],20:[20,[2,8,8,2]]
};

const KATEGORINAVN = {
  alkali:'Alkalimetall', jordalkali:'Jordalkalimetall', overgang:'Overgangsmetall',
  metall:'Metall', halvmetall:'Halvmetall', ikkemetall:'Ikke-metall',
  halogen:'Halogen', edelgass:'Edelgass', lantanoid:'Lantanoid', aktinoid:'Aktinoid'
};

/* ============================================================
   Tilstand og lagring
   ------------------------------------------------------------
   KV er fasit, localStorage er speilet - samme form som
   mattespillet. Rekordene er UTLEDET av rundene og lagres ikke ved
   siden av dem, saa de to ikke kan bli uenige.
   ============================================================ */
const NOKKEL = 'emma-grunnstoff:v1';
const LOKAL_NOKKEL = 'neam-emma-grunnstoff:v1';

/* Trinn 1 er de ti foerste. Tallet vokser naar hun viser at hun kan
   dem - se laasOppHvisFortjent(). Taket er tjue saa lenge skallene
   bare finnes saa langt; resten av tabellen staar der for aa vise
   hvor hun skal, ikke for aa spoerres om ennaa. */
const START_APNE = 10;
const MAKS_APNE = 20;
const KRAV_FOR_LAAS = 0.9;     /* andel riktige som aapner fem nye */
const MIN_FOR_LAAS = 10;       /* ... i en runde paa minst saa mange */

let data = { runder:[], apne:START_APNE };
let valgtNr = 1;
let runde = null;

function $(id){ return document.getElementById(id); }

function apne(){
  return Math.max(START_APNE, Math.min(MAKS_APNE, data.apne || START_APNE));
}
function erApen(nr){ return nr <= apne(); }
function stoffAv(nr){
  return STOFFER.filter(function(s){ return s[0] === nr; })[0] || null;
}
function apneStoffer(){
  return STOFFER.filter(function(s){ return erApen(s[0]); })
                .sort(function(a, b){ return a[0] - b[0]; });
}

function lokalLes(){
  try{ const t = localStorage.getItem(LOKAL_NOKKEL); return t ? JSON.parse(t) : null; }
  catch(e){ return null; }
}
function lokalSkriv(usendt){
  try{ localStorage.setItem(LOKAL_NOKKEL, JSON.stringify({ data:data, usendt:!!usendt })); }
  catch(e){}
}

async function kvLes(nokkel){
  const r = await fetch('/api/data?key=' + encodeURIComponent(nokkel),
                        { headers:{ 'Accept':'application/json' }, cache:'no-store' });
  if(!r.ok) throw new Error('KV les ' + r.status);
  const d = await r.json();
  return (d && d.value !== undefined) ? d.value : null;
}
async function kvSkriv(nokkel, verdi){
  const r = await fetch('/api/data?key=' + encodeURIComponent(nokkel), {
    method:'PUT', headers:{ 'Content-Type':'application/json' },
    body:JSON.stringify(verdi)
  });
  if(!r.ok) throw new Error('KV skriv ' + r.status);
  return true;
}

/* Rundene flettes paa id. To korte runder etter hverandre ville ellers
   mistet den foerste: KV cacher lesinger i opptil 60 sekunder, saa
   svaret vi leser rett etter en skriving kan vaere det gamle. */
function flett(fjern, lokal){
  const runder = {};
  [(fjern && fjern.runder) || [], (lokal && lokal.runder) || []].forEach(function(liste){
    liste.forEach(function(r){ if(r && r.id) runder[r.id] = r; });
  });
  const ut = Object.keys(runder).map(function(k){ return runder[k]; })
                   .sort(function(a, b){ return (a.tid || 0) - (b.tid || 0); });
  return {
    runder: ut.slice(-60),
    apne: Math.max((fjern && fjern.apne) || START_APNE, (lokal && lokal.apne) || START_APNE)
  };
}

async function lagre(){
  lokalSkriv(true);
  try{
    const fjern = await kvLes(NOKKEL);
    data = flett(fjern, data);
    await kvSkriv(NOKKEL, data);
    lokalSkriv(false);
  }catch(e){
    /* Runden ligger i localStorage og sendes neste gang spillet aapnes.
       Skjermen skal ikke kjefte - feilen hoerer i konsollen. */
    console.warn('Grunnstoff: fikk ikke lagret til KV', e);
  }
}

async function last(){
  const lokal = lokalLes();
  if(lokal && lokal.data) data = flett(null, lokal.data);
  tegnAlt();
  try{
    const fjern = await kvLes(NOKKEL);
    data = flett(fjern, data);
    if(lokal && lokal.usendt) await kvSkriv(NOKKEL, data);
    lokalSkriv(false);
  }catch(e){
    console.warn('Grunnstoff: fikk ikke lest KV', e);
  }
  tegnAlt();
}

/* ============================================================
   Tabellen
   ============================================================ */
function tegnTabell(){
  const rutenett = $('tabell');
  rutenett.textContent = '';

  for(let rad = 1; rad <= 9; rad++){
    /* Litt luft foer lantanoidene, saa de to nederste radene leses som
       et eget hefte og ikke som periode 8 og 9. */
    if(rad === 8){
      const luft = document.createElement('div');
      luft.className = 'gs-rad-merke';
      rutenett.appendChild(luft);
    }
    for(let gr = 1; gr <= 18; gr++){
      const s = STOFFER.filter(function(x){ return x[3] === rad && x[4] === gr; })[0];

      if(!s && (rad === 6 || rad === 7) && gr === 3){
        const peker = document.createElement('div');
        peker.className = 'gs-rute gs-peker';
        peker.textContent = '*';
        peker.setAttribute('aria-hidden', 'true');
        rutenett.appendChild(peker);
        continue;
      }
      if(!s){
        const tom = document.createElement('div');
        tom.className = 'gs-tom';
        rutenett.appendChild(tom);
        continue;
      }

      const b = document.createElement('button');
      const laast = !erApen(s[0]);
      b.className = 'gs-rute gs-' + s[5] + (laast ? ' gs-laast' : ' gs-apen');
      b.type = 'button';
      b.dataset.nr = s[0];
      b.setAttribute('aria-label', laast
        ? s[2] + ', ikke låst opp ennå'
        : s[2] + ', atomnummer ' + s[0]);
      b.innerHTML = '<span class="gs-nr">' + s[0] + '</span>'
                  + '<span class="gs-sym">' + s[1] + '</span>'
                  + '<span class="gs-navn">' + s[2] + '</span>';
      b.onclick = function(){ velgStoff(s[0]); };
      rutenett.appendChild(b);
    }
  }

  const tf = $('tegnforklaring');
  tf.textContent = '';
  Object.keys(KATEGORINAVN).forEach(function(k){
    const rad = document.createElement('span');
    rad.innerHTML = '<i class="gs-prikk gs-' + k + '"></i>' + KATEGORINAVN[k];
    tf.appendChild(rad);
  });
  const laast = document.createElement('span');
  laast.innerHTML = '<i class="gs-prikk" style="background:#6E6A62"></i>Ikke låst opp ennå';
  tf.appendChild(laast);
}

function velgStoff(nr){
  if(!erApen(nr)){
    const s = stoffAv(nr);
    si(s[2] + ' er ikke låst opp ennå. Ta en test på dem du har!');
    return;
  }
  valgtNr = nr;
  tegnLab();
  $('labPanel').scrollIntoView({ behavior:'smooth', block:'nearest' });
}

function nesteStoff(){
  const liste = apneStoffer();
  const i = liste.map(function(s){ return s[0]; }).indexOf(valgtNr);
  valgtNr = liste[(i + 1) % liste.length][0];
  tegnLab();
}

/* ============================================================
   Laben - ett stoff i detalj
   ============================================================ */
function tegnLab(){
  const s = stoffAv(valgtNr);
  const o = OPPBYGNING[valgtNr];
  const lab = $('lab');
  lab.textContent = '';

  const rute = document.createElement('div');
  rute.className = 'gs-stor-rute gs-' + s[5];
  rute.innerHTML = '<span class="gs-stor-nr">' + s[0] + '</span>'
                 + '<span class="gs-stor-sym">' + s[1] + '</span>'
                 + '<span class="gs-stor-navn">' + s[2] + '</span>';
  lab.appendChild(rute);

  const fakta = document.createElement('dl');
  fakta.className = 'gs-fakta';
  const rader = [
    ['Atomnavn', s[2]],
    ['Kjemisk symbol', s[1]],
    ['Atomnummer', String(s[0])],
    ['Gruppe', KATEGORINAVN[s[5]]]
  ];
  if(o){
    rader.push(['Protoner', String(s[0])]);
    rader.push(['Nøytroner', String(o[0])]);
    rader.push(['Elektroner', String(s[0]) + ' – fordelt på ' + o[1].join(', ')]);
  }
  rader.forEach(function(r){
    const dt = document.createElement('dt'); dt.textContent = r[0];
    const dd = document.createElement('dd'); dd.textContent = r[1];
    fakta.appendChild(dt); fakta.appendChild(dd);
  });
  lab.appendChild(fakta);

  if(o) lab.appendChild(tegnAtom(s, o[1]));
}

/* Skallmodellen. Kjernen i midten, ett spor per skall, og elektronene
   fordelt jevnt rundt. Tegnet her og ikke hentet som bilde: da finnes
   det ingen fil som kan mangle, og modellen kan ikke komme i utakt med
   tallene ved siden av. */
function tegnAtom(s, skall){
  const NS = 'http://www.w3.org/2000/svg';
  const midt = 130, r0 = 30, avstand = 22;
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('class', 'gs-atom');
  svg.setAttribute('viewBox', '0 0 260 260');
  svg.setAttribute('role', 'img');
  svg.setAttribute('aria-label', 'Atommodell av ' + s[2] + ': '
    + s[0] + ' protoner i kjernen og elektroner i ' + skall.length
    + (skall.length === 1 ? ' skall' : ' skall') + ' – ' + skall.join(', '));

  skall.forEach(function(antall, i){
    const r = r0 + (i + 1) * avstand;
    const sirkel = document.createElementNS(NS, 'circle');
    sirkel.setAttribute('class', 'gs-skall');
    sirkel.setAttribute('cx', midt); sirkel.setAttribute('cy', midt);
    sirkel.setAttribute('r', r);
    svg.appendChild(sirkel);

    for(let e = 0; e < antall; e++){
      /* Foerste elektron rett opp, resten jevnt rundt. Hvert skall
         forskyves litt, saa elektronene i to skall ikke staar paa
         linje og ser ut som ett. */
      const v = (e / antall) * Math.PI * 2 - Math.PI / 2 + i * 0.4;
      const p = document.createElementNS(NS, 'circle');
      p.setAttribute('class', 'gs-elektron');
      p.setAttribute('cx', (midt + Math.cos(v) * r).toFixed(1));
      p.setAttribute('cy', (midt + Math.sin(v) * r).toFixed(1));
      p.setAttribute('r', 5);
      svg.appendChild(p);
    }
  });

  const kjerne = document.createElementNS(NS, 'circle');
  kjerne.setAttribute('class', 'gs-kjerne');
  kjerne.setAttribute('cx', midt); kjerne.setAttribute('cy', midt);
  kjerne.setAttribute('r', 16);
  svg.appendChild(kjerne);

  const tekst = document.createElementNS(NS, 'text');
  tekst.setAttribute('x', midt); tekst.setAttribute('y', midt + 32);
  tekst.setAttribute('text-anchor', 'middle');
  tekst.textContent = 'KJERNE';
  svg.appendChild(tekst);

  return svg;
}

/* ============================================================
   Test meg
   ------------------------------------------------------------
   Hun velger selv hvor stor testen er og hvilke sider av stoffet
   den spoer om. Da skalerer den samme sida fra to minutter i bilen
   til en oekt ved bordet, uten at det bygges to ting.
   ============================================================ */
const ANTALL = [5, 10, 15];
const SIDER = [

];

let valgAntall = 10;
let valgteSider = { navn:true, symbol:true, nummer:true, skall:false };

function tegnValg(){
  const a = $('valgAntall');

    const b = document.createElement('button');

    a.appendChild(b);
  });

  const s = $('valgSider');
  s.textContent = '';
  SIDER.forEach(function(side){
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'gs-velger' + (valgteSider[side.id] ? ' gs-pa' : '');
    b.innerHTML = '<span class="gs-hake">✓</span>' + side.navn;
    b.onclick = function(){
      valgteSider[side.id] = !valgteSider[side.id];
      tegnValg();
    };
    s.appendChild(b);
  });

  const noen = SIDER.some(function(x){ return valgteSider[x.id]; });
  $('startKnapp').disabled = !noen;
  $('testHint').textContent = noen
    ? 'Du øver på de ' + apne() + ' første stoffene.'
    : 'Velg minst én side av stoffet.';
}

function blandet(liste){
  const b = liste.slice();
  for(let i = b.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const t = b[i]; b[i] = b[j]; b[j] = t;
  }
  return b;
}

function lagSporsmaal(s, type){
  const andre = apneStoffer().filter(function(x){ return x[0] !== s[0]; });
  const tre = blandet(andre).slice(0, 3);

  if(type === 'navn'){
    return { tekst:'Hvilket grunnstoff har symbolet ' + s[1] + '?',
             sub:'Atomnummer ' + s[0] + '.',
             fasit:s[2], alternativ:blandet([s[2]].concat(tre.map(function(x){ return x[2]; }))) };
  }
  if(type === 'symbol'){
    return { tekst:'Hva er det kjemiske symbolet for ' + s[2] + '?', sub:'',
             fasit:s[1], alternativ:blandet([s[1]].concat(tre.map(function(x){ return x[1]; }))) };
  }
  if(type === 'nummer'){
    return { tekst:'Hvilket atomnummer har ' + s[2] + '?',
             sub:'Atomnummeret er hvor mange protoner kjernen har.',
             fasit:String(s[0]),
             alternativ:blandet([String(s[0])].concat(tre.map(function(x){ return String(x[0]); }))) };
  }
  /* Oppbygningen: elektronene fordelt paa skall. Alternativene er andre
     stoffers ekte fordelinger, ikke oppdiktede tall - da er et galt svar
     noe som finnes, og hun kan se hvorfor det ikke passer. */
  const min = OPPBYGNING[s[0]][1].join(', ');
  const feil = [];
  blandet(andre).forEach(function(x){
    const f = OPPBYGNING[x[0]] && OPPBYGNING[x[0]][1].join(', ');
    if(f && f !== min && feil.indexOf(f) === -1 && feil.length < 3) feil.push(f);
  });
  return { tekst:'Hvordan ligger elektronene i ' + s[2] + '?',
           sub:s[2] + ' har ' + s[0] + ' elektroner. Innerste skall først.',
           fasit:min, alternativ:blandet([min].concat(feil)) };
}

function startRunde(){
  const typer = SIDER.map(function(x){ return x.id; })
                     .filter(function(id){ return valgteSider[id]; });
  if(!typer.length) return;

  /* Stoffene trekkes uten gjentakelse saa langt de rekker. Er testen
     lengre enn lista, begynner den paa nytt i ny rekkefoelge. */
  const pott = [];
  while(pott.length < valgAntall){
    blandet(apneStoffer()).forEach(function(s){ if(pott.length < valgAntall) pott.push(s); });
  }

  runde = {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    tid: Date.now(),
    sider: typer.slice(),
    apne: apne(),
    steg: 0,
    svar: [],
    sporsmaal: pott.map(function(s){
      let t = typer[Math.floor(Math.random() * typer.length)];
      /* Skall-spoersmaal krever at stoffet har en oppbygning i
         datasettet. Har det ikke det, byttes typen - hun skal aldri
         faa et spoersmaal spillet ikke kan rette. */
      if(t === 'skall' && !OPPBYGNING[s[0]]){
        const uten = typer.filter(function(x){ return x !== 'skall'; });
        t = uten.length ? uten[Math.floor(Math.random() * uten.length)] : 'navn';
      }
      return Object.assign({ stoff:s[0], type:t }, lagSporsmaal(s, t));
    })
  };

  $('testOppsett').classList.add('gs-skjult');
  $('testResultat').classList.add('gs-skjult');
  $('testSpill').classList.remove('gs-skjult');
  tegnSporsmaal();
}

function startFraLab(){
  visFane('test');
  startRunde();
}

function tegnSporsmaal(){
  const sp = runde.sporsmaal[runde.steg];
  $('testTeller').textContent = 'Spørsmål ' + (runde.steg + 1) + ' av ' + runde.sporsmaal.length;
  $('testSporsmaal').textContent = sp.tekst;
  $('testSub').textContent = sp.sub || '';
  $('testFasit').textContent = '';

  const boks = $('testSvar');
  boks.textContent = '';
  sp.alternativ.forEach(function(alt){
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'gs-svar-knapp';
    b.textContent = alt;
    b.onclick = function(){ svar(alt, b); };
    boks.appendChild(b);
  });
}

function svar(valgt, knapp){
  const sp = runde.sporsmaal[runde.steg];
  const riktig = valgt === sp.fasit;

  Array.prototype.forEach.call($('testSvar').children, function(b){
    b.disabled = true;
    if(b.textContent === sp.fasit) b.classList.add('gs-riktig');
  });
  if(!riktig) knapp.classList.add('gs-galt');

  runde.svar.push({ stoff:sp.stoff, type:sp.type, riktig:riktig,
                    valgt:valgt, fasit:sp.fasit });

  const s = stoffAv(sp.stoff);
  $('testFasit').textContent = riktig
    ? 'Riktig.'
    : 'Riktig svar er ' + sp.fasit + ' – ' + s[2] + '.';

  setTimeout(function(){
    runde.steg++;
    if(runde.steg < runde.sporsmaal.length) tegnSporsmaal();
    else avsluttRunde();
  }, riktig ? 650 : 1500);
}

/* Fem stjerner for alt riktig, saa ned i femtedeler med 1 som gulv -
   samme skala som mattespillet. Hun har oevd uansett. */
function stjernerAv(andel){
  return Math.max(1, Math.round(andel * 5));
}

async function avsluttRunde(){
  const riktige = runde.svar.filter(function(s){ return s.riktig; }).length;
  const andel = riktige / runde.svar.length;

  data.runder.push({ id:runde.id, tid:runde.tid, antall:runde.svar.length,
                     riktige:riktige, sider:runde.sider, apne:runde.apne });

  const laaste = laasOppHvisFortjent(andel, runde.svar.length);

  $('testSpill').classList.add('gs-skjult');
  $('testResultat').classList.remove('gs-skjult');

  const stjerner = stjernerAv(andel);
  const boks = $('stjerner');
  boks.textContent = '';
  for(let i = 0; i < 5; i++){
    const bilde = document.createElement('img');
    bilde.className = 'gs-stjerne' + (i < stjerner ? '' : ' gs-tom-stjerne');
    bilde.src = '/bilder/spill/stjerne.webp?v=1';
    bilde.alt = ''; bilde.width = 44; bilde.height = 44;
    bilde.onerror = function(){ this.hidden = true; };
    boks.appendChild(bilde);
  }

  $('resultatTekst').textContent = riktige + ' av ' + runde.svar.length + ' riktig';
  $('resultatSub').textContent = laaste
    ? 'Du låste opp ' + laaste + ' nye stoffer. De er tent i tabellen nå.'
    : (andel === 1 ? 'Alt riktig.' : 'Se gjennom dem du bommet på under.');

  const liste = $('fasitliste');
  liste.textContent = '';
  runde.svar.forEach(function(s, i){
    const rad = document.createElement('div');
    rad.className = 'gs-fasitrad' + (s.riktig ? '' : ' gs-bom');
    const stoff = stoffAv(s.stoff);
    rad.innerHTML = '<span>' + (i + 1) + '.</span><span>' + stoff[2] + ' – '
      + (s.riktig ? 'riktig' : 'du svarte ' + s.valgt + ', riktig er ' + s.fasit) + '</span>';
    liste.appendChild(rad);
  });

  tegnTabell();
  tegnFramdrift();
  await lagre();
}

/* Fem nye stoffer naar en runde paa minst ti er 90 % riktig eller bedre.
   Regelen staar her og ett sted til - i teksten under tabellen - saa hun
   vet hva som skal til. Taket er MAKS_APNE: lenger gaar ikke trinn 1. */
function laasOppHvisFortjent(andel, antall){
  if(antall < MIN_FOR_LAAS || andel < KRAV_FOR_LAAS) return 0;
  const naa = apne();
  if(naa >= MAKS_APNE) return 0;
  const ny = Math.min(MAKS_APNE, naa + 5);
  data.apne = ny;
  return ny - naa;
}

/* ============================================================
   Bygg atom
   ------------------------------------------------------------
   Hun faar navn, symbol og atomnummer, og setter sammen resten
   selv: protoner i kjernen, skall rundt, elektroner i skallene.
   Det gjoer atomnummeret til noe hun konstruerer i stedet for noe
   hun husker - og det retter seg selv, fordi to i foerste skall og
   aatte i neste er en regel og ikke en smakssak.

   NOEYTRONER ER ET SENERE TRINN, og det er med vilje: antallet kan
   ikke utledes av atomnummeret, saa hun maatte faatt det oppgitt.
   Da er det ikke lenger noe hun regner seg fram til. Tallet ligger
   klart i OPPBYGNING naar trinnet skal bygges - det er foerste
   felt.
   ============================================================ */
const KJERNE_R = 34;      /* radius paa kjernen i SVG-koordinater */
const SKALL_AVSTAND = 26; /* mellom skallene */
const MAKS_SKALL = 4;     /* saa langt trinn 1 og 2 gaar (til kalsium) */
const TREFF = 18;         /* hvor naer et skall hun maa slippe */

let bygg = null;
let valgtBrikke = null;   /* brikka hun har trykket paa, i trykk-modus */

function nyttBygg(nr){
  bygg = { nr:nr, protoner:0, skall:[], historikk:[], merker:null, forsok:0, lost:false };
  valgtBrikke = null;
  tegnBygg();
  $('byggSvar').textContent = '';
  $('byggSvar').classList.remove('gs-klart');
}

function byggDette(){
  if(!OPPBYGNING[valgtNr]){
    si('Dette stoffet kan ikke bygges ennå. Prøv et av de tjue første.');
    return;
  }
  visFane('bygg');
  nyttBygg(valgtNr);
}

function nyttByggeStoff(){
  const mulige = apneStoffer().filter(function(s){
    return OPPBYGNING[s[0]] && (!bygg || s[0] !== bygg.nr);
  });
  const s = mulige[Math.floor(Math.random() * mulige.length)];
  nyttBygg(s[0]);
}

/* ---- Tegningen ---- */
function skallRadius(i){ return KJERNE_R + (i + 1) * SKALL_AVSTAND; }

/* Protonene ligger i ringer inne i kjernen: én i midten, seks rundt,
   tolv utenfor der igjen. Da ser tjue protoner ut som en klump og ikke
   som en stabel. */
function kjernePlasser(n){
  const ringer = [[0, 1], [11, 6], [21, 12], [28, 18]];
  const ut = [];
  let igjen = n, ring = 0;
  while(igjen > 0 && ring < ringer.length){
    const r = ringer[ring][0], plass = Math.min(igjen, ringer[ring][1]);
    for(let i = 0; i < plass; i++){
      const v = plass === 1 ? 0 : (i / plass) * Math.PI * 2 - Math.PI / 2;
      ut.push([150 + Math.cos(v) * r, 150 + Math.sin(v) * r]);
    }
    igjen -= plass; ring++;
  }
  return ut;
}

function tegnBygg(){
  const plate = $('plate');
  const NS = 'http://www.w3.org/2000/svg';
  const s = stoffAv(bygg.nr);

  plate.textContent = '';
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', '0 0 300 300');
  svg.setAttribute('role', 'img');
  svg.setAttribute('aria-label', 'Byggeplate for ' + s[2] + ': ' + bygg.protoner
    + ' protoner i kjernen, ' + bygg.skall.length + ' skall med '
    + (bygg.skall.join(', ') || 'ingen elektroner'));

  bygg.skall.forEach(function(antall, i){
    const r = skallRadius(i);
    const ring = document.createElementNS(NS, 'circle');
    let klasse = 'gs-skall';
    if(bygg.merker) klasse += bygg.merker[i] ? ' gs-riktig-skall' : ' gs-feil';
    ring.setAttribute('class', klasse);
    ring.setAttribute('cx', 150); ring.setAttribute('cy', 150);
    ring.setAttribute('r', r);
    svg.appendChild(ring);

    for(let e = 0; e < antall; e++){
      const v = (e / Math.max(antall, 1)) * Math.PI * 2 - Math.PI / 2 + i * 0.4;
      const p = document.createElementNS(NS, 'circle');
      p.setAttribute('class', 'gs-elektron');
      p.setAttribute('cx', (150 + Math.cos(v) * r).toFixed(1));
      p.setAttribute('cy', (150 + Math.sin(v) * r).toFixed(1));
      p.setAttribute('r', 5.5);
      svg.appendChild(p);
    }
  });

  /* Kjerneflata tegnes alltid, ogsaa naar den er tom: hun skal se hvor
     protonene skal, ikke gjette hvor midten er. */
  const flate = document.createElementNS(NS, 'circle');
  flate.setAttribute('cx', 150); flate.setAttribute('cy', 150);
  flate.setAttribute('r', KJERNE_R);
  flate.setAttribute('fill', 'rgba(166,77,60,.10)');
  flate.setAttribute('stroke', 'var(--messing)');
  flate.setAttribute('stroke-width', '1.2');
  flate.setAttribute('stroke-dasharray', bygg.protoner ? 'none' : '4 4');
  svg.appendChild(flate);

  kjernePlasser(bygg.protoner).forEach(function(p){
    const k = document.createElementNS(NS, 'circle');
    k.setAttribute('class', 'gs-kjerne');
    k.setAttribute('cx', p[0].toFixed(1)); k.setAttribute('cy', p[1].toFixed(1));
    k.setAttribute('r', 5.5);
    svg.appendChild(k);
  });

  plate.appendChild(svg);
  tegnMagasin();
}

function tegnMagasin(){
  const s = stoffAv(bygg.nr);
  const elektroner = bygg.skall.reduce(function(n, x){ return n + x; }, 0);

  $('byggOppgave').innerHTML =
    '<div class="gs-stor-rute gs-' + s[5] + '">'
  + '<span class="gs-stor-nr">' + s[0] + '</span>'
  + '<span class="gs-stor-sym">' + s[1] + '</span>'
  + '<span class="gs-stor-navn">' + s[2] + '</span></div>'
  + '<div class="gs-oppgave-tekst">Bygg <b>' + s[2] + '</b>.<br>'
  + 'Atomnummer <b>' + s[0] + '</b> – symbol <b>' + s[1] + '</b>.</div>';

  const igjen = { proton: bygg.nr - bygg.protoner, elektron: bygg.nr - elektroner };
  const brikker = [
    { type:'proton',  navn:'Proton',  igjen:igjen.proton },
    { type:'elektron',navn:'Elektron',igjen:igjen.elektron },
    { type:'skall',   navn:'Nytt skall', igjen:MAKS_SKALL - bygg.skall.length }
  ];

  const m = $('magasin');
  m.textContent = '';
  brikker.forEach(function(b){
    const knapp = document.createElement('button');
    knapp.type = 'button';
    knapp.className = 'gs-brikke' + (valgtBrikke === b.type ? ' gs-valgt' : '');
    knapp.disabled = b.igjen <= 0;
    knapp.dataset.type = b.type;
    knapp.innerHTML = '<span class="gs-kule gs-k-' + b.type + '"></span>' + b.navn
      + (b.type === 'skall' ? '' : ' <span class="gs-bygg-tall">' + b.igjen + ' igjen</span>');
    bindBrikke(knapp, b.type);
    m.appendChild(knapp);
  });

  $('byggTall').textContent = 'I kjernen: ' + bygg.protoner + ' protoner · '
    + 'I skallene: ' + (bygg.skall.join(', ') || 'ingen');
}

/* ---- Draing og trykk ----
   Én funksjon plasserer, og begge veier ender i den. Draget er bygget
   paa pointer-hendelser, ikke HTML5 drag-and-drop: den siste finnes
   ikke paa iOS. */
function bindBrikke(knapp, type){
  let flyt = null, flyttet = false, start = null;

  knapp.addEventListener('pointerdown', function(e){
    if(knapp.disabled) return;
    start = { x:e.clientX, y:e.clientY };
    flyttet = false;
    knapp.setPointerCapture(e.pointerId);
  });

  knapp.addEventListener('pointermove', function(e){
    if(!start) return;
    if(!flyttet && Math.abs(e.clientX - start.x) + Math.abs(e.clientY - start.y) < 8) return;
    flyttet = true;
    if(!flyt){
      flyt = knapp.cloneNode(true);
      flyt.className = 'gs-brikke gs-flyt';
      document.body.appendChild(flyt);
      $('plate').classList.add('gs-slipp');
    }
    flyt.style.left = e.clientX + 'px';
    flyt.style.top = e.clientY + 'px';
  });

  knapp.addEventListener('pointerup', function(e){
    if(!start) return;
    const overPlata = flyttet && innenforPlata(e.clientX, e.clientY);
    if(flyt){ flyt.remove(); flyt = null; }
    $('plate').classList.remove('gs-slipp');
    start = null;

    if(overPlata){ plasser(type, e.clientX, e.clientY); return; }
    if(!flyttet){
      /* Trykk-modus: brikka blir staaende valgt til hun trykker paa
         plata. Trykk paa den igjen legger den fra seg. */
      valgtBrikke = (valgtBrikke === type) ? null : type;
      tegnMagasin();
    }
  });

  knapp.addEventListener('pointercancel', function(){
    if(flyt){ flyt.remove(); flyt = null; }
    $('plate').classList.remove('gs-slipp');
    start = null;
  });
}

function innenforPlata(x, y){
  const r = $('plate').getBoundingClientRect();
  return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
}

$('plate').addEventListener('click', function(e){
  if(!valgtBrikke) return;
  plasser(valgtBrikke, e.clientX, e.clientY);
});

function plasser(type, x, y){
  const r = $('plate').getBoundingClientRect();
  /* Plata er kvadratisk i SVG-koordinater (300x300), saa begge aksene
     regnes mot bredden. */
  const px = (x - r.left) / r.width * 300;
  const py = (y - r.top) / r.width * 300;
  const avstand = Math.sqrt(Math.pow(px - 150, 2) + Math.pow(py - 150, 2));

  /* En ny plassering betyr at forrige retting ikke gjelder lenger. */
  bygg.merker = null;
  $('byggSvar').textContent = '';

  if(type === 'skall'){
    if(bygg.skall.length >= MAKS_SKALL){ si('Fire skall er nok til disse stoffene.'); return; }
    bygg.skall.push(0);
    bygg.historikk.push({ hva:'skall' });
    ferdigPlassert();
    return;
  }

  if(type === 'proton'){
    if(bygg.protoner >= bygg.nr){ si('Du har lagt ut alle protonene.'); return; }
    if(avstand > KJERNE_R + 12){ si('Protoner hører hjemme i kjernen, midt på.'); return; }
    bygg.protoner++;
    bygg.historikk.push({ hva:'proton' });
    ferdigPlassert();
    return;
  }

  /* Elektron: naermeste skall, og bare hvis hun traff det. */
  const brukt = bygg.skall.reduce(function(n, x){ return n + x; }, 0);
  if(brukt >= bygg.nr){ si('Du har lagt ut alle elektronene.'); return; }
  if(!bygg.skall.length){ si('Legg ut et skall først – elektronene går i bane.'); return; }

  let naermest = -1, best = 1e9;
  bygg.skall.forEach(function(_, i){
    const d = Math.abs(avstand - skallRadius(i));
    if(d < best){ best = d; naermest = i; }
  });
  if(best > TREFF){ si('Slipp elektronet på en av ringene.'); return; }

  bygg.skall[naermest]++;
  bygg.historikk.push({ hva:'elektron', skall:naermest });
  ferdigPlassert();
}

function ferdigPlassert(){
  /* Brikka blir staaende valgt: legger hun ut aatte elektroner, skal hun
     ikke trykke paa magasinet mellom hver. */
  tegnBygg();
}

function angreBygg(){
  const siste = bygg.historikk.pop();
  if(!siste){ si('Det er ingenting å angre.'); return; }
  if(siste.hva === 'proton') bygg.protoner--;
  if(siste.hva === 'elektron') bygg.skall[siste.skall]--;
  if(siste.hva === 'skall'){
    /* Et skall med elektroner i kan ikke bare forsvinne - elektronene
       legges tilbake i magasinet sammen med det. */
    bygg.skall.pop();
  }
  bygg.merker = null;
  $('byggSvar').textContent = '';
  tegnBygg();
}

function tomBygg(){ nyttBygg(bygg.nr); }

async function sjekkBygg(){
  const s = stoffAv(bygg.nr);
  const fasit = OPPBYGNING[bygg.nr][1];
  const elektroner = bygg.skall.reduce(function(n, x){ return n + x; }, 0);
  const feil = [];

  if(bygg.protoner !== bygg.nr){
    feil.push('Kjernen har ' + bygg.protoner + ' protoner. Atomnummeret til '
            + s[2] + ' er ' + bygg.nr + ', og det er nettopp antall protoner.');
  }
  if(elektroner !== bygg.nr){
    feil.push('Du har lagt ut ' + elektroner + ' elektroner. Et nøytralt atom har '
            + 'like mange elektroner som protoner: ' + bygg.nr + '.');
  }
  if(bygg.skall.length !== fasit.length){
    feil.push('Du har ' + bygg.skall.length + ' skall. ' + s[2] + ' har '
            + fasit.length + '.');
  }
  bygg.skall.forEach(function(antall, i){
    if(fasit[i] === undefined){
      feil.push('Skall ' + (i + 1) + ' skal ikke være der.');
    }else if(antall !== fasit[i]){
      feil.push('Skall ' + (i + 1) + ' har ' + antall + ' elektroner. Det skal ha '
              + fasit[i] + '.');
    }
  });

  bygg.merker = bygg.skall.map(function(antall, i){ return fasit[i] === antall; });
  bygg.forsok++;
  tegnBygg();

  const svar = $('byggSvar');
  svar.textContent = '';
  if(feil.length){
    svar.classList.remove('gs-klart');
    const p = document.createElement('p');
    p.textContent = 'Ikke helt ennå:';
    const ul = document.createElement('ul');
    feil.forEach(function(t){
      const li = document.createElement('li');
      li.textContent = t;
      ul.appendChild(li);
    });
    svar.appendChild(p); svar.appendChild(ul);
    return;
  }

  svar.classList.add('gs-klart');
  svar.textContent = 'Riktig. Slik ser ' + s[2] + ' ut: ' + bygg.nr + ' protoner i kjernen '
    + 'og ' + fasit.join(' + ') + ' elektroner utover.';

  if(!bygg.lost){
    bygg.lost = true;
    data.runder.push({ id:Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
                       tid:Date.now(), type:'bygg', stoff:bygg.nr, forsok:bygg.forsok });
    tegnFramdrift();
    await lagre();
  }
}

/* ============================================================
   Framdrift
   ============================================================ */
function tegnFramdrift(){
  const runder = data.runder || [];
  /* Byggerundene teller ikke som spoersmaal - de har ingen andel riktige,
     de er enten ferdige eller ikke. De staar for seg i tallene under. */
  const tester = runder.filter(function(r){ return r.type !== 'bygg'; });
  const bygde = runder.filter(function(r){ return r.type === 'bygg'; });
  const ulikeBygde = {};
  bygde.forEach(function(r){ ulikeBygde[r.stoff] = true; });

  const spurt = tester.reduce(function(n, r){ return n + (r.antall || 0); }, 0);
  const rette = tester.reduce(function(n, r){ return n + (r.riktige || 0); }, 0);
  const beste = tester.reduce(function(b, r){
    const a = r.antall ? r.riktige / r.antall : 0;
    return a > b ? a : b;
  }, 0);

  const tall = $('framTall');
  tall.textContent = '';
  [['Stoffer tent', apne() + ' av 118'],
   ['Runder spilt', String(tester.length)],
   ['Spørsmål', String(spurt)],
   ['Riktige', spurt ? Math.round(rette / spurt * 100) + ' %' : '–'],
   ['Beste runde', tester.length ? Math.round(beste * 100) + ' %' : '–'],
   ['Atomer bygget', String(Object.keys(ulikeBygde).length)]
  ].forEach(function(r){
    const d = document.createElement('div');
    d.innerHTML = '<dt>' + r[0] + '</dt><dd>' + r[1] + '</dd>';
    tall.appendChild(d);
  });

  $('framTekst').textContent = apne() >= MAKS_APNE
    ? 'Du har låst opp alt som hører til første trinn. Neste trinn er å bygge atomene selv.'
    : 'Ta en runde på ' + MIN_FOR_LAAS + ' spørsmål og få minst 90 % riktig, så låses fem nye stoffer opp.';

  const liste = $('framRunder');
  liste.textContent = '';
  const siste = runder.slice(-10).reverse();
  if(!siste.length){
    const p = document.createElement('p');
    p.className = 'gs-sporsmaal-sub';
    p.textContent = 'Ingen runder ennå.';
    liste.appendChild(p);
    return;
  }
  siste.forEach(function(r){
    const d = new Date(r.tid || Date.now());
    const p = function(n){ return String(n).padStart(2, '0'); };
    const rad = document.createElement('div');
    rad.className = 'gs-fasitrad';
    const dato = '<span>' + p(d.getDate()) + '.' + p(d.getMonth() + 1) + '</span>';
    if(r.type === 'bygg'){
      const s = stoffAv(r.stoff);
      rad.innerHTML = dato + '<span>Bygde ' + (s ? s[2] : 'et atom')
        + (r.forsok > 1 ? ' – ' + r.forsok + ' forsøk' : ' – på første forsøk') + '</span>';
    }else{
      rad.innerHTML = dato
        + '<span>' + (r.riktige || 0) + ' av ' + (r.antall || 0) + ' riktig – '
        + (r.sider || []).map(function(id){
            const s = SIDER.filter(function(x){ return x.id === id; })[0];
            return s ? s.navn.toLowerCase() : id;
          }).join(', ') + '</span>';
    }
    liste.appendChild(rad);
  });
}

/* ============================================================
   Fanene, pilla og oppstart
   ============================================================ */
function visFane(navn){
  [['tabell','visTabell','faneTabell'],
   ['bygg','visBygg','faneBygg'],
   ['test','visTest','faneTest'],
   ['fram','visFram','faneFram']].forEach(function(f){
    const pa = f[0] === navn;
    $(f[1]).classList.toggle('gs-skjult', !pa);
    $(f[2]).classList.toggle('gs-valgt', pa);
  });
  if(navn === 'test'){
    /* Tilbake til oppsettet hver gang fanen aapnes: en halvferdig runde
       man kommer tilbake til uten aa vite hvor man var, er verre enn en
       ny. */
    $('testOppsett').classList.remove('gs-skjult');
    $('testSpill').classList.add('gs-skjult');
    $('testResultat').classList.add('gs-skjult');
    tegnValg();
  }
  if(navn === 'bygg' && !bygg) nyttByggeStoff();
  if(navn === 'fram') tegnFramdrift();
  window.scrollTo({ top:0, behavior:'smooth' });
}

let pilleTid = null;
function si(tekst){
  const p = $('pille');
  p.textContent = tekst;
  p.hidden = false;
  clearTimeout(pilleTid);
  pilleTid = setTimeout(function(){ p.hidden = true; }, 2600);
}

function tegnAlt(){
  tegnTabell();
  tegnLab();
  tegnValg();
  tegnFramdrift();
}

tegnAlt();
last();
</script>
