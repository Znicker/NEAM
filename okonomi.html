<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Økonomi – Neam</title>
<link rel="apple-touch-icon" href="/bilder/neam-hjemskjerm.png?v=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/felles-rot.css?v=6">
<link rel="stylesheet" href="/felles-knapper.css?v=1">
<style>
/* ============================================================
   NEAM - oekonomi
   Laget 28. oktober 2026. Foerste byggesteg av planen «Neam Oekonomi
   – plan» og skissen «Neam Oekonomi» (artifacts, se minnet).

   SKJULT MED VILJE. Sida lenkes ikke fra noe sted, staar ikke i
   fireren og ikke i HUS_VERKTOY. Man naar den bare ved aa skrive
   adressen. Sperra som teller, ligger i /api/bank: den svarer bare
   sys@ inntil videre (Magne, 28. oktober). Sida selv viser bare det
   funksjonen gir den.

   HVA DEN GJOER NAA: viser kontoene fra DNB og lar hver konto faa en
   rolle (felles, Magne, Nina, sparing, Emma, Andrea, ikke i bruk).
   Rollen avgjoer senere hvor transaksjonene havner.

   UTTRYKK: minimalistisk, uten steampunk-bakgrunnen - slik planen og
   skissen sier. Ikke avgjort for resten av huset.

   KLASSENAVN ER PREFIKSET `ok-`. Sida laster felles-rot.css og
   felles-knapper.css, og vanlige ord er alt tatt (kartleggingen del 26).
   ============================================================ */

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
/* `hidden` maa vinne over .ok-kort{display:flex}, ellers vises skjulte kort. */
[hidden]{ display:none !important; }
body{
  margin:0; color:var(--ink); background:var(--bg-1);
  font-family:'Archivo', system-ui, sans-serif; font-size:var(--t-brod); line-height:1.45;
  font-variant-numeric:tabular-nums;
}
/* Ingen steampunk-ramme bak denne sida - verken bildet eller reserven paa html. */
html{ background:var(--bg-1); }
body::before{ display:none; }

.ok-ramme{
  max-width:760px; margin:0 auto;
  padding:max(20px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 48px max(16px, env(safe-area-inset-left, 0px));
  display:flex; flex-direction:column; gap:18px;
}
.ok-topp{ display:flex; align-items:baseline; justify-content:space-between; gap:8px 16px; flex-wrap:wrap; }
.ok-topp h1{ margin:0; font-size:var(--t-stor); font-weight:700; }
.ok-etikett{ font-size:var(--t-etikett); font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft); }
.ok-meta{ font-size:var(--t-meta); color:var(--ink-soft); margin:0; }

.ok-kort{ background:var(--paper); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px 20px; display:flex; flex-direction:column; gap:12px; }
.ok-kort h2{ margin:0; font-size:var(--t-brod); font-weight:700; }
.ok-kort-hode{ display:flex; justify-content:space-between; align-items:baseline; gap:8px 12px; flex-wrap:wrap; }

.ok-melding{ background:var(--boks-mild); border:1px solid var(--boks-kant); border-radius:12px; padding:12px 14px; font-size:var(--t-meta); }
.ok-melding.feil{ color:var(--danger); }

/* ---------- Kontoene, gruppert etter rolle ---------- */
.ok-gruppe{ display:flex; flex-direction:column; }
.ok-gruppe + .ok-gruppe{ margin-top:10px; }
.ok-gruppe-hode{
  display:flex; justify-content:space-between; gap:12px; padding:8px 0 6px;
  border-bottom:2px solid var(--ink);
}
.ok-gruppe-hode b{ white-space:nowrap; }
.ok-konto{
  display:grid; grid-template-columns:minmax(0,1fr) auto 190px; gap:6px 14px; align-items:center;
  padding:10px 0; border-bottom:1px solid var(--line);
}
.ok-konto:last-child{ border-bottom:0; }
.ok-navn{ font-weight:600; overflow-wrap:anywhere; }
.ok-saldo{ font-weight:700; text-align:right; white-space:nowrap; }
@media (max-width:560px){
  .ok-konto{ grid-template-columns:minmax(0,1fr) auto; }
  .ok-konto select{ grid-column:1 / -1; }
}
/* Skjemafelt staar utenfor skalaen: iOS zoomer under 16px (designsystemet, Typeskala). */
.ok-konto select{
  width:100%; font-family:inherit; font-size:16px; padding:7px 10px;
  border:1.5px solid var(--line); border-radius:8px; background:#fff; color:var(--ink);
}
.ok-konto select:focus{ outline:none; border-color:var(--aksent); }
.ok-konto.lagrer select{ opacity:.6; }

/* ---------- Innboksen ----------
   Samme oppbygning som innboksen i skissen: poster med forslag teller med
   i godkjenningen, poster uten kategori blir liggende. Stroeket post staar
   dus igjen, som i handlelistas importtabell. */
.ok-post{
  display:grid; grid-template-columns:minmax(0,1fr) 240px 120px 36px;
  grid-template-areas:"hva kat belop ut" "mer mer mer mer";
  gap:4px 14px; align-items:center; padding:12px 0; border-bottom:1px solid var(--line);
}
.ok-post:last-child{ border-bottom:0; }
@media (max-width:640px){
  .ok-post{ grid-template-columns:minmax(0,1fr) auto 36px; grid-template-areas:"hva belop ut" "kat kat kat" "mer mer mer"; }
}
.ok-post-hva{ grid-area:hva; min-width:0; }
.ok-post-kat{ grid-area:kat; min-width:0; }
.ok-post-belop{ grid-area:belop; text-align:right; font-weight:700; white-space:nowrap; }
.ok-post-mer{ grid-area:mer; }
.ok-post select{
  width:100%; font-family:inherit; font-size:16px; padding:7px 10px;
  border:1.5px solid var(--line); border-radius:8px; background:#fff; color:var(--ink);
}
.ok-post select:focus{ outline:none; border-color:var(--aksent); }
.ok-post.mangler select{ border-color:var(--handling-endre); }
.ok-ut{
  grid-area:ut; border:0; background:none; color:var(--ink-soft); font:inherit; font-size:22px; line-height:1;
  width:36px; height:36px; border-radius:8px; cursor:pointer;
}
.ok-post.ute > :not(.ok-ut){ opacity:.38; }
.ok-post.ute .ok-navn, .ok-post.ute .ok-post-belop{ text-decoration:line-through; }
.ok-post.ute .ok-ut{ color:var(--aksent); }
.ok-kilde{ font-size:var(--t-etikett); font-weight:700; letter-spacing:.04em; color:var(--aksent); }
.ok-kilde.mangler{ color:var(--handling-endre); }
.ok-post-mer{ display:flex; flex-direction:column; gap:6px; align-items:flex-start; }
.ok-post-mer .ok-linjer{ align-self:stretch; }
.ok-vare{ display:grid; grid-template-columns:minmax(0,1fr) auto 200px; gap:4px 12px; align-items:center; padding:4px 0; }
.ok-vare + .ok-vare{ border-top:1px solid var(--boks-kant); }
.ok-vare b{ white-space:nowrap; text-align:right; }
.ok-vare select{
  width:100%; font-family:inherit; font-size:16px; padding:4px 8px;
  border:1.5px solid var(--line); border-radius:8px; background:#fff; color:var(--ink);
}
@media (max-width:560px){ .ok-vare{ grid-template-columns:minmax(0,1fr) auto; } .ok-vare select{ grid-column:1 / -1; } }
.ok-bunn{
  position:sticky; bottom:max(12px, env(safe-area-inset-bottom, 0px)); z-index:5;
  background:var(--paper); border-radius:var(--radius); box-shadow:var(--shadow), 0 0 0 1px var(--line);
  padding:12px 14px; display:flex; justify-content:space-between; align-items:center; gap:12px;
}
.ok-bunn .btn{ flex:none; }
/* Paa telefon faar knappen egen linje, ellers presser den siden bredere enn skjermen. */
@media (max-width:520px){
  .ok-bunn{ flex-wrap:wrap; }
  .ok-bunn .btn{ flex:1 1 100%; }
  .ok-sum{ font-size:var(--t-brod); }
}
.ok-sum{ font-size:var(--t-stor); font-weight:700; }
.ok-stripe{ background:var(--aksent-lys); border-radius:12px; padding:8px 8px 8px 14px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
/* ---------- Trumf ---------- */
.ok-steg{ margin:0; padding-left:20px; font-size:var(--t-meta); color:var(--ink-soft); display:flex; flex-direction:column; gap:4px; }
.ok-felt{
  width:100%; min-height:90px; font-family:ui-monospace, monospace; font-size:16px; padding:8px 10px;
  border:1.5px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); resize:vertical;
}
.ok-felt:focus{ outline:none; border-color:var(--aksent); }
.ok-rad-knapper{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.ok-rad-knapper .btn{ padding:10px 16px; font-size:var(--t-meta); }
.ok-lenke{ font:inherit; font-size:var(--t-meta); font-weight:700; color:var(--aksent); background:none; border:0; padding:4px 0; cursor:pointer; }
.ok-lenke.fare{ color:var(--danger); }
.ok-kjop{ display:grid; grid-template-columns:70px minmax(0,1fr) auto; gap:2px 12px; align-items:baseline; padding:9px 0; border-bottom:1px solid var(--line); }
.ok-kjop:last-child{ border-bottom:0; }
.ok-kjop .ok-lenke{ grid-column:2 / -1; justify-self:start; padding:0; }
.ok-linjer{ grid-column:1 / -1; background:var(--boks-mild); border-radius:10px; padding:8px 12px; margin-top:6px; display:flex; flex-direction:column; gap:3px; font-size:var(--t-meta); }
.ok-linje{ display:flex; justify-content:space-between; gap:12px; }
.ok-linje b{ white-space:nowrap; }

.ok-stripe p{ flex:1 1 220px; margin:0; font-size:var(--t-meta); }
/* .btn-ghost er full bredde i fellesfila; i stripa skal den staa ved teksten. */
.ok-stripe .btn{ width:auto; padding:8px 14px; font-size:var(--t-meta); }
.ok-lagret{ font-size:var(--t-meta); color:var(--ink-soft); min-height:1.2em; }
</style>
</head>
<body>
<div class="ok-ramme">
  <header class="ok-topp">
    <h1>Økonomi</h1>
    <span class="ok-etikett">Under arbeid · skjult side</span>
  </header>

  <section class="ok-kort" id="ok-status-kort">
    <div class="ok-kort-hode"><h2>Bankkobling</h2><span class="ok-meta" id="ok-status-meta"></span></div>
    <div id="ok-status"><p class="ok-meta">Henter …</p></div>
  </section>

  <section class="ok-kort" id="ok-innboks-kort" hidden>
    <div class="ok-kort-hode"><h2>Innboks</h2><span class="ok-meta" id="ok-innboks-meta"></span></div>
    <div class="ok-stripe" id="ok-stripe" hidden>
      <p id="ok-stripe-tekst"></p>
      <button type="button" class="btn btn-ghost" id="ok-angre">Angre</button>
      <button type="button" class="ok-ut" id="ok-stripe-lukk" aria-label="Lukk stripa">×</button>
    </div>
    <div id="ok-innboks"></div>
    <div class="ok-bunn" id="ok-bunn" hidden>
      <div><div class="ok-sum" id="ok-sum"></div><p class="ok-meta" id="ok-venter"></p></div>
      <button type="button" class="btn btn-ny" id="ok-godkjenn"></button>
    </div>
  </section>

  <section class="ok-kort" id="ok-trumf-kort">
    <div class="ok-kort-hode"><h2>Trumf</h2><span class="ok-meta" id="ok-trumf-meta"></span></div>
    <div id="ok-trumf"><p class="ok-meta">Henter …</p></div>
  </section>

  <section class="ok-kort" id="ok-kontoer-kort" hidden>
    <div class="ok-kort-hode"><h2>Kontoer</h2><span class="ok-meta" id="ok-hentet"></span></div>
    <p class="ok-meta">Rollen avgjør hvor transaksjonene havner: felles i husholdningsbudsjettet, Magne og Nina på hver sin side, Emma og Andrea på barnas sider, sparing i formuen. «Ikke i bruk» tas ikke med.</p>
    <div id="ok-kontoer"></div>
    <p class="ok-lagret" id="ok-lagret" aria-live="polite"></p>
  </section>
</div>

<script>
(function(){
  'use strict';

  /* Samme liste som ROLLER i functions/api/bank/[[sti]].js, i samme rekkefoelge. */
  var OK_ROLLER = [
    ['felles', 'Felles'], ['magne', 'Magne'], ['nina', 'Nina'], ['sparing', 'Sparing'],
    ['emma', 'Emma'], ['andrea', 'Andrea'], ['ignorer', 'Ikke i bruk']
  ];
  var okKr = new Intl.NumberFormat('nb-NO', { minimumFractionDigits:2, maximumFractionDigits:2 });
  var okDato = new Intl.DateTimeFormat('nb-NO', { day:'numeric', month:'long', year:'numeric' });
  var okKlokke = new Intl.DateTimeFormat('nb-NO', { hour:'2-digit', minute:'2-digit' });
  var okKontoer = [];

  function okVask(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]; }); }
  function okEl(tag, cls, html){ var e = document.createElement(tag); if(cls) e.className = cls; if(html != null) e.innerHTML = html; return e; }
  function okRolleNavn(r){ for(var i = 0; i < OK_ROLLER.length; i++) if(OK_ROLLER[i][0] === r) return OK_ROLLER[i][1]; return 'Uten rolle'; }

  /* Funksjonen svarer alltid 200 med {ok}; feil har {feil}. */
  function okHent(sti, valg){
    return fetch(sti, Object.assign({ credentials:'same-origin', cache:'no-store' }, valg || {}))
      .then(function(r){ return r.json(); })
      .catch(function(){ return { ok:false, feil:'Fikk ikke kontakt med Neam' }; });
  }

  function okVisStatus(s){
    var boks = document.getElementById('ok-status'), meta = document.getElementById('ok-status-meta');
    boks.innerHTML = '';
    if(!s.ok){ boks.appendChild(okEl('p', 'ok-melding feil', okVask(s.feil))); return false; }
    if(!s.koblet){
      boks.appendChild(okEl('p', 'ok-meta', 'Banken er ikke koblet. Du logger inn med BankID hos DNB og velger hvilke kontoer Neam får lese.'));
      var a = okEl('a', 'btn btn-ny', 'Koble til DNB');
      a.href = '/api/bank/start';
      a.style.alignSelf = 'flex-start'; a.style.textDecoration = 'none';
      boks.appendChild(a);
      return false;
    }
    var til = s.gyldigTil ? okDato.format(new Date(s.gyldigTil)) : 'ukjent dato';
    meta.textContent = s.bank + ' · ' + s.kontoer + ' kontoer';
    boks.appendChild(okEl('p', 'ok-meta', 'Samtykket varer til ' + okVask(til) + (s.dagerIgjen != null ? ' (' + s.dagerIgjen + ' dager igjen)' : '') + '.'));
    /* To uker foer det gaar ut, kommer lenken for aa fornye. */
    if(s.dagerIgjen != null && s.dagerIgjen <= 14){
      var f = okEl('a', 'btn btn-endre', 'Forny samtykket');
      f.href = '/api/bank/start'; f.style.alignSelf = 'flex-start'; f.style.textDecoration = 'none';
      boks.appendChild(f);
    }
    return true;
  }

  function okTegnKontoer(){
    var boks = document.getElementById('ok-kontoer');
    boks.innerHTML = '';
    /* Uten rolle foerst - det er dem som trenger noe. Deretter i rollens rekkefoelge. */
    var grupper = [''].concat(OK_ROLLER.map(function(r){ return r[0]; }));
    grupper.forEach(function(rolle){
      var liste = okKontoer.filter(function(k){ return (k.rolle || '') === rolle; });
      if(!liste.length) return;
      var sum = liste.reduce(function(s, k){ return s + (typeof k.saldo === 'number' ? k.saldo : 0); }, 0);
      var g = okEl('div', 'ok-gruppe');
      g.appendChild(okEl('div', 'ok-gruppe-hode',
        '<span class="ok-etikett">' + okVask(okRolleNavn(rolle)) + ' · ' + liste.length + '</span>'
        + (rolle === 'ignorer' ? '' : '<b>' + okKr.format(sum) + ' kr</b>')));
      liste.forEach(function(k){ g.appendChild(okKontoRad(k)); });
      boks.appendChild(g);
    });
  }

  function okKontoRad(k){
    var rad = okEl('div', 'ok-konto');
    var id = 'ok-rolle-' + k.uid;
    rad.appendChild(okEl('div', '',
      '<div class="ok-navn">' + okVask(k.navn || 'Uten navn') + '</div>'
      + '<p class="ok-meta">' + (k.slutt ? '•••• ' + okVask(k.slutt) : '') + (k.produkt && k.produkt !== k.navn ? ' · ' + okVask(k.produkt) : '')
      + (k.feil ? ' · saldo mangler' : '') + '</p>'));
    rad.appendChild(okEl('div', 'ok-saldo', typeof k.saldo === 'number' ? okKr.format(k.saldo) + ' kr' : '–'));
    var s = document.createElement('select');
    s.id = id;
    s.setAttribute('aria-label', 'Rolle for ' + (k.navn || 'kontoen'));
    s.appendChild(new Option('Velg rolle', ''));
    OK_ROLLER.forEach(function(r){ s.appendChild(new Option(r[1], r[0])); });
    s.value = k.rolle || '';
    /* Et valg i nedtrekk koster ingenting aa gjoere om, saa det lagres med
       en gang uten aa spoerre (designsystemet, Avbryt-regelen). */
    s.addEventListener('change', function(){
      var ny = s.value, gammel = k.rolle || '';
      rad.classList.add('lagrer');
      var roller = {}; roller[k.uid] = ny;
      okHent('/api/bank', { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify({ hva:'roller', roller:roller }) })
        .then(function(svar){
          var melding = document.getElementById('ok-lagret');
          if(!svar.ok){
            s.value = gammel; rad.classList.remove('lagrer');
            melding.textContent = 'Ble ikke lagret: ' + svar.feil;
            return;
          }
          k.rolle = ny;
          melding.textContent = (k.navn || 'Kontoen') + ' er lagret som ' + okRolleNavn(ny).toLowerCase() + '.';
          okTegnKontoer();
          var f = document.getElementById(id); if(f) f.focus();
          /* Felles-rollen avgjoer hva innboksen henter fra. */
          if(ny === 'felles' || gammel === 'felles') okLastInnboks();
        });
    });
    rad.appendChild(s);
    return rad;
  }

  /* ---------- Innboksen ---------- */
  var okPoster = [], okKategorier = [], okAngre = null;
  var okKr0 = new Intl.NumberFormat('nb-NO', { minimumFractionDigits:2, maximumFractionDigits:2 });
  var okKort = new Intl.DateTimeFormat('nb-NO', { day:'numeric', month:'short' });

  function okPostKlar(p){ return !p.ute && !!p.kategori; }
  /* Samme regel som motpartNokkel() i bank-funksjonen. */
  function okMotpart(p){
    var raa = (p.motpart || String(p.tekst || '').split(/\s+/).slice(0, 3).join(' ')).toUpperCase();
    return raa.replace(/[0-9*#.,:\/\\-]+/g, ' ').replace(/\s+/g, ' ').trim();
  }

  function okLastInnboks(){
    var kort = document.getElementById('ok-innboks-kort');
    kort.hidden = false;
    document.getElementById('ok-innboks').innerHTML = '<p class="ok-meta">Henter transaksjonene …</p>';
    okHent('/api/bank?hva=innboks').then(function(r){
      var boks = document.getElementById('ok-innboks');
      if(!r.ok){ boks.innerHTML = '<p class="ok-melding feil">' + okVask(r.feil) + '</p>'; document.getElementById('ok-bunn').hidden = true; return; }
      okKategorier = r.kategorier || [];
      if(!r.kontoer && !r.trumf){
        boks.innerHTML = '<p class="ok-melding">Gi minst én konto rollen «Felles» nedenfor, eller koble Trumf, så henter Neam transaksjonene derfra.</p>';
        document.getElementById('ok-innboks-meta').textContent = '';
        document.getElementById('ok-bunn').hidden = true;
        return;
      }
      /* En kvittering som kan vaere telt i banken allerede, staar stroeket
         til noen tar den med - heller én for lite enn én dobbelt. */
      okPoster = (r.poster || []).map(function(p){ p.ute = !!p.mulDobbel; p.linjeKat = {}; p.apen = false; return p; });
      document.getElementById('ok-innboks-meta').textContent = 'Fra ' + okKort.format(new Date(r.fra)) + ' · hentet kl. '
        + okKlokke.format(new Date(r.hentet)) + (r.advarsel ? ' · banken svarte ikke, viser forrige henting' : '');
      okTegnInnboks();
    });
  }

  function okTegnInnboks(){
    var boks = document.getElementById('ok-innboks');
    boks.innerHTML = '';
    if(!okPoster.length){
      boks.innerHTML = '<p class="ok-meta">Innboksen er tom. Nye transaksjoner fra felleskontoene dukker opp her.</p>';
      document.getElementById('ok-bunn').hidden = true;
      return;
    }
    okPoster.forEach(function(p){ boks.appendChild(okPostRad(p)); });
    okTegnBunn();
  }

  /* Nedtrekk med kategoriene, gruppert etter det som staar foran «·», som budsjettet. */
  function okKatVelg(id, verdi, tomTekst, etikett){
    var s = document.createElement('select');
    s.id = id;
    s.setAttribute('aria-label', etikett);
    if(tomTekst != null) s.appendChild(new Option(tomTekst, ''));
    var grupper = {};
    okKategorier.forEach(function(k){
      var g = k.split(' · ')[0];
      if(!grupper[g]){ grupper[g] = document.createElement('optgroup'); grupper[g].label = g; s.appendChild(grupper[g]); }
      grupper[g].appendChild(new Option(k.split(' · ')[1] || k, k));
    });
    s.value = verdi || '';
    return s;
  }

  function okPostRad(p){
    var rad = okEl('div', 'ok-post' + (p.ute ? ' ute' : '') + (!p.kategori && !p.ute ? ' mangler' : ''));
    var hva = p.motpart || p.tekst || 'Uten tekst';
    var kontoTekst = p.fra === 'trumf'
      ? 'Trumf-kvittering' + (p.bankId ? ' · betalt fra ' + (p.bankKonto || 'banken') + ', slått sammen med banktrekket' : '')
      : (p.kontoNavn || '');
    rad.appendChild(okEl('div', 'ok-post-hva',
      '<div class="ok-navn">' + okVask(hva) + '</div>'
      + '<p class="ok-meta">' + okVask(okKort.format(new Date(p.dato))) + ' · ' + okVask(kontoTekst)
      + (p.motpart && p.tekst && p.tekst !== p.motpart ? ' · ' + okVask(p.tekst) : '') + '</p>'));

    var kat = okEl('div', 'ok-post-kat');
    var s = okKatVelg('ok-kat-' + p.id, p.kategori, p.kategori ? null : 'Velg kategori', 'Kategori for ' + hva);
    s.disabled = p.ute;
    s.addEventListener('change', function(){
      p.kategori = s.value; p.kilde = 'valgt';
      /* Samme motpart lenger ned uten kategori faar samme forslag med en gang -
         to turer til Circle K skal ikke kreve to valg. */
      var n = okMotpart(p);
      okPoster.forEach(function(q){ if(q !== p && !q.kategori && !q.ute && n && okMotpart(q) === n){ q.kategori = p.kategori; q.kilde = 'laert'; } });
      okTegnInnboks();
      var f = document.getElementById(s.id); if(f) f.focus();
    });
    kat.appendChild(s);
    rad.appendChild(kat);

    rad.appendChild(okEl('div', 'ok-post-belop', (p.belop > 0 ? '+' : '') + okKr0.format(p.belop)));

    var ut = okEl('button', 'ok-ut', '×');
    ut.type = 'button';
    ut.setAttribute('aria-label', p.ute ? 'Ta med ' + hva + ' igjen' : 'Stryk ' + hva);
    ut.title = p.ute ? 'Ta med igjen' : 'Stryk – føres ikke';
    ut.addEventListener('click', function(){ p.ute = !p.ute; okTegnInnboks(); });
    rad.appendChild(ut);

    var mer = okEl('div', 'ok-post-mer');
    var kilde = p.mulDobbel ? 'Mulig dobbel: et banktrekk med samme beløp fra ' + (p.bankKonto || 'banken') + ' er alt godkjent. Strøket til du tar den med.'
      : p.ute ? 'Føres ikke'
      : !p.kategori ? 'Trenger kategori – blir liggende til den har en'
      : p.kilde === 'laert' ? 'Forslag: samme som sist'
      : p.kilde === 'ord' ? 'Forslag fra Neam' : '';
    if(kilde) mer.appendChild(okEl('span', 'ok-kilde' + ((!p.kategori && !p.ute) || p.mulDobbel ? ' mangler' : ''), okVask(kilde)));
    if(p.fra === 'trumf' && p.harKvittering !== false && !p.ute) mer.appendChild(okVarer(p));
    if(mer.children.length) rad.appendChild(mer);
    return rad;
  }

  /* Varelinjene paa en Trumf-kvittering. Hver vare foelger kjoepet, eller
     faar sin egen kategori; resten av beloepet gaar til kjoepets kategori. */
  function okVarer(p){
    var boks = okEl('div', '');
    var flyttet = Object.keys(p.linjeKat).filter(function(i){ return p.linjeKat[i] && p.linjeKat[i] !== p.kategori; }).length;
    var vis = okEl('button', 'ok-lenke', p.apen ? 'Skjul varene'
      : 'Se varene ›' + (flyttet ? ' (' + flyttet + (flyttet === 1 ? ' vare' : ' varer') + ' med egen kategori)' : ''));
    vis.type = 'button'; vis.id = 'ok-varer-' + p.id;
    vis.addEventListener('click', function(){ p.apen = !p.apen; okTegnInnboks(); var f = document.getElementById(vis.id); if(f) f.focus(); });
    boks.appendChild(vis);
    if(!p.apen) return boks;
    var liste = okEl('div', 'ok-linjer', '<span class="ok-meta">Henter kvitteringen …</span>');
    boks.appendChild(liste);
    var tegn = function(kv){
      if(!kv.ok){ liste.innerHTML = '<span class="ok-meta">' + okVask(kv.feil) + '</span>'; return; }
      p.linjer = kv.linjer;
      liste.innerHTML = '';
      if(!kv.linjer.length){ liste.appendChild(okEl('span', 'ok-meta', 'Kvitteringen har ingen varelinjer.')); return; }
      kv.linjer.forEach(function(l, i){
        var r = okEl('div', 'ok-vare');
        r.appendChild(okEl('span', '', okVask(l.navn) + (l.antall !== 1 ? ' <span class="ok-meta">× ' + okVask(Number(l.antall).toLocaleString('nb-NO')) + '</span>' : '')));
        r.appendChild(okEl('b', '', okKr0.format(l.belop + (l.rabatt || 0))));
        var v = okKatVelg('ok-linje-' + p.id + '-' + i, p.linjeKat[i] || '', 'Som kjøpet', 'Kategori for ' + l.navn);
        v.addEventListener('change', function(){ p.linjeKat[i] = v.value; okTegnBunn(); });
        r.appendChild(v);
        liste.appendChild(r);
      });
    };
    if(p.linjer) tegn({ ok:true, linjer:p.linjer });
    else okHent('/api/bank?hva=trumf-kvittering&id=' + encodeURIComponent(p.trumfId)).then(tegn);
    return boks;
  }

  function okTegnBunn(){
    var klare = okPoster.filter(okPostKlar), strokne = okPoster.filter(function(p){ return p.ute; });
    var venter = okPoster.length - klare.length - strokne.length;
    var sum = klare.reduce(function(s, p){ return s + p.belop; }, 0);
    document.getElementById('ok-bunn').hidden = false;
    /* Netto: inn og ut samlet, ogsaa det som er utenfor budsjettet. */
    document.getElementById('ok-sum').textContent = 'Netto ' + okKr0.format(sum) + ' kr';
    document.getElementById('ok-venter').textContent = venter
      ? venter + (venter === 1 ? ' post venter' : ' poster venter') + ' på kategori og blir liggende'
      : 'Alt i innboksen er klart';
    var antall = klare.length + strokne.length;
    var knapp = document.getElementById('ok-godkjenn');
    knapp.textContent = 'Godkjenn ' + klare.length + (klare.length === 1 ? ' post' : ' poster') + (strokne.length ? ', stryk ' + strokne.length : '');
    knapp.disabled = antall === 0;
  }

  document.getElementById('ok-godkjenn').addEventListener('click', function(){
    var knapp = this;
    var klare = okPoster.filter(okPostKlar), strokne = okPoster.filter(function(p){ return p.ute; });
    if(!klare.length && !strokne.length) return;
    knapp.disabled = true;
    okHent('/api/bank', { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify({
      hva:'godkjenn',
      godkjenn:klare.map(function(p){
        var g = { id:p.id, kategori:p.kategori };
        if(p.fra === 'trumf' && Object.keys(p.linjeKat).length) g.linjer = p.linjeKat;
        return g;
      }),
      strok:strokne.map(function(p){ return p.id; })
    }) }).then(function(r){
      var tekst = document.getElementById('ok-stripe-tekst');
      if(!r.ok){ tekst.textContent = 'Ble ikke lagret: ' + r.feil; document.getElementById('ok-stripe').hidden = false; knapp.disabled = false; return; }
      var sum = klare.reduce(function(s, p){ return s + p.belop; }, 0);
      okAngre = klare.concat(strokne).map(function(p){ return p.id; });
      okPoster = okPoster.filter(function(p){ return okAngre.indexOf(p.id) === -1; });
      /* Angre-stripa staar til noen gjoer noe med den (designsystemet, «Angre framfor å spørre»). */
      tekst.textContent = klare.length + (klare.length === 1 ? ' post' : ' poster') + ' godkjent, ' + okKr0.format(sum) + ' kr.'
        + (strokne.length ? ' ' + strokne.length + ' strøket.' : '') + ' Neam husker kategoriene til neste gang.';
      document.getElementById('ok-stripe').hidden = false;
      okTegnInnboks();
    });
  });
  document.getElementById('ok-angre').addEventListener('click', function(){
    if(!okAngre) return;
    okHent('/api/bank', { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify({ hva:'angre', ider:okAngre }) })
      .then(function(r){
        if(!r.ok){ document.getElementById('ok-stripe-tekst').textContent = 'Kunne ikke angre: ' + r.feil; return; }
        okAngre = null;
        document.getElementById('ok-stripe').hidden = true;
        okLastInnboks();
      });
  });
  document.getElementById('ok-stripe-lukk').addEventListener('click', function(){ okAngre = null; document.getElementById('ok-stripe').hidden = true; });

  /* ---------- Trumf ----------
     Kvitteringene fra KIWI, MENY, SPAR og Joker. Innloggingen er Cookie-
     feltet fra trumf.no, som man limer inn selv - Neam ser aldri passordet. */
  var okTrumfSkjema = false;

  function okTrumfStatus(){
    okHent('/api/bank?hva=trumf').then(okTegnTrumf);
  }

  function okTegnTrumf(s){
    var boks = document.getElementById('ok-trumf'), meta = document.getElementById('ok-trumf-meta');
    boks.innerHTML = ''; meta.textContent = '';
    if(!s.ok){ boks.appendChild(okEl('p', 'ok-melding feil', okVask(s.feil))); return; }
    if(s.koblet && s.virker){
      meta.textContent = s.antall + ' kjøp siste 12 måneder' + (s.nyeste ? ' · nyeste ' + okKort.format(new Date(s.nyeste)) : '');
      var liste = okEl('div', '', '<p class="ok-meta">Henter kjøpene …</p>');
      boks.appendChild(liste);
      okHent('/api/bank?hva=trumf-kjop').then(function(r){ okTegnTrumfKjop(liste, r); });
    } else if(s.koblet){
      /* To ulike feil, to ulike beskjeder (planen, «Varsel 1/2»). */
      boks.appendChild(okEl('p', 'ok-melding feil', s.kode === 'innlogging'
        ? 'Trumf trenger ny innlogging. Lim inn Cookie-feltet fra trumf.no på nytt.'
        : okVask(s.feil)));
      if(s.kode === 'innlogging') okTrumfSkjema = true;
    } else {
      boks.appendChild(okEl('p', 'ok-meta', 'Trumf er ikke koblet. Når innloggingen er lagt inn, henter Neam kvitteringene med varelinjer fra trumf.no.'));
      okTrumfSkjema = true;
    }
    if(okTrumfSkjema) boks.appendChild(okTrumfInnlogging());
    var knapper = okEl('div', 'ok-rad-knapper');
    if(s.koblet && !okTrumfSkjema){
      var ny = okEl('button', 'ok-lenke', 'Lim inn ny innlogging'); ny.type = 'button';
      ny.addEventListener('click', function(){ okTrumfSkjema = true; okTegnTrumf(s); var f = document.getElementById('ok-trumf-cookie'); if(f) f.focus(); });
      knapper.appendChild(ny);
    }
    if(s.koblet){
      /* Innloggingen kan hentes paa nytt fra trumf.no, saa det spoerres ikke. */
      var fra = okEl('button', 'ok-lenke fare', 'Koble fra Trumf'); fra.type = 'button';
      fra.addEventListener('click', function(){
        okHent('/api/bank', { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify({ hva:'trumf-koble-fra' }) })
          .then(function(){ okTrumfSkjema = false; okTrumfStatus(); });
      });
      knapper.appendChild(fra);
    }
    if(knapper.children.length) boks.appendChild(knapper);
  }

  function okTrumfInnlogging(){
    var boks = okEl('div', '', '');
    boks.style.display = 'flex'; boks.style.flexDirection = 'column'; boks.style.gap = '10px';
    boks.appendChild(okEl('ol', 'ok-steg',
      '<li>Logg inn på trumf.no i nettleseren på PC-en, og åpne «Mine kvitteringer».</li>'
      + '<li>Trykk F12 og velg fanen <b>Network</b> (Nettverk). Oppdater sida.</li>'
      + '<li>Klikk på den første linja til <b>www.trumf.no</b>. Under <b>Request Headers</b>, kopier hele verdien av <b>Cookie</b>.</li>'
      + '<li>Lim den inn her. Den skal inneholde «authjs.session-token».</li>'));
    var felt = document.createElement('textarea');
    felt.className = 'ok-felt'; felt.id = 'ok-trumf-cookie';
    felt.setAttribute('aria-label', 'Cookie-feltet fra trumf.no');
    felt.autocomplete = 'off'; felt.spellcheck = false;
    boks.appendChild(felt);
    boks.appendChild(okEl('p', 'ok-meta', 'Innloggingen lagres bare på Neams tjener, bak den samme sperra som banken, og varer rundt et år. Neam ser aldri passordet ditt.'));
    var rad = okEl('div', 'ok-rad-knapper');
    var lagre = okEl('button', 'btn btn-ny', 'Lagre innlogging'); lagre.type = 'button';
    var svarTekst = okEl('span', 'ok-meta', '');
    lagre.addEventListener('click', function(){
      var verdi = felt.value.trim();
      if(!verdi){ svarTekst.textContent = 'Feltet er tomt.'; return; }
      lagre.disabled = true; svarTekst.textContent = 'Prøver innloggingen mot trumf.no …';
      okHent('/api/bank', { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify({ hva:'trumf-innlogging', cookie:verdi }) })
        .then(function(r){
          lagre.disabled = false;
          if(!r.ok){ svarTekst.textContent = r.feil; return; }
          felt.value = '';
          /* Er sida endret, hjelper ikke en ny innlogging - da skjules skjemaet. */
          okTrumfSkjema = !r.virker && r.kode === 'innlogging';
          okTegnTrumf(r);
        });
    });
    rad.appendChild(lagre); rad.appendChild(svarTekst);
    boks.appendChild(rad);
    return boks;
  }

  function okTegnTrumfKjop(liste, r){
    liste.innerHTML = '';
    if(!r.ok){ liste.appendChild(okEl('p', 'ok-melding feil', okVask(r.feil))); return; }
    var kjop = (r.kjop || []).slice().sort(function(a, b){ return b.tid.localeCompare(a.tid); }).slice(0, 15);
    if(!kjop.length){ liste.appendChild(okEl('p', 'ok-meta', 'Ingen kjøp siste 12 måneder.')); return; }
    kjop.forEach(function(k){
      var rad = okEl('div', 'ok-kjop',
        '<span class="ok-meta">' + okVask(k.tid ? okKort.format(new Date(k.tid)) : '') + '</span>'
        + '<span class="ok-navn">' + okVask(k.butikk) + '</span>'
        + '<b>' + okKr0.format(k.belop) + '</b>');
      if(k.harKvittering){
        var vis = okEl('button', 'ok-lenke', 'Se varene ›'); vis.type = 'button';
        var linjer = null;
        vis.addEventListener('click', function(){
          if(linjer){ linjer.remove(); linjer = null; vis.textContent = 'Se varene ›'; return; }
          linjer = okEl('div', 'ok-linjer', '<span class="ok-meta">Henter kvitteringen …</span>');
          rad.appendChild(linjer); vis.textContent = 'Skjul varene';
          okHent('/api/bank?hva=trumf-kvittering&id=' + encodeURIComponent(k.id)).then(function(kv){
            if(!linjer) return;
            if(!kv.ok){ linjer.innerHTML = '<span class="ok-meta">' + okVask(kv.feil) + '</span>'; return; }
            linjer.innerHTML = kv.linjer.map(function(l){
              return '<div class="ok-linje"><span>' + okVask(l.navn) + (l.antall !== 1 ? ' <span class="ok-meta">× ' + okVask(Number(l.antall).toLocaleString('nb-NO')) + (l.enhet && l.enhet !== 'stk' ? ' ' + okVask(l.enhet) : '') + '</span>' : '')
                + (l.rabatt ? ' <span class="ok-meta">rabatt ' + okKr0.format(l.rabatt) + '</span>' : '') + '</span><b>' + okKr0.format(l.belop) + '</b></div>';
            }).join('') || '<span class="ok-meta">Kvitteringen har ingen varelinjer.</span>';
          });
        });
        rad.appendChild(vis);
      }
      liste.appendChild(rad);
    });
    if((r.kjop || []).length > 15) liste.appendChild(okEl('p', 'ok-meta', 'Viser de 15 nyeste av ' + r.kjop.length + '.'));
  }

  okTrumfStatus();

  okHent('/api/bank?hva=status').then(function(s){
    if(!okVisStatus(s)) return;
    okLastInnboks();
    document.getElementById('ok-kontoer-kort').hidden = false;
    document.getElementById('ok-kontoer').innerHTML = '<p class="ok-meta">Henter kontoene fra DNB …</p>';
    okHent('/api/bank?hva=kontoer').then(function(r){
      if(!r.ok){ document.getElementById('ok-kontoer').innerHTML = '<p class="ok-melding feil">' + okVask(r.feil) + '</p>'; return; }
      okKontoer = r.kontoer || [];
      /* Hvert tall viser hvor ferskt det er (planen). */
      document.getElementById('ok-hentet').textContent = 'Hentet kl. ' + okKlokke.format(new Date(r.hentet)) + (r.advarsel ? ' · banken svarte ikke, viser forrige henting' : '');
      okTegnKontoer();
    });
  });
})();
</script>
</body>
</html>
