<style>
/* ============================================================
   NEAM - Spanskspill for Emma
   Laget 2. november 2026, til proeven onsdag 4. november. Innholdet
   er heftet «Spansk til onsdag»: personlige pronomen, aa presentere
   seg selv, og presens av -AR, -ER og -IR. Ingenting utover det.

   Heftets maal er aa kjenne igjen MOENSTRENE, ikke pugge hvert verb.
   Derfor er kartet oeverst selve endelsestabellen: tre rader (-AR,
   -ER, -IR) med seks endelser hver, pluss pronomenene og de fem
   presentasjonsfrasene. Hver rute har to prikker; to riktige gjoer
   den gul. Et galt svar slukker ingenting.

   FEM FANER:
     Quiz       - flervalg, generert fra tabellene under
     Bøy        - stammen staar, hun velger endelsen
     Skriv      - huskeregelen fra minnet: seks ruter per gruppe, og hun
                  taster endelsene selv (lagt til 2. november). Egne
                  stjerner: et forsoek er alle tre gruppene, og 5, 10
                  og 15 feilfrie forsoek PAA RAD gir 1, 2 og 3 stjerner.
                  Stjernene beholdes; rekka starter paa nytt ved en feil.
     Setninger  - norsk setning, spanske ordbrikker i riktig rekkefoelge.
                  Verbsetningene har en gal verbform med som felle.
     Huskelapp  - tabellene fra heftet, til aa se paa naar hun staar fast

   Samme ramme som naturfag- og grunnstoffspillet: gult (--lys) betyr
   «det der gikk bra», et galt svar er dust og aldri roedt, ingen
   Neam-firer, og merket oppe til venstre gaar til Emma dash. Paa
   telefon viker kartet mens en runde paagaar.

   Framdriften ligger bare i localStorage paa enheten.

   KLASSENAVN ER PREFIKSET `sp-`.
   ============================================================ */

:root{
  --messing:#B8873A;
  --messing-lys:#D9AE68;
  --lys:#F2C14E;
  --lys-glod:rgba(242,193,78,.75);
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; padding:0; width:100%; overflow-x:clip; color:var(--ink); }
body{
  font-family:'Archivo', system-ui, -apple-system, sans-serif;
  background:var(--side-bakgrunn);
  min-height:100vh;
}
.sp-side{ max-width:980px; margin:0 auto; padding:10px 12px calc(28px + env(safe-area-inset-bottom)); }
@media(min-width:700px){ .sp-side{ padding:18px 20px 36px; } }

/* ---------- Topplinja ---------- */
.sp-topp{ display:flex; align-items:center; gap:12px; margin-bottom:12px; flex-wrap:wrap; }
.sp-merke{ flex-shrink:0; display:block; width:56px; height:56px; }
.sp-merke img{ width:100%; height:100%; object-fit:contain; display:block; }
.sp-merke img[hidden]{ display:none; }
@media(min-width:700px){ .sp-merke{ width:84px; height:84px; } }
.sp-tittel{ margin:0; font-size:var(--t-stor); font-weight:700; line-height:1.15; }
.sp-tittel span{
  display:block; font-size:var(--t-etikett); font-weight:700;
  letter-spacing:.14em; text-transform:uppercase; color:var(--ink-soft);
}
.sp-faner{ display:flex; gap:4px; margin-left:auto; flex-wrap:wrap; justify-content:flex-end; }
.sp-fane{
  border:none; background:transparent; font-family:inherit; cursor:pointer;
  font-size:var(--t-meta); font-weight:700; letter-spacing:.06em;
  text-transform:uppercase; color:var(--ink-soft);
  padding:8px 10px; border-bottom:3px solid transparent;
}
.sp-fane.sp-valgt{ color:var(--ink); border-bottom-color:var(--messing); }
/* Telefon: fanene paa hele linja under merket. Maa staa ETTER
   grunnregelen over, ellers vinner den - og med fem faner gikk den
   siste ned paa en egen linje. */
@media(max-width:640px){
  .sp-faner{ margin-left:0; width:100%; justify-content:flex-start; gap:0; }
  .sp-fane{ padding:8px 10px 8px 0; letter-spacing:.03em; }
}

/* ---------- Panelet ---------- */
.sp-panel{
  background:var(--paper); border:2px solid var(--messing);
  border-radius:18px; box-shadow:var(--shadow);
  padding:14px; margin-bottom:14px;
}
@media(min-width:700px){ .sp-panel{ padding:18px; } }
.sp-panel-tittel{
  font-size:var(--t-meta); font-weight:700; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink); margin:0 0 10px;
}
.sp-ledetekst{ font-size:var(--t-meta); font-weight:600; color:var(--ink-soft); margin:0 0 12px; line-height:1.45; }
.sp-undertittel{
  font-size:var(--t-etikett); font-weight:700; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-soft); margin:4px 0 0;
}

/* ---------- Kartet: endelsestabellen ---------- */
.sp-kart{ display:grid; grid-template-columns:1fr; gap:12px; }
@media(min-width:760px){ .sp-kart{ grid-template-columns:1fr 1fr; } .sp-kart-verb{ grid-column:1 / -1; } }
.sp-del-navn{
  font-size:var(--t-etikett); font-weight:700; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-soft); margin:0 0 6px;
}
.sp-ruter{ display:flex; gap:5px; flex-wrap:wrap; align-items:center; }
.sp-verbrad{ display:flex; gap:5px; align-items:center; margin-bottom:5px; }
.sp-verbrad-navn{ width:36px; flex-shrink:0; font-size:var(--t-meta); font-weight:700; }
/* Pronomenene staar over kolonnen sin, saa tabellen leses som i heftet:
   person oeverst, endelsen under. To linjer der heftet har to former
   (él / ella), saa ingen kolonne maa bli bredere enn de andre. */
.sp-verbhode{ align-items:flex-end; margin-bottom:4px; }
.sp-pers{
  flex:1 1 0; min-width:0; text-align:center; line-height:1.15;
  font-size:var(--t-etikett); font-weight:700; color:var(--ink-soft);
}
.sp-pers span{ display:block; }
@media(max-width:400px){
  .sp-verbrad-navn{ width:30px; }
  .sp-pers{ font-size:10px; letter-spacing:-.01em; }
}
.sp-rute{
  min-width:44px; height:44px; padding:0 9px; border-radius:10px; cursor:pointer;
  border:2px solid var(--line); background:var(--boks-mild); color:var(--ink);
  font-family:inherit; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:4px;
}
.sp-rute:active{ transform:scale(.94); }
.sp-verbrad .sp-rute{ flex:1 1 0; min-width:0; padding:0 2px; }
.sp-rute b{ font-size:var(--t-meta); font-weight:700; line-height:1; white-space:nowrap; }
.sp-prikker2{ display:flex; gap:3px; }
.sp-prikker2 i{
  width:7px; height:7px; border-radius:50%; display:block;
  border:1.5px solid var(--boks-kant); background:transparent;
}
.sp-prikker2 i.sp-tent{ background:var(--lys); border-color:var(--messing-lys); }
.sp-rute.sp-mestret{
  border-color:var(--lys); background:rgba(242,193,78,.28);
  box-shadow:0 0 0 2px var(--lys-glod);
}
.sp-kart-sum{ margin:10px 0 0; font-size:var(--t-meta); font-weight:700; color:var(--ink-soft); }
@media(max-width:640px){
  body.sp-i-runde .sp-kart-panel{ display:none; }
}

/* ---------- Knapper og valg ---------- */
.sp-knapp{
  font-family:inherit; font-size:var(--t-brod); font-weight:700;
  padding:11px 18px; border-radius:12px; cursor:pointer;
  border:2px solid var(--messing); background:var(--paper); color:var(--ink);
}
.sp-knapp:active{ transform:scale(.98); }
.sp-knapp.sp-tung{ background:var(--aksent); border-color:var(--aksent); color:#FFFFFF; }
.sp-knapp.sp-tung:active{ background:var(--aksent-moerk); }
.sp-knapp[disabled]{ opacity:.45; cursor:default; }
.sp-knapper{ display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; }
@media(max-width:640px){ .sp-knapper .sp-knapp{ flex:1 1 auto; } }

.sp-valg{ display:flex; flex-wrap:wrap; gap:8px; margin:6px 0 16px; }
.sp-velger{
  font-family:inherit; font-size:var(--t-brod); font-weight:700;
  padding:9px 16px; border-radius:999px; cursor:pointer;
  border:2px solid var(--line); background:var(--paper); color:var(--ink-soft);
}
.sp-velger.sp-pa{ border-color:var(--messing); color:var(--ink); background:var(--boks-mild); }
.sp-velger .sp-hake{ margin-right:6px; opacity:0; }
.sp-velger.sp-pa .sp-hake{ opacity:1; }

/* ---------- Spoersmaal ---------- */
.sp-hode{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.sp-teller{
  font-size:var(--t-etikett); font-weight:700; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-soft);
}
.sp-lapp{
  font-size:var(--t-etikett); font-weight:700; letter-spacing:.06em;
  border:1px solid var(--boks-kant); background:var(--boks-mild);
  border-radius:999px; padding:3px 10px; color:var(--ink-soft);
}
.sp-rad{
  margin-left:auto; font-size:var(--t-meta); font-weight:700;
  background:rgba(242,193,78,.25); border:1px solid var(--lys);
  border-radius:999px; padding:3px 12px;
}
.sp-rad[hidden]{ display:none; }
.sp-rad.sp-pop{ animation:spPop .5s ease; }
@keyframes spPop{ 0%{ transform:scale(1); } 40%{ transform:scale(1.18); } 100%{ transform:scale(1); } }

.sp-sporsmaal{ font-size:var(--t-stor); font-weight:700; margin:12px 0 14px; line-height:1.3; }
.sp-sporsmaal em{ font-style:normal; color:var(--aksent-moerk); }
.sp-svar{ display:grid; grid-template-columns:1fr; gap:10px; }
@media(min-width:620px){ .sp-svar{ grid-template-columns:1fr 1fr; } }
.sp-svar-knapp{
  font-family:inherit; font-size:var(--t-brod); font-weight:700; text-align:left;
  padding:14px 16px; border-radius:12px; cursor:pointer; line-height:1.35;
  border:2px solid var(--line); background:var(--paper); color:var(--ink);
}
.sp-svar-knapp:active{ transform:scale(.99); }
.sp-riktig{
  border-color:var(--lys) !important; background:rgba(242,193,78,.22) !important;
  box-shadow:0 0 0 3px var(--lys-glod);
}
.sp-galt{ opacity:.5; text-decoration:line-through; }
.sp-svar-knapp[disabled]{ cursor:default; }

.sp-fasit{
  margin-top:14px; font-size:var(--t-brod); font-weight:600; line-height:1.5;
  background:var(--boks-mild); border:1px solid var(--boks-kant);
  border-radius:12px; padding:12px 14px;
}
.sp-fasit[hidden]{ display:none; }
.sp-fasit b{ display:block; margin-bottom:2px; }

.sp-prikker{ display:flex; gap:5px; margin:12px 0 0; flex-wrap:wrap; }
.sp-prikker i{
  width:10px; height:10px; border-radius:50%; display:block;
  border:2px solid var(--line); background:transparent;
}
.sp-prikker i.sp-p-riktig{ background:var(--lys); border-color:var(--lys); }
.sp-prikker i.sp-p-bom{ background:var(--ink-soft); border-color:var(--ink-soft); opacity:.45; }
.sp-prikker i.sp-p-na{ border-color:var(--messing); }

/* ---------- Boey verbet ---------- */
.sp-oppgave{ text-align:center; margin:14px 0 6px; }
.sp-oppgave-pron{ font-size:var(--t-stor); font-weight:700; }
.sp-oppgave-inf{ font-size:var(--t-meta); font-weight:600; color:var(--ink-soft); margin-top:2px; }
.sp-ord{
  display:flex; justify-content:center; align-items:baseline; gap:2px;
  font-size:calc(var(--t-display) * .8); font-weight:700; line-height:1.1; margin:12px 0 18px;
}
.sp-stamme{ color:var(--ink); }
/* Ruta der endelsen skal inn. Fast bredde, saa ordet ikke hopper naar
   den fylles - samme grunn som svarrubrikken i mattespillet. */
.sp-hull{
  min-width:2.6em; padding:0 .15em; text-align:left;
  border-bottom:4px solid var(--messing); color:var(--aksent-moerk);
}
.sp-hull.sp-riktig{ box-shadow:none; border-radius:6px 6px 0 0; }
.sp-endelser{ display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; max-width:420px; margin:0 auto; }
.sp-endelse{
  font-family:inherit; font-size:var(--t-stor); font-weight:700; cursor:pointer;
  padding:12px 6px; border-radius:12px; border:2px solid var(--line);
  background:var(--paper); color:var(--ink);
}
.sp-endelse:active{ transform:scale(.97); }
.sp-endelse[disabled]{ cursor:default; }
.sp-moenster{ display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-top:8px; }
.sp-moenster span{
  font-size:var(--t-meta); font-weight:700; padding:3px 9px; border-radius:8px;
  border:1px solid var(--boks-kant); background:var(--paper);
}
.sp-moenster span.sp-her{ border-color:var(--lys); background:rgba(242,193,78,.3); }

/* ---------- Skriv endelsene ----------
   Huskeregelen som tabell: pronomenet til venstre, en bindestrek og en
   rute til hoeyre. 20px skrift i rutene - under 16px zoomer iPhone inn
   naar feltet faar fokus. */
.sp-skriv-gruppe{ text-align:center; margin:12px 0 4px; }
.sp-skriv-gruppe b{ display:block; font-size:var(--t-display); line-height:1; }
.sp-skriv-gruppe span{ font-size:var(--t-meta); font-weight:600; color:var(--ink-soft); }
.sp-skriv-tabell{ max-width:360px; margin:14px auto 0; display:flex; flex-direction:column; gap:8px; }
.sp-skriv-rad{ display:grid; grid-template-columns:1fr auto; align-items:center; column-gap:10px; }
.sp-skriv-pron{ font-size:var(--t-brod); font-weight:700; text-align:right; }
.sp-skriv-felt-ramme{ display:flex; align-items:center; gap:4px; font-size:20px; font-weight:700; }
.sp-skriv-felt{
  width:120px; font-family:inherit; font-size:20px; font-weight:700; color:var(--ink);
  padding:8px 10px; border-radius:10px; border:2px solid var(--line); background:var(--bg-solid);
}
.sp-skriv-felt:focus{ outline:none; border-color:var(--aksent); }
.sp-skriv-felt.sp-riktig{ box-shadow:0 0 0 3px var(--lys-glod); }
.sp-skriv-felt.sp-galt{ text-decoration:line-through; }
.sp-skriv-fasit{ grid-column:2; font-size:var(--t-meta); font-weight:700; color:var(--ink-soft); margin-top:2px; }
.sp-skriv-fasit[hidden]{ display:none; }

/* ---------- Setninger ---------- */
.sp-norsk{ font-size:var(--t-stor); font-weight:700; margin:12px 0 12px; line-height:1.3; }
.sp-linje{
  min-height:62px; border:2px dashed var(--boks-kant); border-radius:14px;
  background:var(--bg-solid); padding:8px; display:flex; flex-wrap:wrap; gap:8px;
  align-items:center; margin-bottom:12px;
}
.sp-linje.sp-riktig{ border-style:solid; }
.sp-linje-tom{ font-size:var(--t-meta); font-weight:600; color:var(--ink-soft); padding:0 6px; }
.sp-brikker{ display:flex; flex-wrap:wrap; gap:8px; }
.sp-brikke{
  font-family:inherit; font-size:var(--t-brod); font-weight:700; cursor:pointer;
  padding:10px 14px; border-radius:10px; border:2px solid var(--messing);
  background:var(--paper); color:var(--ink);
}
.sp-brikke:active{ transform:scale(.96); }
.sp-brikke.sp-brukt{ visibility:hidden; }
.sp-brikke[disabled]{ cursor:default; }

/* ---------- Resultatet ---------- */
.sp-resultat{ text-align:center; }
.sp-stjerner{ display:flex; justify-content:center; gap:8px; margin:6px 0 12px; }
.sp-stjerne{ width:52px; height:52px; display:block; }
.sp-stjerne.sp-tom-stjerne{ filter:grayscale(1) opacity(.32); }
.sp-stjerne.sp-glod{ filter:drop-shadow(0 0 8px var(--lys-glod)); }
.sp-stort-tall{ font-size:var(--t-display); font-weight:700; line-height:1; margin:4px 0; }
.sp-skryt{ font-size:var(--t-stor); font-weight:700; margin:6px 0 4px; }
.sp-gitt{
  display:inline-block; margin:6px 0 4px;
  font-size:var(--t-meta); font-weight:700; letter-spacing:.06em;
  background:rgba(242,193,78,.25); border:1px solid var(--lys);
  border-radius:999px; padding:5px 14px;
}
.sp-resultat .sp-knapper{ justify-content:center; }
.sp-fasitliste{ text-align:left; margin-top:18px; }
.sp-fasitrad{ padding:9px 0; border-top:1px solid var(--line); font-size:var(--t-meta); line-height:1.45; }
.sp-fasitrad b{ display:block; font-size:var(--t-brod); }
.sp-fasitrad s{ color:var(--ink-soft); }

/* ---------- Huskelappen ---------- */
.sp-lapper{ display:grid; grid-template-columns:1fr; gap:14px; }
@media(min-width:700px){ .sp-lapper{ grid-template-columns:1fr 1fr; } }
.sp-lapper-verb{ display:grid; grid-template-columns:1fr; gap:14px; margin-top:14px; }
@media(min-width:700px){ .sp-lapper-verb{ grid-template-columns:repeat(3, 1fr); } }
.sp-tabell{ width:100%; border-collapse:collapse; font-size:var(--t-brod); }
.sp-tabell caption{
  text-align:left; font-size:var(--t-etikett); font-weight:700; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-soft); padding-bottom:6px;
}
.sp-tabell td{ padding:6px 8px; border-top:1px solid var(--line); vertical-align:top; }
.sp-tabell td:first-child{ font-weight:700; }
.sp-tabell td.sp-end{ font-weight:700; color:var(--aksent-moerk); }
.sp-regel{
  margin-top:14px; font-size:var(--t-brod); font-weight:600; line-height:1.55;
  background:rgba(242,193,78,.18); border:1px solid var(--lys);
  border-radius:12px; padding:12px 14px;
}
</style>
</head>

<div class="sp-side">

  <div class="sp-topp">
    <a class="sp-merke" href="/emma.html" aria-label="Til Emma dash">
      <img src="/bilder/ikoner/emma.png?v=2" alt="Emma dash" width="512" height="508"
           onerror="this.hidden = true">
    </a>
    <h1 class="sp-tittel">Spansk<span>Til prøven onsdag</span></h1>
    <div class="sp-faner">
      <button class="sp-fane sp-valgt" id="fane-quiz" onclick="visFane('quiz')">Quiz</button>
      <button class="sp-fane" id="fane-boy" onclick="visFane('boy')">Bøy</button>
      <button class="sp-fane" id="fane-skriv" onclick="visFane('skriv')">Skriv</button>
      <button class="sp-fane" id="fane-setning" onclick="visFane('setning')">Setninger</button>
      <button class="sp-fane" id="fane-husk" onclick="visFane('husk')">Huskelapp</button>
    </div>
  </div>

  <div class="sp-panel sp-kart-panel">
    <div class="sp-kart" id="kart"></div>
    <p class="sp-kart-sum" id="kartSum"></p>
  </div>

  <div class="sp-panel" id="flate"></div>

</div>

<script>
/* ================================================================
   INNHOLDET - rett fra heftet
   ================================================================ */

/* Pronomenene. `person` er plassen i boeyningstabellen (0 yo ... 5
   ellos), `andre` er formene som betyr det samme. */
const PRONOMEN = [
  { es:'yo',       no:'jeg',  person:0 },
  { es:'tú',       no:'du',   person:1 },
  { es:'él',       no:'han',  person:2 },
  { es:'ella',     no:'hun',  person:2 },
  { es:'nosotros', no:'vi',   person:3, andre:'nosotras' },
  { es:'vosotros', no:'dere', person:4, andre:'vosotras' },
  { es:'ellos',    no:'de',   person:5, andre:'ellas' }
];
/* Slik personene staar i tabellene og i svaralternativene. */
const PERSON_NAVN = ['yo','tú','él / ella','nosotros','vosotros','ellos / ellas'];
/* Naar et pronomen staar i et spoersmaal, velges en av formene. */
const PERSON_FORMER = [['yo'],['tú'],['él','ella'],['nosotros','nosotras'],['vosotros','vosotras'],['ellos','ellas']];

const GRUPPER = {
  ar:{ navn:'-AR', endelser:['o','as','a','amos','áis','an'] },
  er:{ navn:'-ER', endelser:['o','es','e','emos','éis','en'] },
  ir:{ navn:'-IR', endelser:['o','es','e','imos','ís','en'] }
};

/* Verbene fra heftet. `resten` er det som gjoer en setning av verbformen. */
const VERB = [
  { inf:'hablar',   gr:'ar', no:'å snakke',  resten:'español' },
  { inf:'trabajar', gr:'ar', no:'å jobbe',   resten:'mucho' },
  { inf:'estudiar', gr:'ar', no:'å studere', resten:'español' },
  { inf:'bailar',   gr:'ar', no:'å danse',   resten:'mucho' },
  { inf:'cantar',   gr:'ar', no:'å synge',   resten:'mucho' },
  { inf:'escuchar', gr:'ar', no:'å høre på', resten:'música' },
  { inf:'comer',    gr:'er', no:'å spise',   resten:'pizza' },

];
function stamme(v){ return v.inf.slice(0, -2); }
function form(v, p){ return stamme(v) + GRUPPER[v.gr].endelser[p]; }

const FRASER = [

/* Rutene i kartet: 'p:<pronomen>', 'f:<frase>', 'v:<gruppe>:<person>'. */
function poeng(k){ return Math.min(2, lager.r[k] || 0); }
function gi(k){ if(!k) return; lager.r[k] = Math.min(2, (lager.r[k] || 0) + 1); lagre(); tegnKart(); }

const $ = id => document.getElementById(id);
function bland(a){
  const b = a.slice();
  for(let i = b.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [b[i], b[j]] = [b[j], b[i]];
  }
  return b;
}
const en = a => a[Math.floor(Math.random() * a.length)];
function el(tag, kl, tekst){
  const e = document.createElement(tag);
  if(kl) e.className = kl;
  if(tekst != null) e.textContent = tekst;

}
const stor = s => s[0].toUpperCase() + s.slice(1);
function stjerneBilde(tent, glod){

function stjerner(andel){ return andel >= 1 ? 3 : andel >= .8 ? 2 : andel >= .5 ? 1 : 0; }
function skryt(andel){

/* ================================================================
   QUIZ - spoersmaalene lages fra tabellene
   ================================================================ */
const QUIZ_TYPER = {
  pronomen:'Pronomen', fraser:'Presentere deg', verb:'Verbene'
};
const quizValg = new Set(['pronomen','fraser','verb']);
let quizAntall = 15;
let quiz = null;

/* Generatorene tar valgfrie argumenter, saa en rute i kartet kan be om
   spoersmaal om akkurat seg selv. Uten argumenter er alt tilfeldig. */
function lagPronomen(i = Math.floor(Math.random() * PRONOMEN.length), retning = Math.floor(Math.random() * 2)){
  const p = PRONOMEN[i];
  const andre = bland(PRONOMEN.filter(x => x.no !== p.no)).slice(0, 3);
  if(retning === 0) return { k:'p:' + i, tema:'Pronomen',
    q:'Hva betyr <em>' + p.es + '</em>?', riktig:p.no, gale:andre.map(x => x.no),
    fasit:p.es + (p.andre ? ' / ' + p.andre : '') + ' = ' + p.no };
  return { k:'p:' + i, tema:'Pronomen',
    q:'Hva er <em>' + p.no + '</em> på spansk?', riktig:p.es, gale:andre.map(x => x.es),
    fasit:p.no + ' = ' + p.es + (p.andre ? ' (eller ' + p.andre + ')' : '') };
}
function lagFrase(i = Math.floor(Math.random() * FRASER.length), typ = Math.floor(Math.random() * 3)){
  if(typ === 2){
    const [, tekst, riktig, gale] = FRASE_HULL.find(h => h[0] === i);
    return { k:'f:' + i, tema:'Presentere deg', q:'Hva mangler? <em>' + tekst + '</em>',
      riktig, gale, fasit:FRASER[i].es + ' = ' + FRASER[i].no };
  }
  const f = FRASER[i];
  const andre = bland(FRASER.filter((_, j) => j !== i)).slice(0, 3);
  if(typ === 0) return { k:'f:' + i, tema:'Presentere deg',
    q:'Hva betyr <em>' + f.es + '</em>', riktig:f.no, gale:andre.map(x => x.no),
    fasit:f.es + ' = ' + f.no };
  return { k:'f:' + i, tema:'Presentere deg',
    q:'Hvordan sier du <em>' + f.no + '</em>', riktig:f.es, gale:andre.map(x => x.es),
    fasit:f.no + ' = ' + f.es };
}
function lagVerb(o = {}){
  const v = en(VERB.filter(x => !o.gr || x.gr === o.gr));
  const p = o.p != null ? o.p : Math.floor(Math.random() * 6);
  const k = 'v:' + v.gr + ':' + p;
  const riktig = form(v, p);
  const galeFormer = bland([0,1,2,3,4,5].filter(x => x !== p).map(x => form(v, x)).filter(x => x !== riktig));
  const typ = o.typ != null ? o.typ : Math.floor(Math.random() * 4);
  const pron = en(PERSON_FORMER[p]);
  const regel = GRUPPER[v.gr].navn + ': ' + GRUPPER[v.gr].endelser.join(', ') + '. ' + pron + ' → -' + GRUPPER[v.gr].endelser[p] + '.';
  if(typ === 0) return { k, tema:'Verb ' + GRUPPER[v.gr].navn,
    q:'<em>' + stor(pron) + ' ____ ' + v.resten + '.</em> (' + v.inf + ')',
    riktig, gale:galeFormer.slice(0, 3),
    fasit:stor(pron) + ' ' + riktig + ' ' + v.resten + '. ' + regel };
  if(typ === 1) return { k, tema:'Verb ' + GRUPPER[v.gr].navn,
    q:'Hvem gjør det? <em>' + riktig + '</em>',
    riktig:PERSON_NAVN[p],
    gale:bland(PERSON_NAVN.filter((x, j) => j !== p && form(v, j) !== riktig)).slice(0, 3),
    fasit:riktig + ' hører til ' + PERSON_NAVN[p] + '. ' + regel };
  if(typ === 2){
    const andre = bland(VERB.filter(x => x.no !== v.no)).slice(0, 3);
    /* Betydningen hoerer ikke til en endelse, saa den tenner ingen rute. */
    return { k:null, tema:'Verb ' + GRUPPER[v.gr].navn,
      q:'Hva betyr <em>' + v.inf + '</em>?', riktig:v.no, gale:andre.map(x => x.no),
      fasit:v.inf + ' = ' + v.no + '.' };
  }
  /* Moensteret alene: hvilken endelse faar gruppa med denne personen? */
  const alle = [...new Set(Object.values(GRUPPER).map(g => g.endelser[p]).concat(GRUPPER[v.gr].endelser))];
  const gale = bland(alle.filter(e => e !== GRUPPER[v.gr].endelser[p])).slice(0, 3);
  return { k, tema:'Mønsteret',
    q:'Hvilken endelse får ' + GRUPPER[v.gr].navn + '-verb med <em>' + pron + '</em>?',
    riktig:'-' + GRUPPER[v.gr].endelser[p], gale:gale.map(e => '-' + e), fasit:regel };
}
/* Heftets egne seks oevingsoppgaver kommer alltid med i en verbrunde. */
const HEFTE_OPPG = [
  ['Yo','hablar','español',0],['Tú','vivir','en Arendal',1],['Ella','escribir','una carta',2],
  ['Nosotros','escuchar','música',3],['Ellos','comer','pizza',5],['Vosotros','trabajar','mucho',4]
];
function heftetsOppgaver(){
  return HEFTE_OPPG.map(([pron, inf, resten, p]) => {
    const v = VERB.find(x => x.inf === inf);
    const riktig = form(v, p);
    return { k:'v:' + v.gr + ':' + p, tema:'Fra heftet',
      q:'<em>' + pron + ' ____ ' + resten + '.</em> (' + inf + ')', riktig,
      gale:bland([0,1,2,3,4,5].filter(x => x !== p).map(x => form(v, x)).filter(x => x !== riktig)).slice(0, 3),
      fasit:pron + ' ' + riktig + ' ' + resten + '. ' + GRUPPER[v.gr].navn + ': ' + GRUPPER[v.gr].endelser.join(', ') + '.' };
  });
}

function lagQuiz(){
  const lagere = [];
  if(quizValg.has('pronomen')) lagere.push(lagPronomen);
  if(quizValg.has('fraser')) lagere.push(lagFrase);
  if(quizValg.has('verb')) lagere.push(lagVerb, lagVerb);
  let liste = quizValg.has('verb') ? bland(heftetsOppgaver()).slice(0, Math.min(3, quizAntall)) : [];
  const sett = new Set(liste.map(s => s.q));
  let forsok = 0;
  while(liste.length < quizAntall && forsok++ < 500){
    const s = en(lagere)();
    if(sett.has(s.q)) continue;
    sett.add(s.q); liste.push(s);
  }
  return bland(liste);
}

/* Kort runde paa en rute i kartet. Pronomenet oeves ogsaa sammen med
   verbformen sin - det er der heftet sier hun skal kjenne det igjen. */
function startFokus(k){
  const del = k.split(':');
  let lagere = [];
  if(del[0] === 'p'){
    const i = +del[1], person = PRONOMEN[i].person;
    lagere = [() => lagPronomen(i, 0), () => lagPronomen(i, 1),
      () => lagVerb({ p:person, typ:0 }), () => lagVerb({ p:person, typ:0 }), () => lagVerb({ p:person, typ:1 })];
  }else if(del[0] === 'f'){
    const i = +del[1];
    lagere = [() => lagFrase(i, 0), () => lagFrase(i, 1), () => lagFrase(i, 2)];
  }else{
    const gr = del[1], person = +del[2];
    lagere = [() => lagVerb({ gr, p:person, typ:0 }), () => lagVerb({ gr, p:person, typ:0 }),
      () => lagVerb({ gr, p:person, typ:0 }), () => lagVerb({ gr, p:person, typ:1 }), () => lagVerb({ gr, p:person, typ:3 })];
  }
  /* Samme svar to ganger i en kort runde foeles som en gjentakelse,
     ogsaa naar bare pronomenet er byttet (nosotros/nosotras). */
  const liste = [], sett = new Set();
  lagere.forEach(lag => {
    for(let forsok = 0; forsok < 20; forsok++){
      const s = lag();
      if(!sett.has(s.riktig)){ sett.add(s.riktig); liste.push(s); break; }
    }
  });
  ['quiz','boy','skriv','setning','husk'].forEach(n => $('fane-' + n).classList.toggle('sp-valgt', n === 'quiz'));
  startQuiz(bland(liste));
}

function startQuiz(liste){
  quiz = { liste, i:0, riktige:0, rad:0, bom:[], svar:[] };
  iRunde(true);
  visSporsmaal();
}

function visSporsmaal(){
  window.scrollTo(0, 0);
  const s = quiz.liste[quiz.i];
  const f = $('flate');
  f.innerHTML = '';
  const hode = el('div', 'sp-hode');
  hode.appendChild(el('span', 'sp-teller', 'Spørsmål ' + (quiz.i + 1) + ' av ' + quiz.liste.length));
  /* Merkelappen viser bare kategorien - «nosotros = vi» ville vaert svaret. */
  hode.appendChild(el('span', 'sp-lapp', s.tema));
  const rad = el('span', 'sp-rad', quiz.rad + ' på rad');
  rad.hidden = quiz.rad < 2;
  hode.appendChild(rad);
  f.appendChild(hode);
  /* Spoersmaalet er HTML for aa kunne utheve det spanske. Teksten er
     skrevet i tabellene over, aldri av brukeren. */
  const q = el('p', 'sp-sporsmaal');
  q.innerHTML = s.q;
  f.appendChild(q);

  const svar = el('div', 'sp-svar');
  const fasit = el('div', 'sp-fasit');
  fasit.hidden = true;
  const neste = el('button', 'sp-knapp sp-tung', quiz.i + 1 < quiz.liste.length ? 'Neste' : 'Se resultatet');
  neste.hidden = true;
  neste.onclick = () => { quiz.i++; quiz.i < quiz.liste.length ? visSporsmaal() : visQuizResultat(); };

  bland([s.riktig, ...s.gale]).forEach(a => {
    const b = el('button', 'sp-svar-knapp', a);
    b.onclick = () => {
      svar.querySelectorAll('button').forEach(x => {
        x.disabled = true;
        if(x.textContent === s.riktig) x.classList.add('sp-riktig');
      });
      const ok = a === s.riktig;
      quiz.svar.push(ok);
      if(ok){
        quiz.riktige++; quiz.rad++; gi(s.k);
        if(quiz.rad > (lager.rekordRad || 0)){ lager.rekordRad = quiz.rad; lagre(); }
        rad.textContent = quiz.rad + ' på rad';
        rad.hidden = quiz.rad < 2;
        if(!rad.hidden){ rad.classList.remove('sp-pop'); void rad.offsetWidth; rad.classList.add('sp-pop'); }
      }else{
        quiz.rad = 0; rad.hidden = true;
        b.classList.add('sp-galt');
        quiz.bom.push(Object.assign({ valgt:a }, s));
        fasit.innerHTML = '';
        fasit.appendChild(el('b', null, 'Riktig svar: ' + s.riktig));
        fasit.appendChild(document.createTextNode(s.fasit));
        fasit.hidden = false;
      }
      tegnPrikker();
      visKnapp(neste);
    };
    svar.appendChild(b);
  });
  f.appendChild(svar);
  f.appendChild(fasit);
  const k = el('div', 'sp-knapper');
  k.appendChild(neste);
  f.appendChild(k);
  const prikker = el('div', 'sp-prikker');
  f.appendChild(prikker);
  function tegnPrikker(){
    prikker.innerHTML = '';
    quiz.liste.forEach((_, i) => {
      prikker.appendChild(el('i', i < quiz.svar.length ? (quiz.svar[i] ? 'sp-p-riktig' : 'sp-p-bom') : (i === quiz.i ? 'sp-p-na' : '')));
    });
  }
  tegnPrikker();
}

function resultatTopp(r, riktige, tot){
  const andel = riktige / tot;
  const n = stjerner(andel);
  const st = el('div', 'sp-stjerner');
  for(let i = 0; i < 3; i++) st.appendChild(stjerneBilde(i < n, n === 3));
  r.appendChild(st);

/* ================================================================
   SKRIV ENDELSENE - huskeregelen fra minnet
   ================================================================ */
const skrivGrupper = new Set(['ar','er','ir']);
let skriv = null;
const EKSEMPEL = { ar:'hablar = å snakke', er:'comer = å spise', ir:'vivir = å bo' };

/* Aksenten er vanskelig paa telefontastatur. Et svar uten aksent
   godtas, men hun faar beskjed om hvor den skal staa - det er
   moensteret som proeves her, ikke tastaturet. */
const utenAksent = t => t.normalize('NFD').replace(/[̀-ͯ]/g, '');
function vurderEndelse(svar, fasit){
  const s = svar.trim().toLowerCase().replace(/^-+/, '');
  if(s === fasit) return 'riktig';
  if(s && utenAksent(s) === utenAksent(fasit)) return 'aksent';
  return 'galt';
}

/* Stjernene i Skriv er en rekke, ikke en prosent: 5, 10 og 15 feilfrie
   forsoek paa rad med alle tre gruppene. En stjerne som er tjent,
   beholdes - det er bare rekka som starter paa nytt ved en feil. */
const SKRIV_TRINN = [5, 10, 15];
const feilfrie = n => n + (n === 1 ? ' feilfri' : ' feilfrie') + ' på rad';
function skrivTilNeste(){
  const st = lager.skriv;
  if(st.stjerner >= 3) return null;
  return SKRIV_TRINN[st.stjerner] - st.rad;
}
function skrivStjerneBoks(glod){
  const boks = el('div', 'sp-resultat');
  const st = el('div', 'sp-stjerner');
  for(let i = 0; i < 3; i++) st.appendChild(stjerneBilde(i < lager.skriv.stjerner, glod && i === lager.skriv.stjerner - 1));
  boks.appendChild(st);
  const igjen = skrivTilNeste();
  boks.appendChild(el('span', 'sp-gitt', feilfrie(lager.skriv.rad)
    + (igjen == null ? ' · alle tre stjernene!' : ' · ' + igjen + ' til neste stjerne')));
  return boks;
}

function visSkrivOppsett(){
  iRunde(false);
  const f = $('flate');
  f.innerHTML = '';
  f.appendChild(el('h2', 'sp-panel-tittel', 'Skriv endelsene'));
  f.appendChild(el('p', 'sp-ledetekst', 'Huskeregelen fra minnet: skriv endelsen til hvert pronomen. Bare endelsen – «amos», ikke «hablamos». Aksenten kan du hoppe over på telefonen, men du får se hvor den skal stå.'));
  f.appendChild(skrivStjerneBoks(false));
  f.appendChild(el('p', 'sp-ledetekst', 'Stjerner: skriv alle tre gruppene uten feil – det er ett forsøk. 5 feilfrie forsøk på rad gir én stjerne, 10 gir to og 15 gir tre. En feil starter rekka på nytt, men stjernene du har fått, beholder du.'));
  f.appendChild(el('p', 'sp-undertittel', 'Hvilke'));
  const v = el('div', 'sp-valg');
  Object.keys(GRUPPER).forEach(g => {
    const b = el('button', 'sp-velger' + (skrivGrupper.has(g) ? ' sp-pa' : ''));
    b.appendChild(el('span', 'sp-hake', '✓'));
    b.appendChild(document.createTextNode(GRUPPER[g].navn));
    b.onclick = () => {
      if(skrivGrupper.has(g)){ if(skrivGrupper.size > 1) skrivGrupper.delete(g); } else skrivGrupper.add(g);
      b.classList.toggle('sp-pa', skrivGrupper.has(g));
    };
    v.appendChild(b);
  });
  f.appendChild(v);
  const k = el('div', 'sp-knapper');
  const start = el('button', 'sp-knapp sp-tung', 'Start');
  start.onclick = () => startSkriv(Object.keys(GRUPPER).filter(g => skrivGrupper.has(g)));
  k.appendChild(start);
  f.appendChild(k);
}

function startSkriv(grupper){
  skriv = { grupper, i:0, riktige:0, totalt:0, bom:[] };
  iRunde(true);
  visSkriv();
}

function visSkriv(){
  window.scrollTo(0, 0);
  const g = skriv.grupper[skriv.i];
  const G = GRUPPER[g];
  const f = $('flate');
  f.innerHTML = '';
  const hode = el('div', 'sp-hode');
  hode.appendChild(el('span', 'sp-teller', 'Gruppe ' + (skriv.i + 1) + ' av ' + skriv.grupper.length));
  f.appendChild(hode);
  const tittel = el('div', 'sp-skriv-gruppe');
  tittel.appendChild(el('b', null, G.navn));
  tittel.appendChild(el('span', null, EKSEMPEL[g]));
  f.appendChild(tittel);

  const tabell = el('div', 'sp-skriv-tabell');
  const felt = [], fasiter = [];
  const melding = el('div', 'sp-fasit');
  melding.hidden = true;
  const sjekk = el('button', 'sp-knapp sp-tung', 'Sjekk');
  const neste = el('button', 'sp-knapp sp-tung', skriv.i + 1 < skriv.grupper.length ? 'Neste gruppe' : 'Se resultatet');
  neste.hidden = true;

  PERSON_NAVN.forEach((pn, p) => {
    const rad = el('div', 'sp-skriv-rad');
    rad.appendChild(el('span', 'sp-skriv-pron', pn));
    const ramme = el('span', 'sp-skriv-felt-ramme');
    ramme.appendChild(document.createTextNode('-'));
    const inp = el('input', 'sp-skriv-felt');
    inp.type = 'text';
    inp.setAttribute('autocomplete', 'off');
    inp.setAttribute('autocorrect', 'off');
    inp.setAttribute('autocapitalize', 'off');
    inp.setAttribute('spellcheck', 'false');
    inp.setAttribute('enterkeyhint', p < 5 ? 'next' : 'done');
    inp.setAttribute('aria-label', 'Endelsen for ' + pn);
    /* Enter gaar til neste rute, og fra den siste sjekkes svarene. */
    inp.addEventListener('keydown', e => {
      if(e.key !== 'Enter') return;
      e.preventDefault();
      if(p < 5) felt[p + 1].focus(); else if(!sjekk.hidden) sjekk.click();
    });
    ramme.appendChild(inp);
    rad.appendChild(ramme);
    const fasit = el('span', 'sp-skriv-fasit');
    fasit.hidden = true;
    rad.appendChild(fasit);
    felt.push(inp); fasiter.push(fasit);
    tabell.appendChild(rad);
  });
  f.appendChild(tabell);
  f.appendChild(melding);

  neste.onclick = () => { skriv.i++; skriv.i < skriv.grupper.length ? visSkriv() : visSkrivResultat(); };
  sjekk.onclick = () => {
    let riktige = 0;
    const aksenter = [];
    felt.forEach((inp, p) => {
      inp.readOnly = true;
      const fasit = G.endelser[p];
      const dom = vurderEndelse(inp.value, fasit);
      if(dom === 'galt'){
        inp.classList.add('sp-galt');
        fasiter[p].textContent = 'Riktig: -' + fasit;
        fasiter[p].hidden = false;
        skriv.bom.push(PERSON_NAVN[p] + ' (' + G.navn + '): -' + fasit);
      }else{
        riktige++;
        inp.classList.add('sp-riktig');
        gi('v:' + g + ':' + p);
        if(dom === 'aksent'){
          aksenter.push('-' + fasit);
          fasiter[p].textContent = 'Med aksent: -' + fasit;
          fasiter[p].hidden = false;
        }
      }
    });
    skriv.riktige += riktige; skriv.totalt += 6;
    melding.innerHTML = '';
    melding.appendChild(el('b', null, riktige === 6 ? '¡Perfecto! Alle seks!' : riktige + ' av 6 riktige'));
    melding.appendChild(document.createTextNode(G.navn + ' = ' + G.endelser.join(', ')
      + (aksenter.length ? '. Husk aksenten: ' + aksenter.join(', ') + '.' : '.')));
    melding.hidden = false;
    sjekk.hidden = true;
    if(document.activeElement) document.activeElement.blur();
    visKnapp(neste);
  };
  const k = el('div', 'sp-knapper');
  k.appendChild(sjekk); k.appendChild(neste);
  f.appendChild(k);
  /* Tastaturet opp med en gang paa nettbrett og PC. Paa telefon dekker
     det halve skjermen foer hun har sett oppgaven, saa der trykker hun
     selv i foerste rute. */
  if(window.innerWidth > 640) felt[0].focus();
}

function visSkrivResultat(){
  iRunde(false);
  const f = $('flate');
  f.innerHTML = '';
  const r = el('div', 'sp-resultat');
  const feilfri = skriv.riktige === skriv.totalt;
  const teller = skriv.grupper.length === 3;
  const st = lager.skriv;
  const forrigeRad = st.rad, forrigeStjerner = st.stjerner;
  if(teller){
    st.rad = feilfri ? st.rad + 1 : 0;
    st.stjerner = Math.max(st.stjerner, SKRIV_TRINN.filter(t => st.rad >= t).length);
    lagre();
  }
  const ny = st.stjerner > forrigeStjerner;
  r.appendChild(skrivStjerneBoks(ny));
  r.appendChild(el('p', 'sp-stort-tall', skriv.riktige + ' av ' + skriv.totalt));
  let tekst;
  if(!teller) tekst = feilfri ? 'Feilfritt! Velg alle tre gruppene for å samle stjerner.' : 'Bare runder med alle tre gruppene teller mot stjernene.';
  else if(ny) tekst = st.stjerner === 3 ? '¡Increíble! Tre stjerner – 15 på rad!' : '¡Una estrella nueva! ' + feilfrie(st.rad) + '!';
  else if(feilfri) tekst = '¡Perfecto! ' + stor(feilfrie(st.rad)) + '.';
  else if(forrigeRad) tekst = (skriv.totalt - skriv.riktige <= 2 ? 'Nesten! ' : '')
    + 'Rekka på ' + forrigeRad + ' starter på nytt – stjernene beholder du.';
  else tekst = skryt(skriv.riktige / skriv.totalt);
  r.appendChild(el('p', 'sp-skryt', tekst));
  const k = el('div', 'sp-knapper');
  const igjen = el('button', 'sp-knapp sp-tung', 'Nytt forsøk');
  igjen.onclick = () => startSkriv(skriv.grupper);
  const husk = el('button', 'sp-knapp', 'Se huskelappen');
  husk.onclick = () => visFane('husk');
  k.appendChild(igjen); k.appendChild(husk);
  r.appendChild(k);
  if(skriv.bom.length){
    const l = el('div', 'sp-fasitliste');
    l.appendChild(el('p', 'sp-undertittel', 'Disse skal du se på igjen'));
    skriv.bom.forEach(t => l.appendChild(el('div', 'sp-fasitrad', t)));
    r.appendChild(l);
  }
  f.appendChild(r);
  /* Paa telefon ligger kartet over resultatet - stjerna skal synes
     uten at hun maa rulle etter den. */
  if(window.innerWidth <= 640) f.scrollIntoView({ block:'start' });
}

   SETNINGER - ordbrikker i riktig rekkefoelge
   ================================================================ */
let setning = null;

function visSetningOppsett(){
  iRunde(false);
  const f = $('flate');
  f.innerHTML = '';
  f.appendChild(el('h2', 'sp-panel-tittel', 'Lag setninger'));
  f.appendChild(el('p', 'sp-ledetekst', 'Du ser setningen på norsk. Trykk på de spanske ordene i riktig rekkefølge. Pass på – det ligger en feil verbform der som felle! Trykk på et ord i linja for å ta det tilbake.'));
  const k = el('div', 'sp-knapper');

  start.onclick = () => startSetning(bland(SETNINGER));

  f.appendChild(k);

function startSetning(liste){
  setning = { liste, i:0, riktige:0, bom:[] };
  iRunde(true);
  visSetning();
}

const vask = s => s.toLowerCase().replace(/[.!?¡¿,]/g, '').trim();

function visSetning(){
  window.scrollTo(0, 0);
  const s = setning.liste[setning.i];
  const f = $('flate');
  f.innerHTML = '';
  const hode = el('div', 'sp-hode');
  hode.appendChild(el('span', 'sp-teller', 'Setning ' + (setning.i + 1) + ' av ' + setning.liste.length));
  f.appendChild(hode);
  f.appendChild(el('p', 'sp-norsk', s.no));

  const ord = s.es.split(' ');
  const brikkeTekst = ord.slice();
  /* Fella: samme verb i en annen person, med samme stor forbokstav. */
  if(s.verb != null){
    const v = VERB.find(x => x.inf === s.vInf);
    const andre = [0,1,2,3,4,5].filter(p => p !== s.p).map(p => form(v, p)).filter(x => x !== ord[s.verb].toLowerCase());
    let felle = en(andre);
    if(ord[s.verb][0] !== ord[s.verb][0].toLowerCase()) felle = stor(felle);
    brikkeTekst.push(felle);
  }

  const linje = el('div', 'sp-linje');
  const tom = el('span', 'sp-linje-tom', 'Trykk på ordene under …');
  linje.appendChild(tom);
  f.appendChild(linje);
  const brikker = el('div', 'sp-brikker');
  const valgt = [];
  function oppdaterLinje(){
    linje.innerHTML = '';
    if(!valgt.length) linje.appendChild(tom);
    valgt.forEach((b, i) => {
      const x = el('button', 'sp-brikke', b.textContent);
      x.onclick = () => { b.classList.remove('sp-brukt'); valgt.splice(i, 1); oppdaterLinje(); };
      linje.appendChild(x);
    });
    sjekk.disabled = !valgt.length;
  }
  bland(brikkeTekst).forEach(t => {
    const b = el('button', 'sp-brikke', t);
    b.onclick = () => { b.classList.add('sp-brukt'); valgt.push(b); oppdaterLinje(); };
    brikker.appendChild(b);
  });
  f.appendChild(brikker);

  const fasit = el('div', 'sp-fasit');
  fasit.hidden = true;
  f.appendChild(fasit);
  const k = el('div', 'sp-knapper');
  const sjekk = el('button', 'sp-knapp sp-tung', 'Sjekk');
  sjekk.disabled = true;
  const neste = el('button', 'sp-knapp sp-tung', setning.i + 1 < setning.liste.length ? 'Neste' : 'Se resultatet');
  neste.hidden = true;
  neste.onclick = () => { setning.i++; setning.i < setning.liste.length ? visSetning() : visSetningResultat(); };
  sjekk.onclick = () => {
    const svar = valgt.map(b => b.textContent).join(' ');
    const ok = vask(svar) === vask(s.es);
    sjekk.hidden = true;
    linje.querySelectorAll('button').forEach(x => x.disabled = true);
    brikker.querySelectorAll('button').forEach(x => x.disabled = true);
    if(ok){
      setning.riktige++;
      linje.classList.add('sp-riktig');
      if(s.fra != null) gi('f:' + s.fra);
      if(s.verb != null){ const v = VERB.find(x => x.inf === s.vInf); gi('v:' + v.gr + ':' + s.p); }
      fasit.innerHTML = '';
      fasit.appendChild(el('b', null, '¡Correcto!'));
      fasit.appendChild(document.createTextNode(s.es + '. = ' + s.no));
    }else{
      setning.bom.push(Object.assign({ svar }, s));
      fasit.innerHTML = '';
      fasit.appendChild(el('b', null, 'Riktig: ' + s.es + '.'));
      fasit.appendChild(document.createTextNode('Du skrev: ' + (svar || '–')));
    }
    fasit.hidden = false;
    visKnapp(neste);
  };
  k.appendChild(sjekk); k.appendChild(neste);
  f.appendChild(k);
}

function visSetningResultat(){
  iRunde(false);
  const f = $('flate');
  f.innerHTML = '';
  const r = el('div', 'sp-resultat');
  resultatTopp(r, setning.riktige, setning.liste.length);
  const k = el('div', 'sp-knapper');
  if(setning.bom.length){
    const igjen = el('button', 'sp-knapp sp-tung', 'Ta de ' + setning.bom.length + ' du bommet på');
    igjen.onclick = () => startSetning(bland(setning.bom.map(b => SETNINGER.find(x => x.es === b.es))));
    k.appendChild(igjen);
  }
  const ny = el('button', 'sp-knapp' + (setning.bom.length ? '' : ' sp-tung'), 'Alle på nytt');
  ny.onclick = () => startSetning(bland(SETNINGER));
  k.appendChild(ny);
  r.appendChild(k);
  f.appendChild(r);
}

/* ================================================================
   HUSKELAPPEN - tabellene fra heftet
   ================================================================ */
function tabell(tittel, rader, endKol){
  const t = el('table', 'sp-tabell');
  t.appendChild(el('caption', null, tittel));
  const tb = el('tbody');
  rader.forEach(r => {
    const tr = el('tr');
    r.forEach((c, i) => tr.appendChild(el('td', i === endKol ? 'sp-end' : '', c)));
    tb.appendChild(tr);
  });
  t.appendChild(tb);
  return t;
}
function visHusk(){
  iRunde(false);
  const f = $('flate');
  f.innerHTML = '';
  f.appendChild(el('h2', 'sp-panel-tittel', 'Huskelapp'));
  f.appendChild(el('p', 'sp-ledetekst', 'Du trenger ikke kunne alt. Lær mønstrene – ikke hvert verb.'));
  const l = el('div', 'sp-lapper');
  l.appendChild(tabell('Personlige pronomen', [
    ['yo','jeg'],['tú','du'],['él','han'],['ella','hun'],
    ['nosotros / nosotras','vi'],['vosotros / vosotras','dere'],['ellos / ellas','de']
  ]));
  l.appendChild(tabell('Slik presenterer du deg selv', FRASER.map(x => [x.es, x.no])));
  f.appendChild(l);
  const v = el('div', 'sp-lapper-verb');
  [['ar','hablar = å snakke'],['er','comer = å spise'],['ir','vivir = å bo']].forEach(([g, t]) => {
    const verb = VERB.find(x => x.inf === t.split(' ')[0]);
    v.appendChild(tabell(GRUPPER[g].navn + ': ' + t,
      PERSON_NAVN.map((p, i) => [p, '-' + GRUPPER[g].endelser[i], form(verb, i)]), 1));
  });
  f.appendChild(v);
  const regel = el('div', 'sp-regel');
  regel.innerHTML = '<b>Superkort huskeregel</b><br>-AR = o, as, a, amos, áis, an<br>-ER = o, es, e, emos, éis, en<br>-IR = o, es, e, imos, ís, en'
    + '<br><br>På spansk ser du ofte hvem som gjør noe på selve verbformen. Derfor kan pronomenet noen ganger droppes: <b>Hablo</b> español = Jeg snakker spansk.';
  f.appendChild(regel);
  const k = el('div', 'sp-knapper');
  const q = el('button', 'sp-knapp sp-tung', 'Test meg');
  q.onclick = () => visFane('quiz');
  k.appendChild(q);
  f.appendChild(k);
}
