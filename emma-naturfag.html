<style>
/* ============================================================
   NEAM - Naturfagspill for Emma
   Laget 1. november 2026, til proeven 2. november. Innholdet er
   puggearket «Stoffer og byggesteiner / Metoder og reaksjoner /
   Vitenskap og modeller» - 14 punkter, og ingenting utover det.

   TRE MAATER AA OEVE PAA DET SAMME:
     Quiz        - flervalg, med regnestykker i massetetthet og
                   periodesystemet generert fra en liten tabell
     Puggekort   - arkets egen metode: les maalet, forklar hoeyt,
                   se svaret, si selv om hun kunne det
     Sorter      - ett stoff eller eksempel av gangen inn i riktig boks

   FRAMDRIFT ER GEOGRAFI, IKKE PROSENT. De 14 punktene staar som ruter
   oeverst, gruppert som paa arket. Hver rute har tre prikker; et riktig
   svar eller et «Kunne det» tenner en. Tre prikker gjoer ruta gul.
   Et galt svar slukker ingenting - det skal ikke koste aa proeve.

   Samme ramme som grunnstoffspillet: gult (--lys) betyr «det der gikk
   bra», et galt svar er dust og overstroeket og aldri roedt, ingen
   Neam-firer (samtalen er en rask vei til fasiten), og veien ut er
   merket oppe til venstre og sveip tilbake.

   Framdriften ligger bare i localStorage paa enheten. Det er en
   oevingsside til en proeve, ikke data huset trenger.

   KLASSENAVN ER PREFIKSET `nf-`.
   ============================================================ */

:root{
  --messing:#B8873A;
  --messing-lys:#D9AE68;
  --lys:#F2C14E;
  --lys-glod:rgba(242,193,78,.75);
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; padding:0; width:100%; overflow-x:clip; color:var(--ink); }
body{
  font-family:'Archivo', system-ui, -apple-system, sans-serif;
  background:var(--side-bakgrunn);
  min-height:100vh;
}
.nf-side{ max-width:980px; margin:0 auto; padding:10px 12px calc(28px + env(safe-area-inset-bottom)); }
@media(min-width:700px){ .nf-side{ padding:18px 20px 36px; } }

/* ---------- Topplinja ---------- */
.nf-topp{ display:flex; align-items:center; gap:12px; margin-bottom:12px; flex-wrap:wrap; }
.nf-merke{ flex-shrink:0; display:block; width:56px; height:56px; }
.nf-merke img{ width:100%; height:100%; object-fit:contain; display:block; }
.nf-merke img[hidden]{ display:none; }
@media(min-width:700px){ .nf-merke{ width:84px; height:84px; } }
.nf-tittel{ margin:0; font-size:var(--t-stor); font-weight:700; line-height:1.15; }
.nf-tittel span{
  display:block; font-size:var(--t-etikett); font-weight:700;
  letter-spacing:.14em; text-transform:uppercase; color:var(--ink-soft);
}
.nf-faner{ display:flex; gap:4px; margin-left:auto; flex-wrap:wrap; justify-content:flex-end; }
@media(max-width:640px){
  .nf-faner{ margin-left:0; width:100%; justify-content:flex-start; gap:0; }
  .nf-fane{ padding:8px 12px 8px 0; }
}
.nf-fane{
  border:none; background:transparent; font-family:inherit; cursor:pointer;
  font-size:var(--t-meta); font-weight:700; letter-spacing:.06em;
  text-transform:uppercase; color:var(--ink-soft);
  padding:8px 10px; border-bottom:3px solid transparent;
}
.nf-fane.nf-valgt{ color:var(--ink); border-bottom-color:var(--messing); }

/* ---------- Panelet ---------- */
.nf-panel{
  background:var(--paper); border:2px solid var(--messing);
  border-radius:18px; box-shadow:var(--shadow);
  padding:14px; margin-bottom:14px;
}
@media(min-width:700px){ .nf-panel{ padding:18px; } }
.nf-panel-tittel{
  font-size:var(--t-meta); font-weight:700; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink); margin:0 0 10px;
}
.nf-ledetekst{ font-size:var(--t-meta); font-weight:600; color:var(--ink-soft); margin:0 0 12px; line-height:1.45; }

/* ---------- Kartet: de 14 punktene ---------- */
.nf-kart{ display:grid; grid-template-columns:1fr; gap:10px; }
@media(min-width:760px){ .nf-kart{ grid-template-columns:5fr 5fr 4fr; } }
.nf-del-navn{
  font-size:var(--t-etikett); font-weight:700; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-soft); margin:0 0 6px;
}
.nf-ruter{ display:flex; gap:6px; flex-wrap:wrap; }
.nf-rute{
  width:48px; height:52px; border-radius:10px; cursor:pointer; padding:0;
  border:2px solid var(--line); background:var(--boks-mild); color:var(--ink);
  font-family:inherit; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:5px;
}
.nf-rute:active{ transform:scale(.94); }
.nf-rute b{ font-size:var(--t-brod); font-weight:700; line-height:1; }
.nf-prikker3{ display:flex; gap:3px; }
.nf-prikker3 i{
  width:7px; height:7px; border-radius:50%; display:block;
  border:1.5px solid var(--boks-kant); background:transparent;
}
.nf-prikker3 i.nf-tent{ background:var(--lys); border-color:var(--messing-lys); }
.nf-rute.nf-mestret{
  border-color:var(--lys); background:rgba(242,193,78,.28);
  box-shadow:0 0 0 2px var(--lys-glod);
}
.nf-kart-sum{ margin:10px 0 0; font-size:var(--t-meta); font-weight:700; color:var(--ink-soft); }
/* Telefon: kartet tar en tredjedel av skjermen. Midt i en runde skal
   spoersmaalet staa oeverst uten rulling, saa kartet viker til runden
   er ferdig - det er paa oppsettet og resultatet det betyr noe. */
@media(max-width:640px){
  body.nf-i-runde .nf-kart-panel{ display:none; }
  .nf-ruter{ gap:5px; }
  .nf-rute{ width:44px; height:48px; }
  .nf-sporsmaal{ margin:10px 0 12px; }
  .nf-svar-knapp{ padding:13px 14px; }
  .nf-ting{ margin:10px auto 12px; padding:16px 12px; }
  .nf-boks{ min-height:72px; padding:9px 10px; }
  .nf-knapper .nf-knapp{ flex:1 1 auto; }
}

/* ---------- Knapper og valg ---------- */
.nf-knapp{
  font-family:inherit; font-size:var(--t-brod); font-weight:700;
  padding:11px 18px; border-radius:12px; cursor:pointer;
  border:2px solid var(--messing); background:var(--paper); color:var(--ink);
}
.nf-knapp:active{ transform:scale(.98); }
.nf-knapp.nf-tung{ background:var(--aksent); border-color:var(--aksent); color:#FFFFFF; }
.nf-knapp.nf-tung:active{ background:var(--aksent-moerk); }
.nf-knapp[disabled]{ opacity:.45; cursor:default; }
.nf-knapper{ display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; }

.nf-valg{ display:flex; flex-wrap:wrap; gap:8px; margin:6px 0 16px; }
.nf-velger{
  font-family:inherit; font-size:var(--t-brod); font-weight:700;
  padding:9px 16px; border-radius:999px; cursor:pointer;
  border:2px solid var(--line); background:var(--paper); color:var(--ink-soft);
}
.nf-velger.nf-pa{ border-color:var(--messing); color:var(--ink); background:var(--boks-mild); }
.nf-velger .nf-hake{ margin-right:6px; opacity:0; }
.nf-velger.nf-pa .nf-hake{ opacity:1; }
.nf-undertittel{
  font-size:var(--t-etikett); font-weight:700; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-soft); margin:4px 0 0;
}

/* ---------- Spoersmaal ---------- */
.nf-hode{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.nf-teller{
  font-size:var(--t-etikett); font-weight:700; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-soft);
}
.nf-lapp{
  font-size:var(--t-etikett); font-weight:700; letter-spacing:.06em;
  border:1px solid var(--boks-kant); background:var(--boks-mild);
  border-radius:999px; padding:3px 10px; color:var(--ink-soft);
}
/* «På rad» er gult fordi det er gult som betyr at noe gikk bra. */
.nf-rad{
  margin-left:auto; font-size:var(--t-meta); font-weight:700;
  background:rgba(242,193,78,.25); border:1px solid var(--lys);
  border-radius:999px; padding:3px 12px;
}
.nf-rad[hidden]{ display:none; }
.nf-rad.nf-pop{ animation:nfPop .5s ease; }
@keyframes nfPop{ 0%{ transform:scale(1); } 40%{ transform:scale(1.18); } 100%{ transform:scale(1); } }

.nf-sporsmaal{ font-size:var(--t-stor); font-weight:700; margin:12px 0 14px; line-height:1.3; }
.nf-svar{ display:grid; grid-template-columns:1fr; gap:10px; }
@media(min-width:620px){ .nf-svar{ grid-template-columns:1fr 1fr; } }
.nf-svar-knapp{
  font-family:inherit; font-size:var(--t-brod); font-weight:700; text-align:left;
  padding:14px 16px; border-radius:12px; cursor:pointer; line-height:1.35;
  border:2px solid var(--line); background:var(--paper); color:var(--ink);
}
.nf-svar-knapp:active{ transform:scale(.99); }
.nf-svar-knapp.nf-riktig{
  border-color:var(--lys); background:rgba(242,193,78,.22);
  box-shadow:0 0 0 3px var(--lys-glod);
}
.nf-svar-knapp.nf-galt{ opacity:.5; text-decoration:line-through; }
.nf-svar-knapp[disabled]{ cursor:default; }

.nf-fasit{
  margin-top:14px; font-size:var(--t-brod); font-weight:600; line-height:1.5;
  background:var(--boks-mild); border:1px solid var(--boks-kant);
  border-radius:12px; padding:12px 14px;
}
.nf-fasit[hidden]{ display:none; }
.nf-fasit b{ display:block; margin-bottom:2px; }

.nf-prikker{ display:flex; gap:5px; margin:12px 0 0; flex-wrap:wrap; }
.nf-prikker i{
  width:10px; height:10px; border-radius:50%; display:block;
  border:2px solid var(--line); background:transparent;
}
.nf-prikker i.nf-p-riktig{ background:var(--lys); border-color:var(--lys); }
.nf-prikker i.nf-p-bom{ background:var(--ink-soft); border-color:var(--ink-soft); opacity:.45; }
.nf-prikker i.nf-p-na{ border-color:var(--messing); }

/* ---------- Resultatet ---------- */
.nf-resultat{ text-align:center; }
.nf-stjerner{ display:flex; justify-content:center; gap:8px; margin:6px 0 12px; }
.nf-stjerne{ width:52px; height:52px; display:block; }
.nf-stjerne.nf-tom-stjerne{ filter:grayscale(1) opacity(.32); }
.nf-stjerne.nf-glod{ filter:drop-shadow(0 0 8px var(--lys-glod)); }
.nf-stort-tall{ font-size:var(--t-display); font-weight:700; line-height:1; margin:4px 0; }
.nf-skryt{ font-size:var(--t-stor); font-weight:700; margin:6px 0 4px; }
.nf-gitt{
  display:inline-block; margin:6px 0 4px;
  font-size:var(--t-meta); font-weight:700; letter-spacing:.06em;
  background:rgba(242,193,78,.25); border:1px solid var(--lys);
  border-radius:999px; padding:5px 14px;
}
.nf-resultat .nf-knapper{ justify-content:center; }
.nf-fasitliste{ text-align:left; margin-top:18px; }
.nf-fasitrad{ padding:9px 0; border-top:1px solid var(--line); font-size:var(--t-meta); line-height:1.45; }
.nf-fasitrad b{ display:block; font-size:var(--t-brod); }
.nf-fasitrad s{ color:var(--ink-soft); }

/* ---------- Puggekort ---------- */
.nf-kort{
  border:2px solid var(--boks-kant); border-radius:16px;
  background:var(--bg-solid); padding:18px 16px; min-height:180px;
}
.nf-kort-maal{ font-size:var(--t-stor); font-weight:700; line-height:1.3; margin:8px 0 0; }
.nf-kort-tips{ font-size:var(--t-meta); font-weight:600; color:var(--ink-soft); margin:12px 0 0; }
.nf-kort-svar{
  margin-top:16px; padding-top:14px; border-top:2px dashed var(--boks-kant);
  font-size:var(--t-brod); font-weight:600; line-height:1.55;
}
.nf-kort-svar[hidden]{ display:none; }
.nf-kort-svar p{ margin:0 0 8px; }
.nf-kort-svar ul{ margin:0 0 8px; padding-left:20px; }
.nf-kort-svar dl{ margin:0; }
.nf-kort-svar dt{ font-weight:700; margin-top:8px; }
.nf-kort-svar dd{ margin:0; }

/* ---------- Sorter ---------- */
.nf-sett{ display:grid; grid-template-columns:1fr; gap:10px; }
@media(min-width:620px){ .nf-sett{ grid-template-columns:1fr 1fr; } }
.nf-sett-knapp{
  border:2px solid var(--line); border-radius:14px; padding:14px;
  background:var(--boks-mild); cursor:pointer; font-family:inherit;
  text-align:left; color:var(--ink);
}
.nf-sett-knapp:active{ transform:scale(.99); }
.nf-sett-knapp h3{
  margin:0 0 4px; font-size:var(--t-meta); font-weight:700;
  letter-spacing:.1em; text-transform:uppercase;
}
.nf-sett-knapp p{ margin:0; font-size:var(--t-meta); font-weight:600; color:var(--ink-soft); line-height:1.4; }
.nf-sett-knapp .nf-rekord{ display:block; margin-top:6px; font-size:var(--t-etikett); font-weight:700; color:var(--ink-soft); }

.nf-ting{
  margin:14px auto 16px; max-width:460px; text-align:center;
  border:2px solid var(--messing); border-radius:16px; background:var(--bg-solid);
  padding:20px 16px; font-size:var(--t-stor); font-weight:700; line-height:1.3;
  box-shadow:var(--shadow);
}
.nf-ting.nf-inn{ animation:nfInn .28s ease; }
@keyframes nfInn{ from{ opacity:0; transform:translateY(-10px) scale(.97); } to{ opacity:1; transform:none; } }
.nf-bokser{ display:grid; gap:10px; grid-template-columns:repeat(var(--nf-kol, 2), 1fr); }
@media(max-width:560px){ .nf-bokser{ grid-template-columns:1fr 1fr; } }
.nf-boks{
  font-family:inherit; cursor:pointer; text-align:left; color:var(--ink);
  border:2px solid var(--line); border-radius:14px; background:var(--paper);
  padding:10px 12px; min-height:92px; display:flex; flex-direction:column; gap:6px;
}
.nf-boks:active{ transform:scale(.98); }
.nf-boks[disabled]{ cursor:default; }
.nf-boks-navn{ font-size:var(--t-brod); font-weight:700; }
.nf-boks ul{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:3px; }
.nf-boks li{ font-size:var(--t-etikett); font-weight:600; color:var(--ink-soft); line-height:1.3; }
.nf-boks li.nf-li-bom{ text-decoration:underline dotted; }
.nf-boks.nf-riktig{ border-color:var(--lys); background:rgba(242,193,78,.22); box-shadow:0 0 0 3px var(--lys-glod); }
.nf-boks.nf-galt{ opacity:.5; }
</style>
</head>
<body>

<div class="nf-side">

  <div class="nf-topp">
    <a class="nf-merke" href="/emma.html" aria-label="Til Emma dash">
      <img src="/bilder/ikoner/emma.png?v=2" alt="Emma dash" width="512" height="508"
           onerror="this.hidden = true">
    </a>
    <h1 class="nf-tittel">Naturfag<span>Emmas puggeark</span></h1>
    <div class="nf-faner">
      <button class="nf-fane nf-valgt" id="faneQuiz" onclick="visFane('quiz')">Quiz</button>
      <button class="nf-fane" id="faneKort" onclick="visFane('kort')">Puggekort</button>
      <button class="nf-fane" id="faneSorter" onclick="visFane('sorter')">Sorter</button>
    </div>
  </div>

  <div class="nf-panel nf-kart-panel">
    <div class="nf-kart" id="kart"></div>
    <p class="nf-kart-sum" id="kartSum"></p>
  </div>

  <div class="nf-panel" id="flate"></div>

</div>

<script>
/* ================================================================
   INNHOLDET - rett fra puggearket
   ================================================================ */
const DELER = [
  { navn:'Stoffer og byggesteiner', punkter:[1,2,3,4,5] },
  { navn:'Metoder og reaksjoner',   punkter:[6,7,8,9,10] },
  { navn:'Vitenskap og modeller',   punkter:[11,12,13,14] }
];

/* Puggekortene. `svar` er HTML og skrevet her, aldri fra brukeren. */
const PUNKTER = {
  1:{ kort:'Grunnstoff og kjemisk forbindelse',
      maal:'Beskrive forskjellen på grunnstoff og kjemiske forbindelser.',
      svar:'<p>Et <b>grunnstoff</b> består av bare én type atomer, for eksempel oksygen (O).</p><p>En <b>kjemisk forbindelse</b> består av minst to ulike typer atomer som er bundet sammen.</p>',
      kort_fasit:'Grunnstoff: bare én type atomer. Kjemisk forbindelse: minst to ulike typer atomer bundet sammen.' },
  2:{ kort:'Rent stoff og stoffblanding',
      maal:'Beskrive forskjellen på rene stoffer og stoffblandinger.',
      svar:'<p>Et <b>rent stoff</b> består av bare ett stoff, for eksempel rent vann.</p><p>En <b>stoffblanding</b> består av to eller flere stoffer blandet sammen, for eksempel saltvann.</p>',
      kort_fasit:'Rent stoff: bare ett stoff (rent vann). Stoffblanding: to eller flere stoffer blandet sammen (saltvann).' },
  3:{ kort:'Atom og molekyl',
      maal:'Beskrive forskjellen på atomer og molekyler.',
      svar:'<p>Et <b>atom</b> er en bitte liten byggestein som stoffer er laget av.</p><p>Et <b>molekyl</b> består av to eller flere atomer som er bundet sammen. Eksempel: H₂O.</p>',
      kort_fasit:'Atom: en bitte liten byggestein. Molekyl: to eller flere atomer bundet sammen, som H₂O.' },
  4:{ kort:'Periodesystemet',
      maal:'Bruke periodesystemet til å lese av informasjon om grunnstoffer.',
      svar:'<dl><dt>Atomnummer</dt><dd>Forteller hvor mange protoner et grunnstoff har.</dd><dt>Kjemisk symbol</dt><dd>Forkortelsen for grunnstoffet.</dd><dt>Atommasse</dt><dd>Forteller hvor mye masse et atom har.</dd></dl>',
      kort_fasit:'Atomnummer = antall protoner. Kjemisk symbol = forkortelsen. Atommasse = hvor mye masse et atom har.' },
  5:{ kort:'Egenskaper ved stoffer',
      maal:'Beskrive ulike egenskaper ved stoffer og bruke denne kunnskapen til å skille stoffer fra hverandre.',
      svar:'<p>Stoffer kan ha ulik <b>farge, lukt, massetetthet, løselighet og kokepunkt</b>. Noen er også <b>magnetiske</b>.</p><p>Vi kan bruke forskjellene til å skille stoffene. For eksempel kan vi bruke en magnet til å trekke jern ut av en blanding med sand.</p>',
      kort_fasit:'Farge, lukt, massetetthet, løselighet, kokepunkt – og noen er magnetiske. Magnet trekker jern ut av sand.' },
  6:{ kort:'Metoder for å skille stoffer',
      maal:'Bruke ulike metoder for å skille stoffer fra hverandre.',
      svar:'<dl><dt>Filtrering</dt><dd>Et filter skiller et fast stoff fra væske, for eksempel sand fra vann.</dd><dt>Fordamping</dt><dd>Væsker fordamper, og det faste stoffet blir igjen. For eksempel salt fra saltvann.</dd><dt>Destillasjon</dt><dd>En væske fordampes og kjøles ned igjen. Kan skille rent vann fra saltvann.</dd><dt>Magnet</dt><dd>Magnetiske stoffer som jern trekkes ut av blandingen.</dd></dl>',
      kort_fasit:'Filtrering: sand fra vann. Fordamping: salt blir igjen. Destillasjon: rent vann fra saltvann. Magnet: jern ut.' },
  7:{ kort:'Massetetthet',
      maal:'Beregne massetetthet og forklare hva som menes med begrepet.',
      svar:'<p><b>Massetetthet = masse : volum</b></p><p>Massetetthet forteller hvor mye masse et stoff har i forhold til volumet.</p>',
      kort_fasit:'Massetetthet = masse : volum. Den forteller hvor mye masse stoffet har i forhold til volumet.' },
  8:{ kort:'Kjemisk reaksjon',
      maal:'Forklare hva som skjer i en kjemisk reaksjon og beskrive kjennetegn på at en kjemisk reaksjon har skjedd.',
      svar:'<p>En kjemisk reaksjon skjer når stoffer reagerer med hverandre og <b>danner nye stoffer</b>.</p><p>Kjennetegn kan være:</p><ul><li>Fargeforandring</li><li>Gassbobler</li><li>Temperaturforandring</li><li>Lys eller dannelse av fast stoff (utfelling)</li></ul>',
      kort_fasit:'Nye stoffer dannes. Kjennetegn: fargeforandring, gassbobler, temperaturforandring, lys eller utfelling.' },
  9:{ kort:'Kjemisk eller fysisk',
      maal:'Forklare hva som er forskjellen på en kjemisk reaksjon og en fysisk forandring, og komme med eksempler på begge.',
      svar:'<p><b>Kjemisk reaksjon:</b> Det dannes nye stoffer.</p><p><b>Fysisk forandring:</b> Stoffet bytter form, men er det samme stoffet:</p><ul><li>Fast form</li><li>Væske</li><li>Gass</li></ul>',

const LOKAL_NOKKEL = 'neam-emma-naturfag:v1';
let lager = { punkt:{}, rekordRad:0, sortRekord:{} };
try{
  const t = localStorage.getItem(LOKAL_NOKKEL);
  if(t) lager = Object.assign(lager, JSON.parse(t));
}catch(e){}
function lagre(){
  try{ localStorage.setItem(LOKAL_NOKKEL, JSON.stringify(lager)); }catch(e){}
}
function poeng(p){ return Math.min(3, lager.punkt[p] || 0); }
function gi(p){
  lager.punkt[p] = Math.min(3, (lager.punkt[p] || 0) + 1);
  lagre(); tegnKart();
}

const $ = id => document.getElementById(id);
function bland(a){
  const b = a.slice();
  for(let i = b.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [b[i], b[j]] = [b[j], b[i]];
  }
  return b;
}
function el(tag, kl, tekst){
  const e = document.createElement(tag);
  if(kl) e.className = kl;
  if(tekst != null) e.textContent = tekst;
  return e;
}
function stjerneBilde(tent, glod){
  const i = document.createElement('img');
  i.src = '/bilder/spill/stjerne.webp?v=1';
  i.alt = ''; i.width = 52; i.height = 52;
  i.className = 'nf-stjerne' + (tent ? '' : ' nf-tom-stjerne') + (glod ? ' nf-glod' : '');
  return i;
}

  document.body.classList.toggle('nf-i-runde', !!pa);

  requestAnimationFrame(() => k.scrollIntoView({ behavior:'smooth', block:'nearest' }));

function stjerner(andel){ return andel >= 1 ? 3 : andel >= .8 ? 2 : andel >= .5 ? 1 : 0; }

  if(andel >= 1) return 'Alt riktig! Du er klar, Emma!';

function tegnKart(){
  const kart = $('kart');
  kart.innerHTML = '';
  let mestret = 0;
  DELER.forEach(d => {
    const del = el('div');
    del.appendChild(el('p', 'nf-del-navn', d.navn));
    const ruter = el('div', 'nf-ruter');
    d.punkter.forEach(p => {
      const n = poeng(p);
      if(n >= 3) mestret++;
      const r = el('button', 'nf-rute' + (n >= 3 ? ' nf-mestret' : ''));
      r.setAttribute('aria-label', 'Punkt ' + p + ': ' + PUNKTER[p].kort + ' – ' + n + ' av 3');
      r.title = PUNKTER[p].kort;
      r.appendChild(el('b', null, String(p)));
      const pr = el('span', 'nf-prikker3');
      for(let i = 0; i < 3; i++) pr.appendChild(el('i', i < n ? 'nf-tent' : ''));
      r.appendChild(pr);
      r.onclick = () => startKort([p]);
      ruter.appendChild(r);
    });
    del.appendChild(ruter);
    kart.appendChild(del);
  });
  $('kartSum').textContent = mestret === 14
    ? 'Alle 14 punktene er gule. Du kan hele arket!'
    : mestret + ' av 14 punkter er gule. Hvert riktig svar tenner en prikk – trykk på et punkt for å øve på det.';
}

    const b = el('button', 'nf-velger' + (antallValgt === n ? ' nf-pa' : ''));
    b.appendChild(el('span', 'nf-hake', '✓'));
    b.appendChild(document.createTextNode(t));
    b.onclick = () => {
      antallValgt = n;
      v.querySelectorAll('.nf-velger').forEach(x => x.classList.remove('nf-pa'));
      b.classList.add('nf-pa');
    };
    v.appendChild(b);
  });
  f.appendChild(v);
  if(lager.rekordRad) f.appendChild(el('p', 'nf-ledetekst', 'Rekord: ' + lager.rekordRad + ' riktige på rad.'));
  const k = el('div', 'nf-knapper');
  const start = el('button', 'nf-knapp nf-tung', 'Start quizen');
  start.onclick = () => startQuiz(lagSporsmaal(valgtePunkter(), antallValgt));
  k.appendChild(start);
  f.appendChild(k);
}

/* Massetetthet: tallene velges saa svaret blir et helt tall. De gale
   svarene er de vanlige feilene - gange i stedet for dele, legge sammen,
   eller dele feil vei. */
function lagMassetetthet(){
  const rho = bland([2,3,4,5,6,8,10])[0];
  const V = bland([2,3,4,5,10,20])[0];
  const m = rho * V;
  const ting = bland(['En stein','En metallkloss','En klump leire','En bit tre','En kule'])[0];
  const fmt = x => (Math.round(x * 100) / 100).toString().replace('.', ',') + ' g/cm³';
  const gale = [...new Set([fmt(m * V), fmt(m + V), fmt(V / m)])].filter(x => x !== fmt(rho));
  return { p:7,
    q: ting + ' har masse ' + m + ' g og volum ' + V + ' cm³. Hva er massetettheten?',
    riktig: fmt(rho), gale: gale.slice(0, 3),
    fasit: 'Massetetthet = masse : volum = ' + m + ' : ' + V + ' = ' + fmt(rho) + '.' };
}
function lagPeriode(){
  const [navn, sym, nr] = bland(STOFFER)[0];
  const andre = bland(STOFFER.filter(s => s[1] !== sym)).slice(0, 3);
  const stor = navn[0].toUpperCase() + navn.slice(1);
  const typ = Math.floor(Math.random() * 4);
  if(typ === 0) return { p:4, q:'Hva er det kjemiske symbolet for ' + navn + '?',
    riktig:sym, gale:andre.map(s => s[1]),
    fasit:'Det kjemiske symbolet er forkortelsen: ' + navn + ' = ' + sym + '.' };
  if(typ === 1) return { p:4, q:'Hvilket grunnstoff har symbolet ' + sym + '?',
    riktig:stor, gale:andre.map(s => s[0][0].toUpperCase() + s[0].slice(1)),
    fasit:sym + ' er ' + navn + '.' };
  if(typ === 2) return { p:4, q:stor + ' har atomnummer ' + nr + '. Hvor mange protoner har et ' + navn + 'atom?',
    riktig:String(nr), gale:[...new Set([String(nr * 2), String(nr + 1), String(Math.max(1, nr - 1))])].filter(x => x !== String(nr)),
    fasit:'Atomnummeret forteller hvor mange protoner grunnstoffet har: ' + nr + '.' };
  return { p:4, q:'Et grunnstoff har ' + nr + ' protoner. Hvilket er det?',
    riktig:stor, gale:andre.map(s => s[0][0].toUpperCase() + s[0].slice(1)),
    fasit:'Antall protoner er atomnummeret. Atomnummer ' + nr + ' er ' + navn + ' (' + sym + ').' };
}

function lagSporsmaal(punkter, antall){
  let pool = SPORSMAAL.filter(s => punkter.includes(s[0]))
    .map(s => ({ p:s[0], q:s[1], riktig:s[2], gale:s[3] }));
  if(punkter.includes(4)) for(let i = 0; i < 5; i++) pool.push(lagPeriode());
  if(punkter.includes(7)) for(let i = 0; i < 4; i++) pool.push(lagMassetetthet());
  /* Punktene hun kan minst av, kommer foerst i koen foer den kuttes -
     men innenfor samme nivaa er rekkefoelgen tilfeldig. */
  pool = bland(pool).sort((a, b) => poeng(a.p) - poeng(b.p));
  if(antall) pool = pool.slice(0, antall);
  return bland(pool);
}

function startQuiz(liste){
  quiz = { liste, i:0, riktige:0, rad:0, bom:[], svar:[] };
  iRunde(true);
  visSporsmaal();
}

function visSporsmaal(){
  const s = quiz.liste[quiz.i];
  if(document.body.classList.contains('nf-i-runde')) window.scrollTo(0, 0);
  const f = $('flate');
  f.innerHTML = '';
  const hode = el('div', 'nf-hode');
  hode.appendChild(el('span', 'nf-teller', 'Spørsmål ' + (quiz.i + 1) + ' av ' + quiz.liste.length));
  hode.appendChild(el('span', 'nf-lapp', 'Punkt ' + s.p + ' · ' + PUNKTER[s.p].kort));
  const rad = el('span', 'nf-rad', quiz.rad + ' på rad');
  rad.hidden = quiz.rad < 2;
  hode.appendChild(rad);
  f.appendChild(hode);
  f.appendChild(el('p', 'nf-sporsmaal', s.q));

  const svar = el('div', 'nf-svar');
  const alle = bland([s.riktig, ...s.gale]);
  const fasit = el('div', 'nf-fasit');
  fasit.hidden = true;
  const neste = el('button', 'nf-knapp nf-tung', quiz.i + 1 < quiz.liste.length ? 'Neste' : 'Se resultatet');
  neste.hidden = true;
  neste.onclick = () => { quiz.i++; quiz.i < quiz.liste.length ? visSporsmaal() : visResultat(); };

  alle.forEach(a => {
    const b = el('button', 'nf-svar-knapp', a);
    b.onclick = () => {
      svar.querySelectorAll('button').forEach(x => {
        x.disabled = true;
        if(x.textContent === s.riktig) x.classList.add('nf-riktig');
      });
      const ok = a === s.riktig;
      quiz.svar.push(ok);
      if(ok){
        quiz.riktige++; quiz.rad++;
        gi(s.p);
        if(quiz.rad > (lager.rekordRad || 0)){ lager.rekordRad = quiz.rad; lagre(); }
        rad.textContent = quiz.rad + ' på rad';
        rad.hidden = quiz.rad < 2;
        if(!rad.hidden){ rad.classList.remove('nf-pop'); void rad.offsetWidth; rad.classList.add('nf-pop'); }
      }else{
        quiz.rad = 0; rad.hidden = true;
        b.classList.add('nf-galt');
        quiz.bom.push(Object.assign({ valgt:a }, s));
        fasit.innerHTML = '';
        fasit.appendChild(el('b', null, 'Riktig svar: ' + s.riktig));
        fasit.appendChild(document.createTextNode(s.fasit || PUNKTER[s.p].kort_fasit));
        fasit.hidden = false;
      }
      tegnPrikker();
      visKnapp(neste);
    };
    svar.appendChild(b);
  });
  f.appendChild(svar);
  f.appendChild(fasit);
  const k = el('div', 'nf-knapper');
  k.appendChild(neste);
  f.appendChild(k);
  const prikker = el('div', 'nf-prikker');
  f.appendChild(prikker);
  function tegnPrikker(){
    prikker.innerHTML = '';
    quiz.liste.forEach((_, i) => {
      const kl = i < quiz.svar.length ? (quiz.svar[i] ? 'nf-p-riktig' : 'nf-p-bom') : (i === quiz.i ? 'nf-p-na' : '');
      prikker.appendChild(el('i', kl));
    });
  }
  tegnPrikker();
}

function visResultat(){
  iRunde(false);
  window.scrollTo(0, 0);
  const f = $('flate');
  f.innerHTML = '';
  const andel = quiz.riktige / quiz.liste.length;
  const n = stjerner(andel);
  const r = el('div', 'nf-resultat');
  const st = el('div', 'nf-stjerner');
  for(let i = 0; i < 3; i++) st.appendChild(stjerneBilde(i < n, n === 3));
  r.appendChild(st);
  r.appendChild(el('p', 'nf-stort-tall', quiz.riktige + ' av ' + quiz.liste.length));
  r.appendChild(el('p', 'nf-skryt', skryt(andel)));
  if(lager.rekordRad >= 3) r.appendChild(el('span', 'nf-gitt', 'Rekord: ' + lager.rekordRad + ' på rad'));
  const k = el('div', 'nf-knapper');
  if(quiz.bom.length){
    const igjen = el('button', 'nf-knapp nf-tung', 'Ta de ' + quiz.bom.length + ' du bommet på');
    /* Massetetthet og periodesystemet faar nye tall - ellers puggers
       svaret og ikke regnemaaten. */
    igjen.onclick = () => startQuiz(bland(quiz.bom.map(b => b.p === 7 && b.fasit ? lagMassetetthet()
      : b.p === 4 && b.fasit ? lagPeriode() : { p:b.p, q:b.q, riktig:b.riktig, gale:b.gale })));
    k.appendChild(igjen);
  }
  const ny = el('button', 'nf-knapp' + (quiz.bom.length ? '' : ' nf-tung'), 'Ny runde');
  ny.onclick = visQuizOppsett;
  k.appendChild(ny);
  r.appendChild(k);
  if(quiz.bom.length){
    const l = el('div', 'nf-fasitliste');
    l.appendChild(el('p', 'nf-undertittel', 'Disse skal du se på igjen'));
    quiz.bom.forEach(b => {
      const rad = el('div', 'nf-fasitrad');
      rad.appendChild(el('b', null, b.q));
      rad.appendChild(document.createTextNode('Riktig: ' + b.riktig + ' · Du svarte: '));
      rad.appendChild(el('s', null, b.valgt));
      l.appendChild(rad);
    });
    r.appendChild(l);
  }
  f.appendChild(r);
}

/* ================================================================
   PUGGEKORT - arkets egen metode
   ================================================================ */
let kort = null;

function visKortOppsett(){
  iRunde(false);
  const f = $('flate');
  f.innerHTML = '';
  f.appendChild(el('h2', 'nf-panel-tittel', 'Puggekort'));
  f.appendChild(el('p', 'nf-ledetekst', 'Les målet. Forklar høyt med egne ord. Snu kortet og se om du hadde det med. Kortene du ikke kunne, kommer tilbake til du kan dem.'));
  f.appendChild(el('p', 'nf-undertittel', 'Hva'));
  f.appendChild(delVelger());
  const k = el('div', 'nf-knapper');
  const start = el('button', 'nf-knapp nf-tung', 'Start');
  start.onclick = () => startKort(valgtePunkter());
  k.appendChild(start);
  f.appendChild(k);
}

function startKort(punkter){
  if(fane !== 'kort'){
    fane = 'kort';
    ['Quiz','Kort','Sorter'].forEach(n => $('fane' + n).classList.toggle('nf-valgt', n === 'Kort'));
  }
  kort = { ko:punkter.slice(), totalt:punkter.length, kunne:0, runder:0 };
  iRunde(true);
  visKort();
  if(window.innerWidth > 640) $('flate').scrollIntoView({ behavior:'smooth', block:'start' });
}

function visKort(){
  const f = $('flate');
  f.innerHTML = '';
  if(!kort.ko.length){
    iRunde(false);
    window.scrollTo(0, 0);
    const r = el('div', 'nf-resultat');
    const st = el('div', 'nf-stjerner');
    st.appendChild(stjerneBilde(true, true));
    r.appendChild(st);
    r.appendChild(el('p', 'nf-skryt', kort.totalt === 1 ? 'Det kortet sitter!' : 'Du kunne alle ' + kort.totalt + '!'));
    r.appendChild(el('p', 'nf-ledetekst', kort.runder > kort.totalt
      ? 'Noen tok et par runder – sånn er det å pugge. Nå sitter de.'
      : 'Alle på første forsøk. Sterkt!'));
    const k = el('div', 'nf-knapper');
    const q = el('button', 'nf-knapp nf-tung', 'Ta en quiz');
    q.onclick = () => visFane('quiz');
    const igjen = el('button', 'nf-knapp', 'Nye kort');
    igjen.onclick = visKortOppsett;
    k.appendChild(q); k.appendChild(igjen);
    r.appendChild(k);
    f.appendChild(r);
    return;
  }
  const p = kort.ko[0];
  const P = PUNKTER[p];
  const hode = el('div', 'nf-hode');
  hode.appendChild(el('span', 'nf-teller', (kort.totalt - kort.ko.length + 1 > kort.totalt ? kort.totalt : kort.totalt - kort.ko.length + 1) + ' av ' + kort.totalt + ' kort'));
  hode.appendChild(el('span', 'nf-lapp', 'Punkt ' + p));
  f.appendChild(hode);

  const k = el('div', 'nf-kort');
  k.style.marginTop = '12px';
  k.appendChild(el('p', 'nf-undertittel', P.kort));
  k.appendChild(el('p', 'nf-kort-maal', P.maal));
  k.appendChild(el('p', 'nf-kort-tips', 'Forklar høyt med egne ord før du snur kortet.'));
  const svar = el('div', 'nf-kort-svar');
  svar.innerHTML = P.svar;
  svar.hidden = true;
  k.appendChild(svar);
  f.appendChild(k);

  const kn = el('div', 'nf-knapper');
  const snu = el('button', 'nf-knapp nf-tung', 'Snu kortet');
  const kunne = el('button', 'nf-knapp nf-tung', 'Jeg kunne det');
  const mer = el('button', 'nf-knapp', 'Øv mer på dette');
  kunne.hidden = true; mer.hidden = true;
  snu.onclick = () => {
    svar.hidden = false; snu.hidden = true; mer.hidden = false;
    visKnapp(kunne);
  };
  kunne.onclick = () => { kort.runder++; kort.kunne++; gi(p); kort.ko.shift(); visKort(); };
  /* Kortet legges litt bak i bunken, ikke rett bakerst - da kommer det
     igjen mens det ennaa er ferskt. */
  mer.onclick = () => {
    kort.runder++;
    const c = kort.ko.shift();
    kort.ko.splice(Math.min(2, kort.ko.length), 0, c);
    visKort();
  };
  kn.appendChild(snu); kn.appendChild(kunne); kn.appendChild(mer);
  f.appendChild(kn);
}

/* ================================================================
   SORTER
   ================================================================ */
let sort = null;

function visSorterValg(){
  iRunde(false);
  const f = $('flate');
  f.innerHTML = '';
  f.appendChild(el('h2', 'nf-panel-tittel', 'Sorter'));
  f.appendChild(el('p', 'nf-ledetekst', 'Ett stoff eller eksempel kommer om gangen. Trykk på boksen det hører hjemme i.'));
  const g = el('div', 'nf-sett');
  SORTERINGER.forEach(s => {
    const b = el('button', 'nf-sett-knapp');
    b.appendChild(el('h3', null, s.navn));
    b.appendChild(el('p', null, s.tekst));
    const rek = lager.sortRekord[s.id];
    if(rek != null) b.appendChild(el('span', 'nf-rekord', 'Best: ' + rek + ' av ' + s.ting.length));
    b.onclick = () => startSorter(s);
    g.appendChild(b);
  });
  f.appendChild(g);
}

function startSorter(s){
  sort = { s, ko:bland(s.ting), i:0, riktige:0, i_boks:s.bokser.map(() => []) };
  iRunde(true);
  visSorter();
}

function visSorter(){
  const s = sort.s;
  window.scrollTo(0, 0);
  const f = $('flate');
  f.innerHTML = '';
  const hode = el('div', 'nf-hode');
  hode.appendChild(el('span', 'nf-teller', s.navn + ' · ' + Math.min(sort.i + 1, sort.ko.length) + ' av ' + sort.ko.length));
  hode.appendChild(el('span', 'nf-lapp', 'Punkt ' + s.punkt));
  f.appendChild(hode);

  if(sort.i >= sort.ko.length) return visSorterResultat();

  const [navn, riktig, forkl] = sort.ko[sort.i];
  const ting = el('div', 'nf-ting nf-inn', navn);
  f.appendChild(ting);

  const bokser = el('div', 'nf-bokser');
  bokser.style.setProperty('--nf-kol', Math.min(s.bokser.length, 3));
  const fasit = el('div', 'nf-fasit');
  fasit.hidden = true;
  const neste = el('button', 'nf-knapp nf-tung', 'Neste');
  neste.hidden = true;
  neste.onclick = () => { sort.i++; visSorter(); };

  s.bokser.forEach((bn, bi) => {
    const b = el('button', 'nf-boks');
    b.appendChild(el('span', 'nf-boks-navn', bn));
    const ul = el('ul');
    sort.i_boks[bi].forEach(([t, bom]) => ul.appendChild(el('li', bom ? 'nf-li-bom' : '', t)));
    b.appendChild(ul);
    b.onclick = () => {
      bokser.querySelectorAll('.nf-boks').forEach(x => x.disabled = true);
      const ok = bi === riktig;
      const rb = bokser.children[riktig];
      rb.classList.add('nf-riktig');
      rb.querySelector('ul').appendChild(el('li', ok ? '' : 'nf-li-bom', navn));
      sort.i_boks[riktig].push([navn, !ok]);
      if(ok){
        sort.riktige++;
        /* Et riktig svar tenner ikke prikken her - da ville ett sett
           paa ti ting gjort et helt punkt gult. Prikken kommer naar
           settet er ferdig og nesten feilfritt. */
        setTimeout(() => { sort.i++; visSorter(); }, 650);
      }else{
        b.classList.add('nf-galt');
        fasit.innerHTML = '';
        fasit.appendChild(el('b', null, navn + ' hører til ' + s.bokser[riktig].toLowerCase() + '.'));
        if(forkl) fasit.appendChild(document.createTextNode(forkl));
        fasit.hidden = false;
        visKnapp(neste);
      }
    };
    bokser.appendChild(b);
  });
  f.appendChild(bokser);
  f.appendChild(fasit);
  const k = el('div', 'nf-knapper');
  k.appendChild(neste);
  f.appendChild(k);
}

function visSorterResultat(){
  iRunde(false);
  window.scrollTo(0, 0);
  const s = sort.s;
  const f = $('flate');
  const tot = sort.ko.length;
  const andel = sort.riktige / tot;
  if(andel >= .8) gi(s.punkt);
  if(lager.sortRekord[s.id] == null || sort.riktige > lager.sortRekord[s.id]){
    lager.sortRekord[s.id] = sort.riktige; lagre();
  }
  const r = el('div', 'nf-resultat');
  const n = stjerner(andel);
  const st = el('div', 'nf-stjerner');
  for(let i = 0; i < 3; i++) st.appendChild(stjerneBilde(i < n, n === 3));
  r.appendChild(st);
  r.appendChild(el('p', 'nf-stort-tall', sort.riktige + ' av ' + tot));
  r.appendChild(el('p', 'nf-skryt', skryt(andel)));
  const k = el('div', 'nf-knapper');
  const igjen = el('button', 'nf-knapp nf-tung', 'En gang til');
  igjen.onclick = () => startSorter(s);
  const andre = el('button', 'nf-knapp', 'Velg en annen');
  andre.onclick = visSorterValg;
  k.appendChild(igjen); k.appendChild(andre);
  r.appendChild(k);
  f.appendChild(r);
}

tegnKart();
visQuizOppsett();
