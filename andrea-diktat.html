<!DOCTYPE html>
<html lang="no">
<head>

<title>Diktat – Neam</title>
<link rel="apple-touch-icon" href="/bilder/neam-robot.png">

<style>
/* ============================================================
   NEAM – Diktat for Andrea
   Laget 12. september 2026. Lenket fra Andrea dash, ved siden
   av mattespillet.

   Neam leser opp ukas ord. Hun skriver dem paa et ark han selv
   har laget - ett tegn i hver rute - og tar bilde av arket naar
   hun er ferdig. Da leser han arket og gir stjerner.

   HVORFOR RUTER: uten dem maa modellen selv finne hvor én
   bokstav slutter og den neste begynner i barneskrift, og en
   feilsegmentert bokstav blir til en skrivefeil som ikke finnes.
   Med ruter er spoersmaalet «hva staar i denne ruta», og svaret
   er én bokstav per rute i fast rekkefoelge. Da eier VI
   plasseringen: markeringen under bildet foelger samme rutenett,
   saa bokstav tre er alltid bokstav tre.

   HVORFOR FASITEN IKKE SENDES MED BILDET: en modell som vet hva
   det skal staa, leser det den venter aa se. Den faar bildet og
   ingenting annet, og sammenligningen gjoeres her i sida - som
   ren tegnsammenligning, ikke som en vurdering. Se lesArk().

   TRE VISNINGER: oppsett (ukas ord og de tre knappene), oeving
   (opplesning, ett ord av gangen) og resultat. Arket ligger for
   seg og vises bare i utskrift.

   BILDET LAGRES IKKE. Det staar i minnet mens resultatet er
   oppe, og forsvinner naar sida lastes paa nytt. En KV-verdi med
   ukentlige arkbilder i ville vokst uten grense, og bildet har
   ingen verdi etter at arket er lest.

   HVORFOR NEAM-HJOERNET IKKE ER HER: samme grunn som i
   mattespillet - paa telefon ville haandtaket staatt oppaa
   tastaturet, og samtalen er en rask vei til fasiten. Veien ut
   er merket oppe til venstre og sveip tilbake.
   ============================================================ */

:root{
  /* Messing - kontur og ramme, aldri fylt flate. */
  --messing:#B8873A;
  --messing-moerk:#8A6428;
  /* Lyset i stjernene og i en riktig bokstav. Samme gule to steder:
     det er én betydning - «det der satt». */
  --lys:#F2C14E;
  --lys-glod:rgba(242,193,78,.75);
  --metall:#E6E1D6;
  --robot-rod:#A64D3C;

  --kant:16px;
  --robot-h:104px;
  /* Sideforholdet til bildefila: robot 388x360. */
  --robot-w:calc(var(--robot-h) * 1.078);
  --rute:38px;
}
@media(min-width:700px) and (min-height:600px){
  :root{ --kant:28px; --robot-h:150px; --rute:46px; }
}
@media(min-width:1300px) and (min-height:600px){
  :root{ --kant:40px; --robot-h:150px; --rute:46px; }
}
@media(max-height:640px){
  :root{ --robot-h:84px; --rute:34px; }
}

*{ box-sizing:border-box; }
[hidden]{ display:none !important; }
html, body{ margin:0; }
body{
  font-family:'Archivo', system-ui, -apple-system, sans-serif;
  color:var(--ink);
  background:var(--side-bakgrunn);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
button{
  font-family:inherit; color:inherit;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
  cursor:pointer;
}
button:focus-visible, a:focus-visible, input:focus-visible{
  outline:3px solid var(--aksent); outline-offset:2px;
}

.side{
  overflow-x:hidden; overflow-x:clip;
  min-height:100vh; min-height:100dvh;
  max-width:1240px; margin:0 auto;
  display:flex; flex-direction:column; gap:14px;
  padding:max(14px, env(safe-area-inset-top)) var(--kant)
          calc(20px + env(safe-area-inset-bottom));
}

/* ---------- Toppen ---------- */
.topp{ display:flex; align-items:center; gap:14px; }
.merke{ flex-shrink:0; display:block; width:64px; height:64px; }
.merke img{ width:100%; height:100%; object-fit:contain; display:block; }
.tittel{
  margin:0; font-size:clamp(26px, 4.2vw, 44px); font-weight:700;
  line-height:1.05; letter-spacing:-.01em;
}
.ingress{
  margin:6px 0 0; max-width:54ch;
  font-size:var(--t-brod); line-height:1.45; color:var(--ink-soft); font-weight:600;
}
@media(min-width:700px){ .merke{ width:96px; height:96px; } }
/* Under opplesningen trengs hoeyden til Neam og de to knappene. */
body.over .topp{ display:none; }

/* ---------- Neam med boble ----------
   Han staar stille her - det er han som leser, ikke han som gaar.
   Boblen ligger ved siden av hodet, paa hoeyre side, og tar resten
   av bredden. */
.scene{
  display:flex; align-items:flex-end; gap:12px; flex-shrink:0;
  min-height:calc(var(--robot-h) + 6px);
}
.robot{ position:relative; width:var(--robot-w); height:var(--robot-h); flex-shrink:0; }
.robot img{
  width:100%; height:100%; object-fit:contain; object-position:bottom; display:block;
}
/* Reserve hvis bildefila mangler: en messingskive med N. Uten den staar
   han som et tomt felt, og scenen ser ut som en feil i sida. */
.robot .reserve{
  display:none; width:100%; height:100%; border-radius:50%;
  background:var(--metall); border:3px solid var(--messing-moerk);
  align-items:center; justify-content:center;
  font-size:calc(var(--robot-h) * .42); font-weight:700; color:var(--robot-rod);
}
.robot.uten-bilde img{ display:none; }
.robot.uten-bilde .reserve{ display:flex; }
.robot.leser{ animation:nikk 1.6s ease-in-out infinite; }
@keyframes nikk{
  0%,100%{ transform:translateY(0) rotate(0); }
  50%{ transform:translateY(-4px) rotate(-2deg); }
}

.boble{
  position:relative; flex:1; min-width:0;
  margin-bottom:calc(var(--robot-h) * .18);
  padding:10px 14px;
  background:var(--paper); color:var(--ink);
  border:2px solid var(--messing); border-radius:16px;
  font-size:var(--t-brod); font-weight:600; line-height:1.35;
  box-shadow:var(--shadow);
}
.boble::after{
  content:''; position:absolute; bottom:14px; left:-8px;
  width:14px; height:14px;
  background:var(--paper);
  border-left:2px solid var(--messing); border-bottom:2px solid var(--messing);
  transform:rotate(45deg);
}
.boble:empty{ display:none; }

/* ---------- Flata ---------- */
.flate{ display:flex; flex-direction:column; gap:14px; }
@media(min-width:900px){
  .flate{
    display:grid; grid-template-columns:minmax(0,1.45fr) minmax(280px,1fr);
    gap:18px; align-items:start;
  }
  body.over .flate{ grid-template-columns:1fr; }
}
body.over .rekorder{ display:none; }

.kort{
  background:var(--paper); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:18px 20px;
}
@media(min-width:700px){ .kort{ padding:22px 26px; } }
.kort-h{ margin:0 0 12px; font-size:var(--t-stor); font-weight:700; line-height:1.2; }
.hjelp{ margin:0 0 10px; font-size:var(--t-meta); color:var(--ink-soft); font-weight:600; }

/* ---------- Ukas ord ---------- */
.ord-topp{ display:flex; align-items:baseline; gap:12px; }
.ord-topp .kort-h{ margin:0; }
.endre-knapp{
  border:1px solid var(--line); background:var(--paper);
  border-radius:999px; padding:6px 14px;
  font-size:var(--t-etikett); font-weight:700; letter-spacing:.06em;
  text-transform:uppercase; color:var(--ink-soft);
}
/* Den foerste av de to skyver seg selv og naboen ut til hoeyre. */
.ord-topp .endre-knapp:first-of-type{ margin-left:auto; }
.endre-knapp:active{ background:var(--paper-soft); }
.ord-topp{ flex-wrap:wrap; gap:8px; }

/* Ukebaren. Pilene er like store som en tommel og staar ytterst, med
   uka midt imellom - samme moenster som dagbytte i kalenderen. */
.ukebar{
  display:flex; align-items:center; gap:8px; margin:0 0 12px;
  padding:4px; border-radius:999px; background:var(--paper-soft);
}
.uke-pil{
  flex-shrink:0; width:40px; height:40px; border-radius:50%;
  border:1px solid var(--line); background:var(--paper); color:var(--ink);
  font-size:var(--t-stor); line-height:1;
  display:flex; align-items:center; justify-content:center;
}
.uke-pil:active:not(:disabled){ background:var(--boks-mild); }
/* Avslaatt, ikke skjult: at det ikke finnes flere uker er en opplysning,
   og en pil som forsvinner flytter den andre mens fingeren er paa vei. */
.uke-pil:disabled{ opacity:.3; cursor:default; }
.uke-na{
  flex:1; text-align:center; min-width:0;
  font-size:var(--t-brod); font-weight:700; color:var(--ink);
}
/* En gammel uke skal ikke se ut som denne uka. */
.gammel-uke{
  margin:0 0 12px; padding:9px 13px; border-radius:12px;
  background:var(--boks-mild); border:1px solid var(--boks-kant);
  font-size:var(--t-meta); font-weight:700; color:var(--handling-endre-moerk);
}

.ordliste{ list-style:none; margin:12px 0 0; padding:0; display:grid; gap:8px; }
.ordliste li{
  display:flex; align-items:center; gap:12px;
  padding:11px 14px; border-radius:12px; background:var(--boks-mild);
  font-size:var(--t-stor); font-weight:700;
}
.o-nr{
  flex-shrink:0; width:26px; height:26px; border-radius:50%;
  border:2px solid var(--messing); color:var(--messing-moerk);
  display:flex; align-items:center; justify-content:center;
  font-size:var(--t-meta); font-weight:700;
}
/* Ordene staar skjult i utgangspunktet. Ser hun dem rett foer hun
   skriver, er det ikke lenger en diktat. Trykk paa raden viser dem -
   det er hennes eget valg, og det skal koste ett trykk. */
.ordliste.skjult .o-ord{
  color:transparent; background:var(--metall); border-radius:6px;
  user-select:none;
}
.o-vis{
  margin:12px 0 0; border:none; background:transparent; padding:6px 2px;
  font-size:var(--t-meta); font-weight:700; color:var(--aksent);
}

/* ---------- Redigering av ordene ---------- */
.rediger{ display:grid; gap:8px; margin-top:12px; }
.rad-inn{ display:flex; align-items:center; gap:10px; }
.rad-inn input{
  flex:1; min-width:0; padding:12px 14px; border-radius:12px;
  border:1.5px solid var(--line); background:#FFFFFF; color:var(--ink);
  /* 16px er et gulv: under det zoomer iOS inn naar feltet faar fokus. */
  font-size:18px; font-weight:700; font-family:inherit;
}
.rad-fjern{
  flex-shrink:0; border:1px solid var(--line); background:var(--paper);
  color:var(--ink-soft); border-radius:999px; width:34px; height:34px;
  font-size:var(--t-stor); line-height:1;
  display:flex; align-items:center; justify-content:center;
}
.rad-fjern:active{ background:var(--paper-soft); }
.legg-til{
  margin-top:4px; border:none; background:transparent; padding:6px 2px;
  font-size:var(--t-meta); font-weight:700; color:var(--aksent); text-align:left;
}

.knapp-blaa, .knapp-noytral{
  border-radius:999px; font-weight:700; font-size:var(--t-brod);
  padding:14px 20px; letter-spacing:.01em;
}
.knapp-blaa{ background:var(--aksent); color:#FFFFFF; border:1px solid var(--aksent); }
.knapp-blaa:active{ background:var(--aksent-moerk); }
.knapp-blaa:disabled{ background:var(--paper-soft); color:var(--ink-soft); border-color:var(--line); cursor:default; }
.knapp-noytral{ background:var(--paper); color:var(--ink); border:1px solid var(--line); }
.knapp-noytral:active{ background:var(--paper-soft); }
.knapperad{ display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; }
.knapperad button{ flex:1 1 0; min-width:130px; }

/* De tre veiene videre. Stablet, saa de er store nok til en tommel. */
.veier{ display:grid; gap:10px; margin-top:18px; }
.vei{
  display:flex; align-items:center; gap:14px; text-align:left;
  border:1px solid var(--line); background:var(--paper); border-radius:16px;
  padding:14px 16px; width:100%;
}
.vei:active{ background:var(--paper-soft); transform:scale(.99); }
.vei:disabled{ opacity:.45; cursor:default; }
.vei-ikon{
  flex-shrink:0; width:44px; height:44px; border-radius:50%;
  border:2px solid var(--messing); color:var(--messing-moerk);
  display:flex; align-items:center; justify-content:center;
}
.vei-ikon svg{ width:24px; height:24px; }
.vei-navn{ display:block; font-size:var(--t-brod); font-weight:700; }
.vei-sub{ display:block; font-size:var(--t-meta); color:var(--ink-soft); font-weight:600; margin-top:2px; }
.vei.hoved{ border-color:var(--aksent); background:var(--aksent-lys); }

/* ---------- Opplesningen ---------- */
.over-topp{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
.teller{ font-size:var(--t-brod); font-weight:700; color:var(--ink-soft); font-variant-numeric:tabular-nums; }
.avslutt{
  border:1px solid var(--line); background:var(--paper); border-radius:999px;
  padding:8px 16px; font-size:var(--t-meta); font-weight:700; color:var(--ink-soft);
}
.over-inn{ display:flex; flex-direction:column; align-items:center; gap:18px; margin-top:18px; }
/* Ordet staar ALDRI her. Nummeret er alt hun skal se. */
.over-nr{
  font-size:clamp(56px, 18vw, 120px); font-weight:700; line-height:1;
  color:var(--messing); font-variant-numeric:tabular-nums;
}
.over-knapper{ display:grid; grid-template-columns:1fr 1fr; gap:12px; width:100%; max-width:420px; }
.over-knapper button{ min-height:64px; font-size:var(--t-stor); }
/* Stemmevelgeren. `-webkit-appearance:none` med eksplisitt hoeyde er
   ikke pynt: iOS gir select-felt en egen indre stoerrelse som ikke laar
   seg styre, og feltet blir et annet enn det ser ut som i nettleseren
   paa PC. */
.stemmerad{
  display:flex; align-items:center; gap:10px; margin:16px 0 0;
  font-size:var(--t-meta); font-weight:700; color:var(--ink-soft);
}
.stemmerad select{
  flex:1; min-width:0; height:44px; padding:0 12px;
  -webkit-appearance:none; appearance:none;
  border:1.5px solid var(--line); border-radius:12px;
  background:#FFFFFF; color:var(--ink);
  font-family:inherit; font-size:16px; font-weight:600;
}

.tale-av{
  margin:14px 0 0; padding:10px 14px; border-radius:12px;
  background:var(--boks-mild); font-size:var(--t-meta); font-weight:600;
  color:var(--ink-soft); line-height:1.4;
}
/* Knappen staar inne i beskjeden, ikke under den: den hoerer til
   setningen den avslutter. */
.tale-av .o-vis{ margin:0 0 0 4px; padding:0; font-size:inherit; }

/* ---------- Resultatet ---------- */
.resultat{ text-align:center; }
.stjerner{ display:flex; justify-content:center; gap:6px; margin:4px 0 10px; flex-wrap:wrap; }
.stjerne{ width:clamp(40px, 10vw, 58px); height:auto; display:block; }
/* Tom stjerne er den samme fila, tappet for farge. Ett bilde, to
   tilstander - da kan de ikke komme i utakt. */
.stjerne:not(.fylt){ filter:grayscale(1) brightness(1.45) opacity(.42); }
.stjerner.vis .stjerne{ animation:stjerne .45s cubic-bezier(.3,1.6,.5,1) both; animation-delay:calc(var(--i) * .14s); }
@keyframes stjerne{ from{ transform:scale(0) rotate(-40deg); opacity:0; } to{ transform:none; opacity:1; } }
.poeng{ margin:0; font-size:26px; font-weight:700; font-variant-numeric:tabular-nums; }
.prosent{ margin:6px 0 0; font-size:var(--t-brod); color:var(--ink-soft); font-weight:600; }

/* Bildet av arket, over markeringen. Det er hennes eget arbeid - hun
   skal se hva han saa paa. */
.arkbilde{ margin:16px 0 0; }
.arkbilde img{
  display:block; width:100%; max-height:300px; object-fit:contain;
  border-radius:12px; border:1px solid var(--line); background:#FFFFFF;
}

.fasit{ margin:18px 0 0; display:grid; gap:12px; text-align:left; }
.f-ord{ padding:12px 14px; border-radius:12px; background:var(--boks-mild); }
.f-topp{ display:flex; align-items:center; gap:10px; margin-bottom:8px; }
.f-nr{
  flex-shrink:0; width:24px; height:24px; border-radius:50%;
  border:2px solid var(--messing); color:var(--messing-moerk);
  display:flex; align-items:center; justify-content:center;
  font-size:var(--t-etikett); font-weight:700;
}
.f-riktig{ font-size:var(--t-meta); font-weight:700; color:var(--ink-soft); }
.f-riktig.ja{ color:var(--handling-ny-moerk); }
.f-ruter{ display:flex; gap:5px; flex-wrap:wrap; }
.rute{
  width:var(--rute); height:calc(var(--rute) * 1.15);
  border:2px solid var(--line); border-radius:8px; background:#FFFFFF;
  display:flex; align-items:center; justify-content:center;
  font-size:calc(var(--rute) * .52); font-weight:700; line-height:1;
  font-family:inherit; color:var(--ink); padding:0;
}
/* Riktig bokstav i messing, med det samme gule lyset som stjernene. */
.rute.ja{ border-color:var(--messing); color:var(--messing-moerk); box-shadow:inset 0 0 0 2px var(--lys); }
/* Galt: hennes bokstav strøket og liten, den riktige under. Ikke roedt -
   roedt betyr slett her i huset, og en skrivefeil er ikke en straff. */
.rute.nei{ border-color:var(--ink-soft); flex-direction:column; gap:1px; font-size:calc(var(--rute) * .38); }
.rute-skrevet{ color:var(--ink-soft); text-decoration:line-through; text-decoration-thickness:2px; }
.rute-riktig{ color:var(--ink); font-size:calc(var(--rute) * .46); }
/* Usikker: han fikk ikke lest ruta. Trykk, og hun skriver hva det sto. */
.rute.usikker{ border-color:var(--handling-endre); color:var(--handling-endre); border-style:dashed; }
.rute.usikker:active{ background:var(--boks-mild); }
/* En bokstav som mangler har ingen rute paa arket. Stiplet og blek, saa
   det leses som et hull og ikke som noe hun har skrevet. */
.rute.borte{
  border-style:dotted; border-color:var(--ink-soft); background:var(--boks-mild);
  font-size:calc(var(--rute) * .46);
}
.rute.borte .rute-riktig{ color:var(--ink-soft); }
.rute-inn{
  width:var(--rute); height:calc(var(--rute) * 1.15);
  border:2px solid var(--aksent); border-radius:8px; background:#FFFFFF;
  text-align:center; font-size:calc(var(--rute) * .52); font-weight:700;
  font-family:inherit; color:var(--ink); padding:0;
}
.f-svar{ margin:8px 0 0; font-size:var(--t-meta); color:var(--ink-soft); font-weight:600; }
.f-svar b{ color:var(--ink); }
.lagring{ margin:14px 0 0; font-size:var(--t-meta); color:var(--ink-soft); font-weight:600; }

/* ---------- Rettingen paagaar ---------- */
.venter{ text-align:center; padding:26px 0; }
.venter-tekst{ margin:0; font-size:var(--t-brod); font-weight:600; color:var(--ink-soft); }
.snurr{
  width:40px; height:40px; margin:0 auto 14px;
  border:4px solid var(--line); border-top-color:var(--messing); border-radius:50%;
  animation:snurr 1s linear infinite;
}
@keyframes snurr{ to{ transform:rotate(360deg); } }

/* ---------- Rekordene ---------- */
.siste{ list-style:none; margin:0; padding:0; }
.siste li{
  display:grid; grid-template-columns:auto 1fr; gap:1px 12px; align-items:center;
  padding:9px 0; border-bottom:1px solid var(--line);
}
.siste li:last-child{ border-bottom:none; }
.siste li.ny{ background:#FFF6DD; margin:0 -10px; padding:9px 10px; border-radius:10px; border-bottom-color:transparent; }
.s-stjerner{ grid-row:span 2; display:flex; gap:1px; }
.mini{ width:16px; height:16px; display:block; }
.mini:not(.fylt){ filter:grayscale(1) brightness(1.45) opacity(.4); }
.s-topp{ font-size:var(--t-brod); font-weight:700; font-variant-numeric:tabular-nums; }
.s-under{ font-size:var(--t-meta); color:var(--ink-soft); font-weight:600; }
.tom{ font-size:var(--t-meta); color:var(--ink-soft); font-weight:600; margin:0; }
.samlet{ margin:12px 0 0; font-size:var(--t-meta); color:var(--ink-soft); font-weight:600; }
.runder-topp{ display:flex; align-items:baseline; gap:12px; }
.runder-topp .kort-h{ margin:0; }
.rediger-knapp{
  margin-left:auto; border:1px solid var(--line); background:var(--paper);
  border-radius:999px; padding:6px 14px;
  font-size:var(--t-etikett); font-weight:700; letter-spacing:.06em;
  text-transform:uppercase; color:var(--ink-soft);
}
.rediger-knapp:active{ background:var(--paper-soft); }
.rediger-knapp.paa{ background:var(--aksent-lys); border-color:var(--aksent); color:var(--aksent-moerk); }
.siste.redigerer{ max-height:330px; overflow-y:auto; -webkit-overflow-scrolling:touch; }
.siste li.rad-redigeres{ grid-template-columns:auto 1fr auto; }
.slett-rad{
  grid-row:span 2; align-self:center;
  border:1px solid var(--danger); background:var(--paper); color:var(--danger);
  border-radius:999px; width:34px; height:34px; font-size:var(--t-stor); line-height:1;
  display:flex; align-items:center; justify-content:center;
}

/* ============================================================
   Arket
   ------------------------------------------------------------
   Vises BARE i utskrift. Paa skjermen er det ingenting aa se -
   arket er noe hun skriver paa med blyant.

   Ingen ord staar paa det, bare numre: ser hun ordet mens hun
   skriver, er det ikke lenger en diktat.

   Ruter i millimeter, ikke piksler: dette er papir, og en rute
   skal vaere stor nok til en barnehaand uansett hvilken skriver
   arket kommer ut av. Radene staar godt fra hverandre - det
   loefter treffsikkerheten i lesningen mer enn noe annet enkelt
   grep.
   ============================================================ */
.ark{ display:none; }

@media print{
  /* Ingen bakgrunn paa papir: bildelaget fra felles-rot.css ville
     spist en hel tonerkassett. */
  html{ background:none; }
  body::before{ display:none; }
  body > .side{ display:none; }
  .ark{ display:block; color:#000000; font-family:'Archivo', sans-serif; }
  @page{ size:A4 portrait; margin:14mm; }
}

.ark-topp{ display:flex; align-items:flex-end; justify-content:space-between; gap:10mm; }
.ark-h{ margin:0; font-size:11mm; font-weight:700; letter-spacing:.02em; }
.ark-felt{ font-size:4mm; font-weight:600; }
.ark-felt span{ display:inline-block; border-bottom:.4mm solid #000000; width:40mm; }
.ark-hjelp{ margin:3mm 0 9mm; font-size:4mm; font-weight:600; }
/* Tolv ruter maa faa plass paa bredden: 182 mm innenfor margene, minus
   nummeret og luften etter det. 12 x 12 mm med 1,6 mm mellom blir
   161,6 mm, og da er det fortsatt et par millimeter igjen aa gaa paa om
   skriveren skalerer litt. Radene staar 13 mm fra hverandre - god
   avstand mellom linjene er det enkeltgrepet som loefter lesningen mest. */
.ark-rad{ display:flex; align-items:center; gap:3mm; margin-bottom:13mm; }
.ark-nr{
  flex-shrink:0; width:9mm; height:9mm; border-radius:50%;
  border:.6mm solid #000000;
  display:flex; align-items:center; justify-content:center;
  font-size:5mm; font-weight:700;
}
.ark-ruter{ display:flex; gap:1.6mm; }

/* ------------------------------------------------------------
   Ruta med skrivelinjer
   ------------------------------------------------------------
   Ruta er avlang og delt i tre soner, som i en vanlig skrivebok:

     topp  .....  taket for de hoeye bokstavene (b, k, l, stor I)
     5,5mm ----- hjelpelinja: taket for de smaa (a, e, o, n)
     5,5mm ===== hovedlinja: her staar bokstavene
     5,5mm       kjelleren for dem som henger under (g, j, p, y)

   HVORFOR: hun ble usikker paa hvor i ruta bokstaven skulle sitte.
   En tom firkant sier ingenting om hoeyde, og da blir hver bokstav
   et nytt valg.

   OG DET LESES BEDRE: en strek uten linjer aa maale mot kan vaere
   hva som helst. Med hovedlinje og hjelpelinje er liten i lav og
   prikket, mens stor I gaar helt opp - forskjellen er der i bildet
   for foerste gang. Sammenligningen behandler dem fortsatt som
   samme tegn, men det er nå et valg og ikke en noedvendighet.

   Hovedlinja er kraftigst: det er den hun skal sette bokstavene
   paa. Hjelpelinja er svak og stiplet, saa den ikke konkurrerer -
   og saa den ikke leses som en bindestrek i en tom rute.
   ------------------------------------------------------------ */
.ark-rute{
  position:relative; width:12mm; height:16.5mm;
  border:.5mm solid #000000; border-radius:1.5mm;
}
/* Hjelpelinja: 5,5 mm ned, altsaa taket for de smaa bokstavene. */
.ark-rute::before{
  content:''; position:absolute; left:.6mm; right:.6mm; top:5.5mm;
  border-top:.25mm dashed #9A9A9A;
}
/* Hovedlinja: 11 mm ned. Under den er det plass til g og j. */
.ark-rute::after{
  content:''; position:absolute; left:.3mm; right:.3mm; top:11mm;
  border-top:.45mm solid #000000;
}
.ark-bunn{ margin-top:6mm; font-size:3.4mm; font-weight:600; }
</style>

<script>
'use strict';

/* ============================================================
   Konstanter
   ============================================================ */

/* KV-noekkelen. Samme form som andrea-matte:v1 og andrea-fag:v1.
   Ukas ordliste og hele historikken ligger i én verdi. */
const NOKKEL = 'andrea-diktat:v1';
/* Speil paa enheten. Ikke en egen sannhet: det er det siste vi vet om
   KV-verdien, pluss runder som ikke kom fram. */
const LOKAL_NOKKEL = 'neam-andrea-diktat:v1';
const MAKS_RUNDER = 400;
/* Ukelister som beholdes. To skolehalvaar er omtrent fyrre uker, saa
   hundre er rikelig - og de er smaa: fem ord med to setninger hver. */
const MAKS_LISTER = 100;
const MAKS_ORD = 10;
/* Alle ord faar LIKE MANGE ruter, ikke ruter etter lengde. Grunnen er at
   rutene ellers roeper hvor langt ordet er, og lengden er en del av det
   hun skal kunne. Tolv rommer ordene paa 4. trinn med god margin, og en
   bokstav for mye har fortsatt et sted aa staa.

   EKSTRA_RUTER brukes bare hvis RUTER_FAST settes til 0. */
const EKSTRA_RUTER = 2;
const RUTER_FAST = 12;

/* Modellen som leser arket. Opus fra 12. september 2026: Sonnet las
   bokstavene riktig, men merket for mye som usikkert, og hver usikker
   rute er et spoersmaal et barn maa svare paa. Den er tregere - hun
   staar og venter mens den leser - men arket leses én gang per uke.

   Setningene lages av samme modell. Det er ikke en vurdering av
   oppgaven, bare enklere: én modell aa bytte naar den skal byttes. */
const MODELL = 'claude-opus-5';

/* Tale. Litt saktere enn vanlig tale, og litt lavere toneleie: det gir
   den stive, formelle klangen Neam skal ha, og et diktatord skal uansett
   leses roligere enn en setning. */
/* Tale. Ordet leses langsomt - det er selve oppgaven, og hun skal rekke
   aa hoere hver lyd i det. Setningen gaar raskere: den er sammenhengen,
   ikke noe hun skal skrive, og en setning lest bokstavelig talt i sakte
   film blir vanskeligere aa forstaa, ikke lettere.

   TONEN er tilbake paa noeytral. Et lavere toneleie ga Neam den stive
   klangen han skal ha, men det gjoer ogsaa konsonantene mer grumsete, og
   i en diktat er det forskjellen paa d og t som avgjoer. Karakteren maa
   vike for tydeligheten her. */
/* Ordet leses saktere enn tale flest, men ikke saa sakte at det drar.
   Under omtrent 0,7 begynner stemmene aa trekke vokalene ut, og det
   hoeres mindre naturlig ut - ikke tydeligere. */
const TALE_FART_ORD = 0.78;
const TALE_FART_SETNING = 0.92;
const TALE_TONE = 1.0;
/* Pausene i «ord - setning - ord». Lang nok til at hun rekker aa begynne
   aa skrive, kort nok til at hun ikke tror han er ferdig. */
const PAUSE_MELLOM = 900;

/* Neams replikker. Varm og litt stiv, aldri sarkastisk. */
const REPLIKK = {
  tom: 'God dag, Andrea! Jeg har ingen ord denne uka ennå. Trykk Endre, så skriver vi dem inn sammen.',
  klar: 'Ukas ord er på plass. Skal jeg lese dem opp, eller vil du ha arket først?',
  leser: 'Lytt godt. Jeg leser ordet, så en setning, så ordet en gang til.',
  leserArk: 'Et øyeblikk. Jeg ser på hver rute etter tur.'
};

/* ============================================================
   Tilstand
   ============================================================ */

let data = { versjon:2, lister:[], runder:[] };
/* Uka som vises. Null betyr den nyeste - det er nesten alltid den, og
   da skal den ikke laases fast til en id som kan bli byttet ut mens
   sida staar aapen. */
let valgtId = null;
/* Paagaaende opplesning, eller null. */
let ov = null;
/* Sekvensnummer for tale. En gammel opplesning som svarer sent skal ikke
   sette i gang neste ord - samme regel som for tegning: kast det som er
   utdatert, ikke hopp over det som er nytt. */
let taleNr = 0;
/* Siste rettede runde og bildet den ble lest av. Bildet lagres ikke. */
let sisteRunde = null;
let sisteBilde = null;
let visning = 'oppsett';

const $ = function(id){ return document.getElementById(id); };

function esc(t){
  return String(t).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}

function si(tekst){ $('boble').textContent = tekst || ''; }

function nyId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

/* ============================================================
   Lagring - KV med speil paa enheten
   ------------------------------------------------------------
   Samme moenster som mattespillet: KV cacher lesinger i 60
   sekunder, saa det vi har i minnet flettes alltid inn i det KV
   svarer foer vi skriver. Ingen runde kan forsvinne av at
   lesingen var gammel.
   ============================================================ */

async function kvLes(nokkel){
  const r = await fetch('/api/data?key=' + encodeURIComponent(nokkel),
                        { headers:{ 'Accept':'application/json' }, cache:'no-store' });
  if(!r.ok) throw new Error('KV les ' + r.status);
  const d = await r.json();
  return (d && d.value !== undefined) ? d.value : null;
}

async function kvSkriv(nokkel, verdi){
  const r = await fetch('/api/data?key=' + encodeURIComponent(nokkel), {
    method:'PUT', headers:{ 'Content-Type':'application/json' },
    body:JSON.stringify(verdi)
  });
  if(!r.ok) throw new Error('KV skriv ' + r.status);
  return true;
}

function gyldigRunde(r){
  return r && typeof r.id === 'string' && Array.isArray(r.ord) && r.ord.length > 0;
}

function gyldigListe(l){
  return l && typeof l.id === 'string' && typeof l.tid === 'string'
      && Array.isArray(l.ord) && l.ord.length > 0;
}

/* ------------------------------------------------------------
   Ukenummer
   ------------------------------------------------------------
   ISO 8601, som i Norge: uke 1 er den uka som inneholder aarets
   foerste torsdag, og uka begynner paa mandag.

   Nummeret LAGRES paa lista naar den opprettes, og regnes ikke ut
   av tidspunktet hver gang det skal vises. Grunnen er kanten:
   legger man inn ordene soendag kveld for uka som kommer, gir
   tidspunktet forrige ukes nummer, og lista ville skiftet navn
   ved midnatt.
   ------------------------------------------------------------ */
function ukeAv(d){
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  /* Til torsdag i samme uke - da ligger vi trygt i riktig aar. */
  t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7));
  const nyttaar = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  const nr = Math.ceil(((t - nyttaar) / 86400000 + 1) / 7);
  return { aar: t.getUTCFullYear(), uke: nr };
}

function ukeNa(){ return ukeAv(new Date()); }

/* Ukenummeret paa ei liste. Er det ikke lagret - lister laget foer feltet
   fantes - regnes det ut av tidspunktet i stedet. Det er ikke like godt
   som et lagret nummer, men det er riktig for alt som ble lagt inn i loepet
   av uka det gjaldt, og det er alternativet til aa staa uten nummer. */
function ukeTall(l){
  if(!l) return null;
  if(l.uke) return { uke:l.uke, aar:l.aar || ukeAv(new Date(l.tid)).aar };
  try{ return ukeAv(new Date(l.tid)); }catch(e){ return null; }
}

function ukeNavn(l){
  const u = ukeTall(l);
  if(!u) return 'Ukas ord';
  const na = ukeNa();
  /* Aarstallet bare naar det ikke er inneverende aar - ellers er det
     stoey paa en etikett som skal leses paa et halvt sekund. */
  return 'Uke ' + u.uke + (u.aar !== na.aar ? ' · ' + u.aar : '');
}

/* Rundene og listene flettes paa id.

   VED SAMME ID er det samme liste skrevet to ganger - ordene foerst og
   setningene etterpaa. Da vinner den med flest setninger. Uten dette
   leddet ble setningene lagret og straks overskrevet av versjonen uten:
   KV sto foerst, likhet gikk i dens favoer, og opplesningen sa ordet to
   ganger uten noe imellom.

   Er antallet likt, vinner den som ble endret sist. */
function antallSetninger(l){
  return ((l && l.ord) || []).reduce(function(n, o){
    return n + (((o && o.setninger) || []).length ? 1 : 0);
  }, 0);
}

/* Lista laa foer som ÉN verdi under `liste`. Den loeftes inn i `lister`
   naar den dukker opp, saa gamle lagringer ikke gaar tapt. */
function listeneI(d){
  if(!d) return [];
  if(Array.isArray(d.lister)) return d.lister;
  return d.liste ? [d.liste] : [];
}

function flettData(a, b){
  const kart = new Map();
  [a, b].forEach(function(d){
    const liste = (d && Array.isArray(d.runder)) ? d.runder : [];
    liste.forEach(function(r){ if(gyldigRunde(r)) kart.set(r.id, r); });
  });
  let runder = Array.from(kart.values())
    .sort(function(x, y){ return x.tid < y.tid ? -1 : x.tid > y.tid ? 1 : 0; });
  if(runder.length > MAKS_RUNDER) runder = runder.slice(-MAKS_RUNDER);

  const lkart = new Map();
  [a, b].forEach(function(d){
    listeneI(d).forEach(function(l){
      if(!gyldigListe(l)) return;
      const foer = lkart.get(l.id);
      if(!foer){ lkart.set(l.id, l); return; }
      const ns = antallSetninger(l), fs = antallSetninger(foer);
      if(ns > fs){ lkart.set(l.id, l); return; }
      if(ns === fs && String(l.endret || l.tid) > String(foer.endret || foer.tid)){
        lkart.set(l.id, l);
      }
    });
  });
  let lister = Array.from(lkart.values())
    .sort(function(x, y){ return x.tid < y.tid ? -1 : x.tid > y.tid ? 1 : 0; });
  if(lister.length > MAKS_LISTER) lister = lister.slice(-MAKS_LISTER);

  return { versjon:2, lister:lister, runder:runder };
}

function lokalLes(){
  try{
    const t = localStorage.getItem(LOKAL_NOKKEL);
    return t ? JSON.parse(t) : null;
  }catch(e){ return null; }
}

function lokalSkriv(usendt){
  try{
    localStorage.setItem(LOKAL_NOKKEL, JSON.stringify({ data:data, usendt:!!usendt }));
  }catch(e){ /* full eller privat modus - KV er fortsatt kilden */ }
}

async function synk(){
  const fjern = await kvLes(NOKKEL);
  const flett = flettData(fjern, data);
  await kvSkriv(NOKKEL, flett);
  data = flett;
  lokalSkriv(false);
}

async function lastData(){
  const lokal = lokalLes();
  if(lokal && lokal.data){
    data = flettData(lokal.data, null);
    tegnOrdliste();
    tegnRunder();
  }
  try{
    const fjern = await kvLes(NOKKEL);
    data = flettData(fjern, data);
    if(lokal && lokal.usendt) await kvSkriv(NOKKEL, data);
    lokalSkriv(false);
  }catch(e){
    console.warn('Diktat: fikk ikke lest KV', e);
  }
  tegnOrdliste();
  tegnRunder();

  /* Mangler noen av ordene setning, henter vi dem uten aa bli bedt om
     det. Setningene lages normalt i det ordene lagres; ligger det
     likevel en liste uten, kom den fra en gang der kallet feilet - og
     da er det ikke hennes jobb aa oppdage det og trykke en knapp.

     Etter tegningen, saa knappen finnes og kan slaas av mens det staar
     paa. Én gang per liste per oekt - se setningerProvd. */
  const mangler = ordene().some(function(o){ return !((o.setninger || []).length); });
  const l = valgtListe();
  if(mangler && l && !setningerProvd[l.id]){
    hentSetninger();
  }
}

/* ============================================================
   Ordene
   ============================================================ */

/* Den nyeste lista, eller den som er valgt i ukevelgeren. */
function nyesteListe(){
  return data.lister.length ? data.lister[data.lister.length - 1] : null;
}

function valgtListe(){
  if(valgtId){
    const t = data.lister.filter(function(l){ return l.id === valgtId; })[0];
    if(t) return t;
    /* Uka er borte - slettet paa en annen enhet, eller falt ut av taket.
       Da faller vi tilbake til den nyeste i stedet for aa staa tomt. */
    valgtId = null;
  }
  return nyesteListe();
}

function ordene(){
  const l = valgtListe();
  return (l && Array.isArray(l.ord)) ? l.ord : [];
}

/* Rutene per ord. Se EKSTRA_RUTER og RUTER_FAST. */
function ruterFor(ord){
  return RUTER_FAST > 0 ? RUTER_FAST : String(ord).length + EKSTRA_RUTER;
}

/* ------------------------------------------------------------
   Tegn som ikke kan skilles i en rute
   ------------------------------------------------------------
   En rute har ingen skrivelinje. Store og smaa bokstaver er
   derfor allerede likestilt - men to tegn er verre enn som saa:
   stor I og liten l er NOEYAKTIG samme strek, og med blandet
   skrift traff forvekslingen nesten annethvert ord.

   Derfor slaas de sammen til én klasse: i, I, l, L, ettall og
   loddrett strek teller som samme tegn. Det samme gjelder stor O
   og null.

   PRISEN er at «vil» og «vii» ikke skilles. Den er betalt med
   vitende og vilje: bildet inneholder ikke informasjonen som
   trengs for aa skille dem, saa alternativet er ikke strengere
   retting - det er tilfeldig retting. Et barn som kan ordet
   skriver uansett riktig bokstav; det er maskinen som ikke kan
   se hvilken det var.

   Skal det skilles en dag, maa arket gi streken noe aa maales
   mot - en svak linje i ruta, eller ruter med ulik hoeyde. Det
   er en arkendring, ikke en kodeendring.
   ------------------------------------------------------------ */
const SAMME_TEGN = { 'l':'i', '1':'i', '|':'i', '!':'i', '0':'o' };

function tegnKlasse(t){
  const s = String(t || '').trim().toLowerCase();
  return SAMME_TEGN[s] || s;
}

/* Tegnene sammenlignes uten forskjell paa store og smaa bokstaver: et
   barn som skriver SOL har ikke skrevet feil. */
function likTegn(a, b){
  return tegnKlasse(a) === tegnKlasse(b);
}

/* Ukebaren. Pilene blar i den rekkefoelgen listene ble laget: venstre
   bakover i tid, hoeyre framover - som alt annet som blar i huset. */
function ukeIndeks(){
  const l = valgtListe();
  if(!l) return -1;
  return data.lister.map(function(x){ return x.id; }).indexOf(l.id);
}

function tegnUker(){
  const l = valgtListe();
  const i = ukeIndeks();
  $('ukeH').textContent = ukeNavn(l);

  $('ukerad').hidden = !data.lister.length;
  if(data.lister.length){
    $('ukeNa').textContent = ukeNavn(l) + ' · ' + (l ? l.ord.length : 0) + ' ord';
    $('ukeForrige').disabled = i <= 0;
    $('ukeNeste').disabled = i < 0 || i >= data.lister.length - 1;
  }

  /* En gammel uke skal ikke kunne forveksles med denne uka - arket og
     stjernene ser like ut uansett hvilken liste som ligger bak. */
  const na = ukeNa();
  const gammel = l && l.uke && !(l.uke === na.uke && l.aar === na.aar);
  $('gammelUke').hidden = !gammel;
  if(gammel){
    $('gammelUke').textContent = 'Du ser på ' + ukeNavn(l).toLowerCase()
      + '. Trykk «Ny uke» for å legge inn ordene for uke ' + na.uke + '.';
  }
  /* Uten noen liste er «Endre» meningsloes - det finnes ingenting aa
     endre, og «Ny uke» er den ene veien inn. */
  $('endreOrd').hidden = !data.lister.length;
}

function tegnOrdliste(){
  const ord = ordene();
  const ul = $('ordliste');
  tegnUker();
  ul.innerHTML = ord.length
    ? ord.map(function(o, i){
        return '<li><span class="o-nr">' + (i + 1) + '</span>'
             + '<span class="o-ord">' + esc(o.ord) + '</span></li>';
      }).join('')
    : '';
  $('visSkjul').hidden = !ord.length;
  /* Uten setning leser han bare ordet to ganger. Det er ikke galt, men
     det er ikke det som var meningen - og da skal det staa her, ikke
     oppdages foerste gang hun oever. */
  const uten = ord.filter(function(o){ return !((o.setninger || []).length); }).length;
  $('setningerKnapp').hidden = !ord.length || !uten;
  $('setningerKnapp').textContent = uten === ord.length
    ? 'Lag setninger til ordene'
    : 'Lag setning til ' + uten + (uten === 1 ? ' ord som mangler' : ' ord som mangler');
  $('ordHjelp').textContent = ord.length
    ? ord.length + ' ord denne uka.' + (uten ? ' ' + uten + ' av dem mangler setning.' : '')
    : 'Ingen ord lagt inn ennå. Trykk «Ny uke» for å skrive dem inn.';
  $('veiOv').disabled = !ord.length;
  $('veiArk').disabled = !ord.length;
  $('veiBilde').disabled = !ord.length;
  if(visning === 'oppsett') si(ord.length ? REPLIKK.klar : REPLIKK.tom);
  tegnArk();
}

$('visSkjul').addEventListener('click', function(){
  const skjult = $('ordliste').classList.toggle('skjult');
  this.textContent = skjult ? 'Vis ordene' : 'Skjul ordene';
});

/* ---------------- Redigering ---------------- */

function tegnFelt(verdier){
  const v = verdier.slice();
  while(v.length < 5) v.push('');
  $('ordFelt').innerHTML = v.map(function(t, i){
    return '<div class="rad-inn">'
         + '<input type="text" value="' + esc(t) + '" maxlength="24" autocapitalize="off" '
         + 'autocorrect="off" spellcheck="false" aria-label="Ord ' + (i + 1) + '">'
         + '<button type="button" class="rad-fjern" aria-label="Fjern ord ' + (i + 1) + '">&times;</button>'
         + '</div>';
  }).join('');
}

function felteneNa(){
  return Array.prototype.map.call($('ordFelt').querySelectorAll('input'),
    function(el){ return el.value.trim(); });
}

/* Skiller de to veiene inn i skjemaet: «Endre» retter uka som vises,
   «Ny uke» lager en ny. Uten dette skillet maatte man velge mellom aa
   kunne rette en skrivefeil og aa kunne starte en ny uke - den ene
   knappen kan ikke bety begge deler. */
let nyUke = false;

$('endreOrd').addEventListener('click', function(){
  nyUke = false;
  tegnFelt(ordene().map(function(o){ return o.ord; }));
  aapneRedigering();
});

$('nyUkeKnapp').addEventListener('click', function(){
  nyUke = true;
  tegnFelt([]);
  aapneRedigering();
});

/* Bla mellom ukene. `valgtId` settes eksplisitt selv naar vi lander paa
   den nyeste - ellers ville «null betyr nyeste» gjort at en ny uke lagt
   inn paa en annen enhet plutselig tok over skjermen midt i blaingen. */
function blaUke(steg){
  const i = ukeIndeks();
  if(i < 0) return;
  const ny = i + steg;
  if(ny < 0 || ny >= data.lister.length) return;
  valgtId = data.lister[ny].id;
  tegnOrdliste();
  tegnRunder();
}

$('ukeForrige').addEventListener('click', function(){ blaUke(-1); });
$('ukeNeste').addEventListener('click', function(){ blaUke(1); });

function aapneRedigering(){
  $('visOrd').hidden = true;
  $('redigerOrd').hidden = false;
  $('nyUkeKnapp').hidden = true;
  $('endreOrd').hidden = true;
}

function lukkRedigering(){
  $('visOrd').hidden = false;
  $('redigerOrd').hidden = true;
  $('nyUkeKnapp').hidden = false;
  nyUke = false;
  tegnOrdliste();
}

$('avbrytOrd').addEventListener('click', function(){
  /* Avbryt-regelen: spoer bare naar det finnes noe aa miste. */
  const na = felteneNa().filter(Boolean).join('\u241F');
  const foer = nyUke ? '' : ordene().map(function(o){ return o.ord; }).join('\u241F');
  if(na === foer){ lukkRedigering(); return; }
  bekreft('Du har endret ordene uten å lagre. Forkaster du det nå, er det borte.',
          { jaTekst:'Forkast', fare:true }).then(function(ja){ if(ja) lukkRedigering(); });
});

$('leggTilOrd').addEventListener('click', function(){
  const v = felteneNa();
  if(v.length >= MAKS_ORD){ varsle('Høyst ' + MAKS_ORD + ' ord om gangen.'); return; }
  v.push('');
  tegnFelt(v);
  const felt = $('ordFelt').querySelectorAll('input');
  if(felt.length) felt[felt.length - 1].focus();
});

$('ordFelt').addEventListener('click', function(ev){
  const k = ev.target.closest('.rad-fjern');
  if(!k) return;
  const rad = k.closest('.rad-inn');
  const alle = Array.prototype.slice.call($('ordFelt').children);
  const i = alle.indexOf(rad);
  const v = felteneNa();
  v.splice(i, 1);
  tegnFelt(v);
});

$('lagreOrd').addEventListener('click', async function(){
  const ord = felteneNa().filter(Boolean);
  if(!ord.length){ varsle('Skriv inn minst ett ord.'); return; }
  const na = new Date().toISOString();

  /* Ordene lagres MED DET SAMME, uten setninger. Setningene kommer fra
     Neam og kan feile; da skal ordene likevel ligge der.

     Setningene foelger ORDET, ikke plassen: rettes en skrivefeil i ett
     ord, skal de fire andre beholde setningene sine. Uten dette maatte
     hele uka lages om fordi ett ord ble endret. */
  const foer = {};
  ordene().forEach(function(o){
    foer[String(o.ord).trim().toLowerCase()] = o.setninger || [];
  });
  const nyeOrd = ord.map(function(o){
    return { ord:o, setninger: foer[o.trim().toLowerCase()] || [] };
  });

  const mal = nyUke ? null : valgtListe();
  if(mal){
    mal.ord = nyeOrd;
    mal.endret = na;
  }else{
    const u = ukeNa();
    data.lister.push({
      id: nyId(), tid: na, endret: na,
      uke: u.uke, aar: u.aar,
      ord: nyeOrd
    });
    valgtId = null;                /* ny uke er alltid den nyeste */
  }
  nyUke = false;

  lokalSkriv(true);
  lukkRedigering();
  tegnOrdliste();
  si('Ordene er notert. Jeg finner på en setning til hvert av dem.');

  try{ await synk(); }
  catch(e){ console.warn('Diktat: fikk ikke lagret ordene', e); }

  await hentSetninger();
});

/* Lister vi alt har proevd aa hente setninger til i denne oekten. Uten
   den ville et kall som feiler bli proevd paa nytt ved hver eneste
   tegning av sida - og en feil som gjentar seg koster like mye hver
   gang. Den lever bare i minnet: neste gang sida lastes, er det rimelig
   aa proeve én gang til. */
const setningerProvd = {};

/* Setningene til ordene som ligger inne. Kalles av seg selv naar noe
   mangler, og fra knappene - de kan feile foerste gang, og da skal det
   gaa an aa proeve igjen uten aa skrive ordene om att. */
async function hentSetninger(){
  const l = valgtListe();
  if(!l) return;
  const ord = l.ord.map(function(o){ return o.ord; });
  if(!ord.length) return;
  const listeId = l.id;
  setningerProvd[listeId] = true;
  $('setningerKnapp').disabled = true;
  si('Et øyeblikk. Jeg finner på en setning til hvert ord.');
  try{
    const med = await lagSetninger(ord);
    /* Bare hvis lista ikke er byttet ut mens vi ventet. */
    const na = data.lister.filter(function(x){ return x.id === listeId; })[0];
    if(na && na.ord.length === med.length){
      na.ord = med;
      na.endret = new Date().toISOString();
      lokalSkriv(true);
      await synk();
    }
    tegnOrdliste();
    si(REPLIKK.klar);
  }catch(e){
    console.warn('Diktat: fikk ikke laget setninger', e);
    tegnOrdliste();
    /* Feilen SELV, ikke bare at det gikk galt. «Jeg fikk det ikke til» er
       ingenting aa gaa videre paa naar den som leser staar med telefonen
       i haanda og ingen konsoll. */
    si('Jeg fikk ikke laget setninger: ' + ((e && e.message) || 'ukjent feil')
     + ' Ordene kan jeg lese uansett.');
  }
  $('setningerKnapp').disabled = false;
}

$('setningerKnapp').addEventListener('click', hentSetninger);

/* Samme handling, men fra oevingssida - der beskjeden om at setningen
   mangler faktisk staar. En knapp som fikser noe hoerer hjemme der
   problemet vises, ikke ett sveip unna. */
$('setningerHer').addEventListener('click', async function(){
  this.disabled = true;
  this.textContent = 'Lager setninger …';
  await hentSetninger();
  this.disabled = false;
  this.textContent = 'Lag setninger nå';
  if(ov){ tegnOving(); lesOppgave(false); }
});

/* ============================================================
   Neam
   ------------------------------------------------------------
   To kall gaar herfra: setninger til ordene, og lesing av arket.
   Begge gaar rett til /api/claude, ikke gjennom samtalepanelet -
   de har ett bestemt svar hver, og skal ikke kunne bli til noe
   annet underveis.
   ============================================================ */

async function neam(kropp){
  const stopper = new AbortController();
  const klokke = setTimeout(function(){ stopper.abort(); }, 90000);
  let r;
  try{
    r = await fetch('/api/claude', {
      method:'POST', headers:{ 'Content-Type':'application/json' },
      body:JSON.stringify(Object.assign({ thinking:{ type:'disabled' } }, kropp)),
      signal:stopper.signal
    });
  }catch(e){
    throw new Error(e && e.name === 'AbortError'
      ? 'Neam svarte ikke i tide.' : 'Fikk ikke kontakt med Neam.');
  }finally{
    clearTimeout(klokke);
  }
  const raa = await r.text();
  let d;
  try{ d = JSON.parse(raa); }
  catch(e){ throw new Error('Uventet svar fra tjenesten (HTTP ' + r.status + ').'); }
  if(!r.ok || d.type === 'error'){
    throw new Error((d.error && d.error.message) || ('HTTP ' + r.status));
  }
  return (d.content || [])
    .map(function(b){ return b.type === 'text' ? b.text : ''; })
    .filter(Boolean).join('\n');
}

/* Modellen svarer i JSON. Kodegjerder tas bort foer tolkning - de kommer
   av og til selv naar den er bedt om aa la vaere.

   VI KLIPPER VED DEN AVSLUTTENDE KLAMMEN, ikke ved slutten av teksten.
   Grunnen er maalt, ikke gjettet: svaret var gyldig JSON med en linje
   forklaring bak, og aa lese fra foerste klamme og ut ga «Unexpected
   non-whitespace character after JSON at position 646». Innholdet var
   helt i orden - det var det som kom ETTER som veltet det.

   Teller klammer med hensyn til tekststrenger, saa en klamme inne i en
   setning ikke teller med. */
function somJson(tekst){
  const t = String(tekst || '').replace(/```json|```/g, '').trim();
  const start = t.search(/[[{]/);
  if(start === -1) throw new Error('Fant ingen JSON i svaret');

  const apen = t[start];
  const lukk = apen === '{' ? '}' : ']';
  let dyp = 0, iTekst = false, hopp = false, slutt = -1;
  for(let i = start; i < t.length; i++){
    const c = t[i];
    if(hopp){ hopp = false; continue; }
    if(iTekst){
      if(c === '\\') hopp = true;
      else if(c === '"') iTekst = false;
      continue;
    }
    if(c === '"') iTekst = true;
    else if(c === apen) dyp++;
    else if(c === lukk){
      dyp--;
      if(dyp === 0){ slutt = i; break; }
    }
  }
  /* Fant vi ingen avslutning, er svaret kuttet paa midten - da er hele
     teksten det beste vi har, og feilen fra JSON.parse sier hva som er
     galt med den. */
  return JSON.parse(slutt === -1 ? t.slice(start) : t.slice(start, slutt + 1));
}

/* ---------------- Setningene ----------------
   To per ord. Den ene leses, den andre ligger klar til «Hoer igjen» -
   da blir gjentakelsen ikke identisk gjentakelse, som er bedre for
   pugging.

   BEGGE ER NOEYTRALE. De var foerst tenkt med Andrea i den ene, men
   navnet hennes i setningen trekker oppmerksomheten mot henne selv i
   det oeyeblikket hun skal lytte etter et ord. Setningen er der for aa
   gi ordet en sammenheng, ikke for aa vaere hyggelig. */
async function lagSetninger(ord){
  const svar = await neam({
    model: MODELL,
    max_tokens: 1500,
    system: 'Du lager eksempelsetninger til diktatord for et barn på 4. trinn. '
          + 'Du svarer bare med JSON, uten noe før eller etter.',
    messages: [{ role:'user', content:
        'Lag to korte norske setninger til hvert av disse ordene:\n'
      + ord.map(function(o, i){ return (i + 1) + '. ' + o; }).join('\n') + '\n\n'
      + 'Regler:\n'
      + '- Ordet må stå i setningen, i nøyaktig den formen det er oppgitt.\n'
      + '- Setningene skal være helt nøytrale. Bruk ingen egennavn – verken '
      + 'personer, steder eller merker.\n'
      + '- De to setningene til samme ord skal handle om hver sin ting, så det '
      + 'ikke blir den samme setningen to ganger.\n'
      + '- Høyst åtte ord i hver setning, og bokmål et barn på 9 år forstår.\n'
      + '- Ingen andre ord fra lista skal stå i setningen.\n\n'
      + 'Svar BARE med JSON på formen:\n'
      + '{"ord":[{"ord":"sol","setninger":["Sola skinner på himmelen.","Vi satt i sola hele dagen."]}]}'
  }] });
  const d = somJson(svar);
  const kart = new Map();
  ((d && d.ord) || []).forEach(function(o){
    if(o && typeof o.ord === 'string' && Array.isArray(o.setninger)){
      kart.set(o.ord.trim().toLowerCase(),
               o.setninger.map(String).filter(Boolean).slice(0, 2));
    }
  });
  /* Rekkefoelgen er VAAR, ikke modellens: kommer et ord tilbake i feil
     orden eller mangler helt, staar det likevel paa sin plass - uten
     setninger, som er greit nok. */
  return ord.map(function(o){
    return { ord:o, setninger: kart.get(o.trim().toLowerCase()) || [] };
  });
}

/* ============================================================
   Opplesningen
   ------------------------------------------------------------
   Nettleserens egen talesyntese.

   AA FINNE DEN NORSKE STEMMEN er verre enn det burde vaere:

   - Lista er tom rett etter at sida er lastet, og fylles i sitt
     eget tempo. `onvoiceschanged` fyrer paa noen enheter og ikke
     paa andre, saa vi spoer om igjen med korte mellomrom i stedet
     for aa stole paa hendelsen.
   - Sprakkoden skrives ulikt: «nb-NO» i iOS, «nb_NO» med
     understrek i enkelte Android-nettlesere, og «no-NO» i eldre
     Windows-stemmer. Vi normaliserer foer vi sammenligner.
   - Noen stemmer oppgir feil eller tom kode, men heter noe som
     avsloerer dem: Nora, Iselin, Finn, «Norwegian», «norsk».

   Finner vi ingenting, leser vi likevel - med `lang` satt, saa
   nettleseren faar velge selv. En stum knapp er verre enn en
   uttale som bommer, og beskjeden under sier hva som er galt.
   ============================================================ */

let stemme = null;
let taleStottes = ('speechSynthesis' in window);
/* Hva vi faktisk fant. Staar i beskjeden naar ingen norsk stemme finnes,
   saa det gaar an aa se HVA enheten har uten aa koble til en konsoll. */
let stemmeFunn = [];
/* De norske, i rangert rekkefoelge - det er dem hun kan velge mellom. */
let norskeStemmer = [];
const VALGT_STEMME = 'neam-diktat-stemme';

function normLang(v){
  return String((v && v.lang) || '').replace('_', '-').toLowerCase();
}

function erNorsk(v){
  const l = normLang(v);
  return /^(nb|nn|no)(-|$)/.test(l)
      || /norsk|norwegian|bokm/i.test(String(v.name || ''));
}

/* Rangering av stemmene. Plattformene legger ut flere varianter av samme
   stemme, og den som staar foerst i lista er sjelden den beste:

   - «Premium», «Enhanced», «Neural» og «Natural» er de nedlastede
     versjonene. De hoeres vesentlig bedre ut enn standardstemmen, og paa
     iOS maa de hentes for haand foer de dukker opp i det hele tatt.
   - Google-stemmene i Chrome er nettbaserte og jevnt over bedre enn
     de innebygde i Windows.
   - «Compact» er det motsatte: den minste og mest metalliske varianten. */
function stemmeSkaar(v){
  const n = String((v && v.name) || '').toLowerCase();
  let s = 0;
  if(/premium|enhanced|neural|natural/.test(n)) s += 6;
  if(/google/.test(n)) s += 3;
  if(/siri/.test(n)) s += 2;
  if(/compact/.test(n)) s -= 4;
  if(/^nb(-|$)/.test(normLang(v))) s += 1;   /* bokmaal foer nynorsk */
  return s;
}

function finnStemme(){
  if(!taleStottes) return;
  let alle = [];
  try{ alle = window.speechSynthesis.getVoices() || []; }catch(e){ alle = []; }
  stemmeFunn = alle;
  norskeStemmer = alle.filter(erNorsk).sort(function(a, b){
    return stemmeSkaar(b) - stemmeSkaar(a);
  });

  /* Et valg som er gjort skal staa, saa lenge stemmen fortsatt finnes. */
  let valgt = null;
  try{ valgt = localStorage.getItem(VALGT_STEMME); }catch(e){}
  stemme = (valgt && norskeStemmer.filter(function(v){
      return (v.voiceURI || v.name) === valgt;
    })[0]) || norskeStemmer[0] || null;
}

/* Spoer om igjen til lista dukker opp. Ti ganger med 300 ms er tre
   sekunder - lenger enn noen enhet trenger, og vi slutter med det
   samme vi har funnet noe. */
function letEtterStemme(naarFerdig){
  let forsok = 0;
  const igjen = function(){
    finnStemme();
    if(stemme || forsok >= 10){ if(naarFerdig) naarFerdig(); return; }
    forsok++;
    setTimeout(igjen, 300);
  };
  igjen();
}

if(taleStottes){
  finnStemme();
  /* Fyrer paa noen enheter. Vi lener oss ikke paa den, men tar den imot. */
  window.speechSynthesis.onvoiceschanged = function(){
    finnStemme();
    if(visning === 'over') settTaleVarsel();
  };
}

/* Leser én tekst og lover aa komme tilbake naar den er lest.

   VAKTHUNDEN er ikke pynt: i Safari hender det at `onend` aldri fyrer,
   og da ville kjeden ord-setning-ord staatt bom stille uten at noe saa
   galt ut. Tiden er anslaatt av lengden, med et gulv. */
function les(tekst, fart){
  return new Promise(function(ok){
    if(!taleStottes){ ok(false); return; }
    const y = new SpeechSynthesisUtterance(String(tekst));
    /* Finner vi ingen norsk stemme i lista, setter vi likevel spraaket og
       lar nettleseren velge. Lista er tom en liten stund etter at sida er
       lastet i iOS, og en stum opplesning er verre enn en uttale som
       kanskje bommer paa «skjegg». */
    if(stemme) y.voice = stemme;
    y.lang = stemme ? stemme.lang : 'nb-NO';
    y.rate = fart || TALE_FART_ORD;
    y.pitch = TALE_TONE;
    let ferdig = false;
    const slutt = function(){
      if(ferdig) return;
      ferdig = true;
      clearTimeout(vakt);
      ok(true);
    };
    y.onend = slutt;
    y.onerror = slutt;
    /* Vakthunden maa foelge farten: sakte tale tar lengre tid, og en
       vakthund satt for kort ville klippet ordet midt i. */
    const vakt = setTimeout(slutt,
      Math.max(3500, String(tekst).length * 160 / (y.rate || 1)));
    window.speechSynthesis.speak(y);
  });
}

function pause(ms){
  return new Promise(function(ok){ setTimeout(ok, ms); });
}

function stopTale(){
  taleNr++;
  if(taleStottes) window.speechSynthesis.cancel();
}

/* Ord, setning, ord - i den rekkefoelgen, fordi det er slik laereren
   gjoer det, og fordi det siste ordet er det hun skriver etter. */
async function lesOppgave(annenSetning){
  if(!ov) return;
  const o = ordene()[ov.i];
  if(!o) return;
  stopTale();
  const mitt = taleNr;
  const s = o.setninger || [];
  const setning = s.length ? (annenSetning && s[1] ? s[1] : s[0]) : '';

  /* Punktum bak ordet. Et enkeltord uten tegn leses av de fleste stemmer
     med spoersmaalsaktig stigning paa slutten, som om det skulle kommet
     mer - og det er noe av det som gjoer uttalen unaturlig. Med punktum
     faller tonen, og ordet hoeres ferdig ut. */
  await les(o.ord + '.', TALE_FART_ORD);
  if(mitt !== taleNr) return;
  if(setning){
    await pause(PAUSE_MELLOM);
    if(mitt !== taleNr) return;
    await les(setning, TALE_FART_SETNING);
    if(mitt !== taleNr) return;
  }
  await pause(PAUSE_MELLOM);
  if(mitt !== taleNr) return;
  await les(o.ord + '.', TALE_FART_ORD);
}

function tegnOving(){
  const ord = ordene();
  $('teller').textContent = 'Ord ' + (ov.i + 1) + ' av ' + ord.length;
  $('overNr').textContent = String(ov.i + 1);
  $('nesteOrd').textContent = (ov.i + 1 >= ord.length) ? 'Ferdig' : 'Neste ord';
  $('robot').classList.add('leser');
  /* Uten setning sier han ordet to ganger og ingenting imellom. Det ser
     ut som en feil i opplesningen, og da skal det staa hva det er. */
  const o = ord[ov.i];
  $('utenSetning').hidden = !!(o && (o.setninger || []).length);
}

function startOving(){
  if(!ordene().length) return;
  ov = { i:0, hort:false };
  history.pushState({ fh:true, visning:'over' }, '');
  vis('over');
  si(REPLIKK.leser);
  tegnOving();
  /* Foerste opplesning MAA starte i trykket som kom hit: iOS gir ikke
     talesyntesen lov til aa si noe uten en brukerhandling bak seg. Den
     gaar derfor med det vi har naa, ogsaa uten stemme - `lang` alene gir
     som regel riktig uttale. */
  lesOppgave(false);

  /* Lista fylles i sitt eget tempo, og paa noen enheter foerst ETTER det
     foerste kallet til speak(). Derfor leter vi videre her, og leser
     ordet om igjen med riktig stemme hvis den dukker opp underveis. */
  settTaleVarsel();
  const utenStemme = !stemme;
  letEtterStemme(function(){
    settTaleVarsel();
    if(utenStemme && stemme && ov && ov.i === 0) lesOppgave(false);
  });
}

/* Veien til stemmen er forskjellig per plattform, og en beskjed som
   viser feil vei er verre enn ingen: da leter man der det ikke er noe.
   iPadOS oppgir seg selv som Macintosh siden iPadOS 13 - antall
   beroeringspunkter er det som skiller dem. */
function stemmeVei(){
  const ua = navigator.userAgent || '';
  const berorer = (navigator.maxTouchPoints || 0) > 1;
  if(/iPhone|iPod/.test(ua) || (/iPad|Macintosh/.test(ua) && berorer)){
    return 'Den legges til under Innstillinger → Tilgjengelighet → Talt innhold '
         + '→ Stemmer → Norsk bokmål.';
  }
  if(/Macintosh|Mac OS X/.test(ua)){
    return 'Den legges til under Systeminnstillinger → Tilgjengelighet → Talt innhold '
         + '→ Systemstemme → Tilpass → Norsk bokmål.';
  }
  if(/Windows/.test(ua)){
    /* Chrome og Edge paa Windows henter stemmene fra operativsystemet, og
       den norske foelger med spraakpakken - ikke med nettleseren. */
    return 'På Windows følger stemmen med språkpakken: Innstillinger → Tid og språk '
         + '→ Språk og område → Legg til språk → Norsk bokmål, og huk av for Tale. '
         + 'Start nettleseren på nytt etterpå.';
  }
  if(/Android/.test(ua)){
    return 'På Android ligger den under Innstillinger → System → Språk → '
         + 'Tekst-til-tale → Installer taledata → Norsk.';
  }
  return 'Den følger med språkpakken for norsk i operativsystemet.';
}

function settTaleVarsel(){
  /* Velgeren vises bare naar det FINNES noe aa velge mellom. Én stemme
     er ikke et valg, det er en opplysning. */
  const rad = $('stemmerad');
  rad.hidden = norskeStemmer.length < 2;
  if(!rad.hidden){
    const na = stemme ? (stemme.voiceURI || stemme.name) : '';
    const valg = $('stemmeValg');
    const foer = valg.value;
    valg.innerHTML = norskeStemmer.map(function(v){
      const id = v.voiceURI || v.name;
      return '<option value="' + esc(id) + '"' + (id === na ? ' selected' : '') + '>'
           + esc(v.name || id) + '</option>';
    }).join('');
    if(foer && foer !== valg.value && norskeStemmer.some(function(v){
      return (v.voiceURI || v.name) === foer;
    })) valg.value = foer;
  }

  const el = $('taleAv');
  if(!taleStottes){
    el.textContent = 'Denne nettleseren kan ikke lese høyt. Prøv på iPad eller iPhone, '
                   + 'eller be noen lese ordene fra lista.';
    el.hidden = false;
    return;
  }
  if(!stemme){
    /* HVA enheten faktisk har staar i beskjeden. Uten det er «ikke norsk
       stemme» en paastand det ikke gaar an aa gjoere noe med; med det ser
       man med én gang om lista er tom, eller full av andre spraak. */
    const funn = stemmeFunn.length
      ? stemmeFunn.slice(0, 8).map(function(v){ return v.lang || '?'; }).join(', ')
        + (stemmeFunn.length > 8 ? ' …' : '')
      : 'ingen i det hele tatt';
    el.textContent = 'Jeg fant ingen norsk stemme her, så uttalen kan bli rar. '
                   + 'Enheten har ' + stemmeFunn.length + ' stemmer: ' + funn + '. '
                   + stemmeVei();
    el.hidden = false;
    return;
  }
  el.hidden = true;
}

/* Et bytte skal hoeres med én gang - det er hele poenget med aa kunne
   velge. Valget huskes paa enheten, ikke i KV: stemmene finnes ikke paa
   tvers av enheter, saa et valg gjort paa iPaden betyr ingenting paa PC. */
$('stemmeValg').addEventListener('change', function(){
  const id = this.value;
  try{ localStorage.setItem(VALGT_STEMME, id); }catch(e){}
  const ny = norskeStemmer.filter(function(v){
    return (v.voiceURI || v.name) === id;
  })[0];
  if(ny) stemme = ny;
  if(ov) lesOppgave(false);
});

/* ============================================================
   Lesing av arket
   ------------------------------------------------------------
   FASITEN SENDES IKKE MED. Modellen faar bildet, antall rader og
   ingenting annet. Vet den hva det skal staa, leser den det den
   venter aa se, og en feil hun faktisk gjorde ville forsvunnet.
   Sammenligningen skjer her nede, som ren tegnsammenligning.
   ============================================================ */

const BILDE_MAKS = 1600;      /* lengste side, piksler */
const BILDE_KVAL = 0.88;      /* JPEG-kvalitet - hoeyere enn ellers i huset:
                                 det er blyant paa papir som skal leses */

function krympBilde(fil){
  return new Promise(function(ok, nei){
    const les = new FileReader();
    les.onerror = function(){ nei(new Error('Kunne ikke lese bildet')); };
    les.onload = function(){
      const bil = new Image();
      bil.onerror = function(){ nei(new Error('Kunne ikke tolke bildet')); };
      bil.onload = function(){
        const skala = Math.min(1, BILDE_MAKS / Math.max(bil.width, bil.height));
        const b = Math.round(bil.width * skala);
        const h = Math.round(bil.height * skala);
        const lerret = document.createElement('canvas');
        lerret.width = b; lerret.height = h;
        const t = lerret.getContext('2d');
        /* Hvit bunn: et gjennomsiktig bilde blir svart som JPEG. */
        t.fillStyle = '#FFFFFF';
        t.fillRect(0, 0, b, h);
        t.drawImage(bil, 0, 0, b, h);
        ok(lerret.toDataURL('image/jpeg', BILDE_KVAL));
      };
      bil.src = String(les.result);
    };
    les.readAsDataURL(fil);
  });
}

async function lesArk(dataUrl, antall){
  const svar = await neam({
    model: MODELL,
    max_tokens: 1200,
    system: 'Du leser håndskrift i ruter og svarer bare med JSON. Du gjetter aldri '
          + 'hva et ord skal være - du rapporterer bare hvilket tegn som står i hver rute.',
    messages: [{ role:'user', content:[
      { type:'image', source:{ type:'base64', media_type:'image/jpeg',
                               data: dataUrl.split(',')[1] || '' } },
      { type:'text', text:
          'Dette er et diktatark med ' + antall + ' nummererte rader. Hver rad har en '
        + 'rekke tomme ruter, og et barn har skrevet ett håndskrevet tegn i noen av dem.\n\n'
        + 'Hver rute har to trykte skrivelinjer: en stiplet hjelpelinje øverst og en '
        + 'heltrukket hovedlinje under den. Linjene er trykt på arket og er ALDRI tegn – '
        + 'en rute med bare linjer i er tom. Bruk dem til å se høyden på bokstaven: små '
        + 'bokstaver fyller feltet mellom linjene, høye bokstaver går opp til toppen av '
        + 'ruta, og g, j, p og y henger under hovedlinja.\n\n'
        + 'Les hver rad for seg, fra venstre mot høyre, og rapporter hva som står i hver '
        + 'rute.\n\n'
        + 'Regler:\n'
        + '- Rapporter tegn for tegn. Sett ikke sammen ord, og rett ikke opp noe.\n'
        + '- En tom rute rapporteres som tom streng.\n'
        + '- STORE OG SMÅ BOKSTAVER SPILLER INGEN ROLLE. Mange bokstaver har samme '
        + 'form i begge størrelser – P og p, Y og y, S og s, O og o, C, V, W, X, Z – '
        + 'og inne i en rute finnes det ingen skrivelinje å måle høyden mot. Kan du '
        + 'ikke se forskjell, velger du bare én av dem. Det blir aldri regnet som '
        + 'feil, og det er ALDRI en grunn til å merke ruta som usikker.\n'
        + '- LODDRETTE STREKER SKAL IKKE MERKES USIKRE. En strek uten prikk kan '
        + 'være både en l og en stor I, og det er umulig å avgjøre i en rute. '
        + 'Rapporter den som l og gå videre – de regnes som samme tegn her. Har '
        + 'streken en prikk over seg, er det en i.\n'
        + '- Bruk usikre-lista bare når du ikke vet hvilken bokstav det er i det '
        + 'hele tatt – når skriften er så utydelig at den kan være hva som helst. '
        + 'Er du bare litt i tvil, oppgir du tegnet uten å merke det. Hver rute som '
        + 'merkes må et barn svare på etterpå, så listen skal være kort. På et ark '
        + 'med tydelig barneskrift skal den som regel være tom.\n'
        + '- Merker du en rute som usikker, oppgir du likevel det du tror står der.\n'
        + '- Sett ikke sammen ord, og gjett deg ikke til et ord som gir mening. '
        + 'Rapporter det som faktisk står i ruta.\n\n'
        + 'Svar BARE med JSON på formen:\n'
        + '{"rader":[{"nr":1,"bokstaver":["s","o","l","",""],"usikre":[2]}]}'
      }
    ] }]
  });
  const d = somJson(svar);
  const rader = (d && d.rader) || [];
  const ut = [];
  for(let i = 0; i < antall; i++){
    /* Raden med riktig nummer, ellers den paa samme plass. Radnummeret i
       margen er der nettopp for dette: et skjevt bilde skal ikke kunne
       forskyve rad tre til ord to. */
    const r = rader.filter(function(x){ return Number(x && x.nr) === i + 1; })[0]
           || rader[i] || {};
    ut.push({
      skrevet: (Array.isArray(r.bokstaver) ? r.bokstaver : []).map(function(b){
        return String(b == null ? '' : b).trim();
      }),
      usikre: (Array.isArray(r.usikre) ? r.usikre : []).map(Number)
                .filter(function(n){ return n >= 0; })
    });
  }
  return ut;
}
